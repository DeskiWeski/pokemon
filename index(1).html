function person(c,x0,y0,L,dir,fr,s){

  const dk=(col)=>col;

  if(side){r(5,12+lf,3,3-lf,pn);r(8,12+rf,3,3-rf,pn);r(5,14,3,1,'#1d1a22');r(8,14,3,1,'#1d1a22');}
  else{r(5,12+lf,3,3-lf,pn);r(8,12+rf,3,3-rf,pn);r(5,14,3,1,'#1d1a22');r(8,14,3,1,'#1d1a22');}
  // torso + arms
  if(side){
    r(5-w,8,6+w*2,5,sh);r(5-w,8,6+w*2,1,'#ffffff22');r(5-w,12,6+w*2,1,'#0003');
    r(6,8+(fr?1:0),3,4,sh);r(6,8+(fr?1:0),3,1,'#ffffff22');r(7,12+(fr?1:0),1,1,sk);
  }else{
    r(4-w,8,8+w*2,5,sh);r(4-w,8,8+w*2,1,'#ffffff22');r(4-w,12,8+w*2,1,'#0003');r(7,8,2,2,dir===0?'#0003':'#0000');
    r(3-w,8+(fr===1?1:0),1,4,sh);r(12+w,8+(fr===2?1:0),1,4,sh);
    r(3-w,12+(fr===1?1:0),1,1,sk);r(12+w,12+(fr===2?1:0),1,1,sk);
    if(L.stripe){r(4-w,10,8+w*2,1,L.stripe);}
  }
  // head
  if(side){
    r(4,1,7,7,sk);r(3,5,1,1,sk);r(10,4,1,2,sk);
    if(st!=='bald')r(8,0,3,6,hr);

    if(st==='long'){r(9,5,2,4,hr);}
    if(st==='fro')r(3,0,9,4,hr);
    if(st==='mohawk'){r(5,0,5,1,hr);r(6,-0,3,1,hr);}
    r(5,4,1,2,'#111');
    if(ac.includes('shades'))r(4,4,4,2,'#111');
    if(ac.includes('mask')){r(4,3,6,3,'#151515');r(5,4,2,1,'#fff');r(5,4,1,1,'#111');}
    if(ac.includes('beard'))r(4,6,6,2,hr);
    if(ac.includes('chin'))r(3,7,5,2,sk);
    if(st==='beanie'){r(4,0,7,3,L.hc||'#333');r(4,3,7,1,'#555');}
    if(st==='bandana'){r(4,1,7,2,L.hc||'#d22');r(10,2,2,2,L.hc||'#d22');}
    if(ac.includes('cig')){r(2,6,3,1,'#f4f4f0');r(1,6,1,1,'#ff6a1a');}
    if(ac.includes('scar'))r(6,2,1,3,'#b55');
  }else{
    r(4,1,8,7,sk);r(3,4,1,2,sk);r(12,4,1,2,sk);
    if(dir===0){
      r(6,4,1,2,'#111');r(9,4,1,2,'#111');r(7,6,2,1,'#8a3a2a');
      if(st==='short'||st==='long'){r(4,0,8,3,hr);r(4,3,1,1,hr);r(11,3,1,1,hr);}
      if(st==='buzz'){r(4,1,8,2,hr);}
      if(st==='bald')r(5,1,3,1,'#ffffff55');
      if(st==='mohawk'){r(7,0,2,3,hr);r(4,1,8,1,'#0002');}
      if(st==='long'){r(3,3,1,6,hr);r(12,3,1,6,hr);}
      if(st==='fro')r(3,0,10,4,hr);
      if(st==='beanie'){r(4,0,8,3,L.hc||'#333');r(4,3,8,1,'#555');}
      if(st==='bandana'){r(4,1,8,2,L.hc||'#d22');r(4,3,8,1,'#0002');}
      if(ac.includes('scar'))r(10,2,1,3,'#b55');
      if(ac.includes('shades'))r(5,4,6,2,'#111');
      if(ac.includes('mask')){r(4,3,8,3,'#151515');r(5,4,2,1,'#fff');r(9,4,2,1,'#fff');r(6,4,1,1,'#111');r(10,4,1,1,'#111');}
      if(ac.includes('beard')){r(5,6,6,2,hr);r(7,6,2,1,'#8a3a2a');}
      if(ac.includes('chin')){r(5,7,6,2,sk);r(6,8,4,1,'#0003');}
      if(ac.includes('cig')){r(10,6,4,1,'#f4f4f0');r(14,6,1,1,'#ff6a1a');}
    }else{
      if(st!=='bald')r(4,0,8,6,hr);
      if(st==='long'){r(3,3,1,6,hr);r(12,3,1,6,hr);}
      if(st==='fro')r(3,0,10,5,hr);
      if(st==='beanie'){r(4,0,8,3,L.hc||'#333');r(4,3,8,1,'#555');}
      if(st==='bandana'){r(4,1,8,2,L.hc||'#d22');r(4,3,8,2,hr);}
      if(st==='bald')r(5,1,3,1,'#ffffff55');
      if(ac.includes('mask'))r(4,3,8,1,'#151515');
    }
    if(ac.includes('crown')){r(5,1,6,1,'#ffd23a');r(5,0,1,1,'#ffd23a');r(7,0,2,1,'#ffd23a');r(10,0,1,1,'#ffd23a');r(7,0,1,1,'#fff6a0');}
  }
  if(ac.includes('crown')&&side){r(5,1,5,1,'#ffd23a');r(5,0,1,1,'#ffd23a');r(7,0,1,1,'#ffd23a');r(9,0,1,1,'#ffd23a');}
  if(ac.includes('smoke')){r(1,0,3,2,'#d0cbd8');r(12,1,3,2,'#bdb7c8');r(2,2,2,1,'#9a94a8');r(13,3,2,1,'#9a94a8');}
}

  run(gen){this.g=gen;this.wait=0;this.cond=null;},
  update(){
    if(!this.g)return;
    if(this.wait>0){this.wait--;return;}
    if(this.cond){if(!this.cond())return;this.cond=null;}
    const gen=this.g,r=gen.next();
    if(r.done){if(this.g===gen)this.g=null;return;}
    const v=r.value;
    if(typeof v==='number')this.wait=v;else if(typeof v==='function')this.cond=v;
  }
};

function startBattle(o){

  WS().stats.fights++;
  if(o.boss==='pBones'){o.foes.forEach(f=>{if(G.flags.bonesMad){f.l=Math.min(100,f.l+3);mstat(f);f.hp=f.mhp;}else if(G.flags.bonesFriend){f.l=Math.max(1,f.l-2);mstat(f);f.hp=f.mhp;}});}
  const foes=o.foes.map(f=>{resetTemp(f);return f;});
  G.gang.forEach(resetTemp);
  const SQ=o.squad?G.gang.map((m,i)=>i).filter(i=>alive(G.gang[i])).slice(0,o.squad):null;
  const first=SQ?SQ[0]:G.gang.findIndex(alive);
  B={o,foes,fi:0,em:foes[0],pm:G.gang[first],part:new Set(),trainer:!!o.tr,boss:!!o.boss,
     off:{p:{x:0,y:0,a:1,fl:0,vx:-90},e:{x:0,y:0,a:1,fl:0,vx:90}},proj:null,hint:null,choice:null,t:0,dizzy:{p:0,e:0},res:null,intro:true,env:battleEnv(),
     chain:0,guard:0,used:{},card:null,ei:-1,tele:null,solo:!!o.solo,turn:0,ep:{last:null,n:0}};
  B.squad=SQ;B.part.add(B.pm);
  G.mode='battle';Fx.fade=1;Fx.st=2;playSong(B.boss?'boss':'battle');
  Say.clear();Menus.length=0;

}
function* battleMain(){
  yield* intro();
  for(;;){
    const pc=yield* chooseAction();
    const r=yield* resolveTurn(pc);
    if(r!=='continue'){yield* finish(r);return;}
  }
}
function* intro(){
  sfx.blip();
  for(let i=0;i<=56;i++){const k=i/56,e=1-(1-k)*(1-k);B.off.e.vx=90*(1-e);B.off.p.vx=-90*(1-e);yield 1;}   // walk in from opposite ends and meet
  B.off.e.vx=0;B.off.p.vx=0;
  const o=B.o;
  if(B.boss||o.card){B.card={t:110,n:o.cardName||B.em.nm,sub:o.sub||(B.boss?'POD BOSS':'ELITE'),lv:B.em.l};sfx.siren();Fx.shake=10;yield 70;
    if(typeof bossTrait==='function'){const bt=bossTrait();if(bt)yield* talk(`${B.em.nm}'s thing: ${bt.n}. ${bt.d}`,40);}}
  if(B.trainer)yield* talk(o.pre2||`${o.name} wants to fight!`);
  else yield* talk(`A wild ${B.em.nm} the ${SP[B.em.s].n} appeared!`);
  if(B.trainer&&B.foes.length>1)yield* talk(`${o.name} sends out ${B.em.nm}!`);
  yield* talk(`${B.env.line}  [${B.env.tag}]`,40);
  yield* talk(`Go! ${B.pm.nm}!`);
  B.intro=false;
}
function* chooseAction(){

    B.choice=null;
    B.ei=enemyMove();B.tele=null;
    if(typeof tutorialTip==='function'&&!B.solo){if(B.turn===0)yield* tutorialTip('sta','Every move costs STAMINA (the yellow bar). Heavy shots cost more. Gassed fighters hit soft.');
      const ed0=M[(B.ei>=0?B.em.moves[B.ei].id:'struggle')];if(ed0.p>=70)yield* tutorialTip('guard','That warning means a HEAVY shot is coming. Pick GUARD: half damage, +35 STA, and you COUNTER.');
      if(B.chain>=3)yield* tutorialTip('fin','3-HIT CHAIN! Open FIGHT and pick the ★ FINISHER (40 STA).');
      if(G.crew&&typeof crewAbs==='function'&&crewAbs().length)yield* tutorialTip('crew','Your crew is here. CREW gives each member one ability per fight.');}
    {const ed=M[(B.ei>=0?B.em.moves[B.ei].id:'struggle')];if(ed.p>=70&&alive(B.em))B.tele=pick(TELE).replace('{e}',B.em.nm);}
    const items=[
      {l:'FIGHT',f:()=>openMoves()},{l:'GUARD',f:()=>{Menus.length=0;B.choice={t:'guard'};}},{l:'ARM',f:()=>openArms(),d:!(G.L&&G.L.arms&&G.L.arms.length)},
      {l:'GANG',f:()=>openGang(false),d:B.solo},{l:'BAG',f:()=>openBag()},{l:'CREW',f:()=>openCrewAb(),d:!crewAbs().length},
      {l:'DEAL',f:()=>openDeal(),d:B.trainer},{l:'RUN',f:()=>{Menus.length=0;B.choice={t:'run'};},d:B.trainer}
    ];
    items.forEach(i=>i.keep=1);
    openMenu({x:130,y:H-114,w:106,items,stay:true,nocancel:true,cur:B.lastCur||0,vis:8,onMove:c=>{B.lastCur=c;}});
    yield()=>B.choice!==null;
    return B.choice;
  }
}

  if(items.every(i=>i.d))items.push({l:'STRUGGLE',f:()=>{Menus.length=0;B.hint=null;B.choice={t:'move',i:-1};}});
  if(B.chain>=3)items.unshift({l:'★ FINISHER',r:B.pm.sta>=40?'READY':'GASSED',d:B.pm.sta<40,f:()=>{Menus.length=0;B.hint=null;B.choice={t:'fin'};}});
  openMenu({x:4,y:H-74,w:232,items,stay:true,vis:5,cancel:()=>{B.hint=null;},onMove:c=>{
    const it=items[c];if(it&&it.l==='★ FINISHER'){B.hint=('FINISHER: '+finName()+' (40 STA)').slice(0,38);return;}
    const mv=m.moves[B.chain>=3?c-1:c];if(!mv){B.hint=null;return;}const d=M[mv.id];
    B.hint=`${TYPES[d.t].n} ${d.p?'PWR '+d.p:'STATUS'} ${d.p>=85?'HEAVY':d.p?'LIGHT':''} STA ${staCost(d)} ${FXDESC[d.fx]||''}`;
  }});
}

/* ---- turn resolution ---- */
function enemyMove(){
  const e=B.em,p=B.pm;
  const opts=e.moves.map((mv,i)=>({mv,i})).filter(o=>o.mv.pp>0);
  if(!opts.length)return -1;
  const smart=B.boss||(B.trainer&&Math.random()<.6);
  const sc=opts.map(o=>{
    const d=M[o.mv.id];let s=1+Math.random()*(smart?.6:2.4);
    if(d.p){s+=d.p/20*typeMult(d.t,SP[p.s].t)*(SP[e.s].t===d.t?1.25:1);}
    else if(d.fx==='heal'){s+=e.hp<e.mhp*.4?5:-3;}
    else if(d.fx==='atkdown'){s+=p.sg.atk>-1?2.5:-2;}
    else if(d.fx==='defup'||d.fx==='atkup'||d.fx==='high'||d.fx==='drunkup'){s+=e.sg.atk<1&&e.sg.def<1?2:-2;}
    else if(d.fx==='accdown'){s+=p.sg.acc>-1?2:-2;}
    if(d.fx==='stunbonus'&&p.stn>0)s+=4;
    if(typeof patternBias==='function')s+=patternBias(e,d,p);
    return s;
  });
  let bi=0;sc.forEach((s,i)=>{if(s>sc[bi])bi=s>sc[bi]?i:bi;});
  B.ep.last=opts[bi].mv.id;
  return opts[bi].i;
}
function* resolveTurn(pc){
  let r=null;
  if(pc.t==='run'){
    const ch=clamp(.5+(B.pm.spd-B.em.spd)*.02,.25,.95);
    if(Math.random()<ch){yield* talk('Got away safely!');return 'run';}
    yield* talk("Can't get away!");
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='deal'){
    const res=yield* tryDeal(pc);
    if(res==='recruit')return 'recruit';
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='guard'){
    B.guard=1;B.pm.sta=Math.min(100,B.pm.sta+35);sfx.ok();
    yield* talk(pick([`${B.pm.nm} tucks the chin and covers up.`,`${B.pm.nm} raises the guard. Waiting...`,`${B.pm.nm} slows it down, breathes, hands high.`]),26);
    r=yield* enemyTurn();B.guard=0;return r||'continue';
  }
  if(pc.t==='crew'){
    yield* useCrewAb(pc.id);
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='fin'){
    yield* finisher();
    r=yield* checkFaints();if(r)return r;
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='switch'){
    const old=B.pm;
    yield* talk(`Come back, ${old.nm}!`,20);
    B.pm=G.gang[pc.i];B.part.add(B.pm);B.off.p.a=1;if(B.an&&B.an.p){B.an.p.ko=null;B.an.p.kb=0;}sfx.ok();
    yield* talk(`Go! ${B.pm.nm}!`,20);
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='item'){
    G.items[pc.id]--;
    yield* applyItem(pc.id,G.gang[pc.i],true);
    r=yield* enemyTurn();return r||'continue';
  }
  // move
  const pi=pc.i,ei=B.ei>=0&&B.em.moves[B.ei]&&B.em.moves[B.ei].pp>0?B.ei:enemyMove();B.ei=-1;
  const pmv=pc.t==='arm'?G.L.arms[pi]:(pi>=0?B.pm.moves[pi]:{id:'struggle',pp:1}),emv=ei>=0?B.em.moves[ei]:{id:'struggle',pp:1};
  const pp=(M[pmv.id].pri||0),ep=(M[emv.id].pri||0);
  const ps_=B.pm.spd*stageMul(B.pm.sg.spd||0),es_=B.em.spd*stageMul(B.em.sg.spd||0);
  let pFirst=pp!==ep?pp>ep:(ps_!==es_?ps_>es_:Math.random()<.5);
  const order=pFirst?[['p',pmv],['e',emv]]:[['e',emv],['p',pmv]];
  for(const [s,mv] of order){
    const att=s==='p'?B.pm:B.em;
    if(!alive(att))continue;
    if(s==='e'&&!alive(B.pm))continue;
    yield* execMove(s,mv);
    r=yield* checkFaints();
    if(r)return r;
    if(B.o.jump){yield* benchJump(s);r=yield* checkFaints();if(r)return r;}
  }
  r=yield* endTurn();
  return r||'continue';
}
function* enemyTurn(){
  const ei=B.ei>=0&&B.em.moves[B.ei]&&B.em.moves[B.ei].pp>0?B.ei:enemyMove();B.ei=-1;
  const mv=ei>=0?B.em.moves[ei]:{id:'struggle',pp:1};
  yield* execMove('e',mv);
  let r=yield* checkFaints();if(r)return r;
  if(B.o.jump){yield* benchJump('e');r=yield* checkFaints();if(r)return r;}
  return yield* endTurn();
}
function* endTurn(){
  for(const s of ['p','e']){
    const m=s==='p'?B.pm:B.em;
    if(!alive(m))continue;
    if(m.st==='bleed'){
      yield* hurt(s,Math.max(1,Math.floor(m.mhp/8)));sfx.hit();
      yield* talk(`${m.nm} is bleeding!`,24);
    }else if(m.st==='high'&&m.hp<m.mhp){
      m.hp=Math.min(m.mhp,m.hp+Math.max(1,Math.floor(m.mhp/16)));yield* talk(`${m.nm} is feeling nice and mellow.`,24);
    }
    if(m.shk>0)m.shk--;
    m.sta=Math.min(100,(m.sta||0)+12+(s==='p'&&m.s==='bandit'&&G.pl&&G.pl.tr&&G.pl.tr.cardio?8:0));
    if(s==='e'&&B.boss&&!m._rage&&m.hp<m.mhp*.35){m._rage=1;m.sg.atk=Math.min(3,m.sg.atk+1);m.sta=100;sfx.siren();Fx.shake=12;bcap(m.nm+' IS ENRAGED!',true);yield* talk(`${m.nm} roars. The whole pod goes quiet. He is not done.`,36);}
  }
  B.turn++;
  if(alive(B.em)&&alive(B.pm)&&typeof bossTrait==='function'){const bt=bossTrait();if(bt&&bt.turn)yield* bt.turn(B.em,B.pm);}
  if(B.smoke>0)B.smoke=Math.max(0,B.smoke-40);
  return yield* checkFaints();
}
function* setStatus(m,st,msg){
  if(m.st){yield* talk('It did not work. '+m.nm+' is already messed up.',26);return false;}
  m.st=st;yield* talk(msg,30);return true;
}
function* execMove(s,mvslot){
  const att=s==='p'?B.pm:B.em,def=s==='p'?B.em:B.pm,ds=s==='p'?'e':'p';
  const d=M[mvslot.id];
  if(att.stn>0){att.stn--;yield* talk(`${att.nm} is too dizzy to move!`,30);return;}
  if(att.st==='drunk'&&Math.random()<.25){sfx.miss();yield* talk(`${att.nm} stumbles around drunk!`,30);return;}
  if(mvslot.id!=='struggle'&&!d.eternal)mvslot.pp=Math.max(0,mvslot.pp-1);
  const cost=staCost(d),gassed=(att.sta||0)<cost;att.sta=Math.max(0,(att.sta||0)-cost);
  if(gassed&&d.p)yield* talk(pick([`${att.nm} is GASSED. Arms like noodles.`,`${att.nm} is sucking wind. That one has nothing on it.`]),26);
  if(d.fx==='lukey')yield* talk(`${att.nm} yells "I'LL GIVE YOU LUKEY!!"`,40);
  else yield* talk(d.s?storyLine(d,att,def,s):`${att.nm} used ${d.n}!`,d.s?44:28);
  // accuracy
  const E=B.env||BENV.pod;
  if(E.slip&&Math.random()<E.slip&&!d.self){sfx.miss();Fx.shake=8;yield* talk(pick(E.slipLines||['slips!']).replace('{a}',att.nm),30);yield* hurt(s,Math.max(1,Math.floor(att.mhp*.04)));return;}
  let acc=d.a*accMul(att.sg.acc)*E.acc*(gassed?.8:1);
  if(!d.self&&Math.random()*100>acc){if(s==='p')B.chain=0;if(d.p&&hasCombo(mvslot.id)&&R3.ok){yield* comboFight(s,mvslot.id,Math.max(1,d.p),true);}else if(d.p&&R3.ok){yield* lunge(s,mvslot.id,true);}sfx.miss();if(typeof plCount==='function'&&s==='e'&&def.s==='bandit')plCount('dodge',1);yield* talk('But it missed!',26);return;}
  // bottle fumble
  if(d.fx==='bottle'&&Math.random()<.22+E.fumble){yield* bottleFumble(s,att);return;}
  if(d.fx==='bottle')yield* bottleThrow(s);
  if(d.p){
    if(!hasCombo(mvslot.id))yield* lunge(s,mvslot.id);
    const crit=Math.random()<(((d.crit||att.shk>0)?.25:.0625)+E.crit+(att.s==='bandit'?(typeof plCrit==='function'?plCrit():0):0));
    let bonus=att.shk>0?1.3:1;
    if(d.fx==='stunbonus'&&def.stn>0)bonus*=2;
    if(d.fx==='lukey')bonus*=1;
    const A=att.atk*stageMul(att.sg.atk),D=def.def*stageMul(def.sg.def);
    const tm=typeMult(d.t,SP[def.s].t),stab=SP[att.s].t===d.t?1.25:1;
    let dmg=Math.floor(((2*att.l/5+2)*d.p*A/D)/50)+2;
    dmg=Math.max(1,Math.floor(dmg*tm*stab*(crit?1.6:1)*(.85+Math.random()*.15)*bonus*E.dmg*(E.big&&d.p>=95?E.big:1)*(gassed?.6:1)*(s==='e'&&B.guard?.45:1)*(s==='p'&&B.chain>=2?1.15:1)*((d.t==='SNK'&&typeof nightMod==='function')?nightMod():1)));
    let blocked=false;
    if(!crit&&d.p<100){
      const pB=s==='e'?(B.guard?1:0):((def.sg.def>0?.22+.12*def.sg.def:.08)+(SP[def.s].t==='MUS'?.06:0)+(B.boss?.1:0)+(def.stn>0?-1:0));
      if(Math.random()<pB){blocked=true;dmg=Math.max(1,Math.floor(dmg*(s==='e'&&B.guard?1:.6)));if(B.an&&B.an[ds])B.an[ds].blk=1;}
    }
    dmg=Math.min(dmg,def.hp);
    crit?sfx.crit():sfx.hit();
    if(typeof plCount==='function'){if(s==='p'&&att.s==='bandit'){plCount('hit',1);if(crit)plCount('crit',1);}if(s==='e'&&def.s==='bandit')plCount('taken',dmg);}
    if(d.fx==='lukey'){Fx.shake=16;Fx.flashCol='#4aa0ff';Fx.flash=8;}
    if(s==='e'&&B.guard){sfx.bump();Fx.shake=4;bcap('BLOCKED');}
    if(hasCombo(mvslot.id))yield* comboFight(s,mvslot.id,dmg,false);else yield* hurt(ds,dmg);
    if(B.an&&B.an[ds])B.an[ds].blk=0;
    if(blocked&&s==='p')yield* talk(pick([`${def.nm} covers up and eats it on the arms.`,`${def.nm} blocks most of it.`,`${def.nm} gets his guard up in time.`]),22);
    if(s==='p'){B.chain++;if(B.chain===3){bcap('3-HIT CHAIN!',true);sfx.level();}else if(B.chain>3)bcap(B.chain+'-HIT CHAIN');}
    else{B.chain=0;}
    if(crit)yield* talk('A critical hit!',22);
    if(s==='e'&&B.guard&&d.p>=70&&alive(def)&&alive(att)){yield* counterHit(def,att);}
    if(s==='e'&&alive(def)&&typeof bossTrait==='function'){const bt=bossTrait();if(bt&&bt.hit)yield* bt.hit(att,def);}
    if(d.p>=85&&dmg>=def.mhp*.2&&alive(def)&&Math.random()<.4&&!def.stn){def.stn=1;B.dizzy[ds]=90;Fx.shake=16;bcap('KNOCKDOWN!',true);sfx.slam();if(typeof b3Knockdown==='function'&&B.s3)b3Knockdown(ds);yield* talk(pick([`${def.nm} goes DOWN! The ref would have stopped it.`,`${def.nm} eats concrete. He is not getting up fast.`,`${def.nm} is flat on his back, counting ceiling tiles.`]),34);}
    if(d.drain&&alive(att)){const hl=Math.max(1,Math.floor(dmg*d.drain));att.hp=Math.min(att.mhp,att.hp+hl);yield* talk(`${att.nm} heals ${hl} HP!`,24);}
    if(d.w&&s==='p'&&mvslot.pp<=0&&!d.eternal){const ix=G.L.arms.indexOf(mvslot);if(ix>=0)G.L.arms.splice(ix,1);yield* talk(`The ${d.n} breaks apart!`,30);}
    if(alive(def)&&def.hp<def.mhp*.25&&!def._low){def._low=1;yield* talk(pick([`${def.nm} is spitting blood, barely on his feet!`,`${def.nm}'s knees buckle. One more good shot...`,`${def.nm} is swaying. The crowd smells blood.`]),34);}
    else if(alive(def)&&d.p>=85&&dmg>=def.mhp*.25)yield* talk(pick([`${def.nm} crashes hard. That one hurt.`,`${def.nm} hits the ground like a sack of laundry!`,`That one echoed off the walls!`]),30);
    if(tm>1)yield* talk("It's super effective!",24);else if(tm<1)yield* talk("It's not very effective...",24);
    if(d.fx==='recoil'){const rc=Math.max(1,Math.floor(dmg/4));yield* hurt(s,rc);yield* talk(`${att.nm} hurt itself in the process!`,24);}

    case 'atkup':att.sg.atk=Math.min(3,att.sg.atk+1);sfx.heal();yield* talk(`${att.nm}'s attack rose!`,26);break;
    case 'heal':{const h=Math.max(1,Math.floor(att.mhp*.4));att.hp=Math.min(att.mhp,att.hp+h);sfx.heal();yield* talk(`${att.nm} recovered health!`,26);break;}

function* applyFx(fx,c,att,def,ds,s){

    case 'defdown':if(hit){def.sg.def=Math.max(-3,def.sg.def-1);sfx.blip();yield* talk(`${def.nm}'s guard is broken! Defense fell!`,26);}break;
    case 'atkdown':if(hit){def.sg.atk=Math.max(-3,def.sg.atk-1);sfx.blip();yield* talk(`${def.nm} is rattled! Attack fell!`,26);}break;
    case 'accdown':if(hit){def.sg.acc=Math.max(-3,def.sg.acc-1);sfx.blip();yield* talk(`${def.nm} can't see straight! Accuracy fell!`,26);}break;
    case 'spddown':if(hit){def.sg.spd=Math.max(-3,(def.sg.spd||0)-1);sfx.blip();yield* talk(`${def.nm}'s legs are heavy! Speed fell!`,26);}break;

  }
}

  const want=K.b?4.2:2.3;Wd.spd=(Wd.spd||1.3)+(want-(Wd.spd||1.3))*.22;
  let sp=Wd.spd;
  Wd.px+=Wd.dx*Math.min(sp,Wd.mv);Wd.py+=Wd.dy*Math.min(sp,Wd.mv);const over=sp-Wd.mv;Wd.mv-=sp;
  if(Wd.mv<=0){
    G.x+=Wd.dx;G.y+=Wd.dy;Wd.px=G.x*T;Wd.py=G.y*T;Wd.mv=0;
    G.steps++;Wd.wk^=1;Wd.fr=Wd.wk?1:2;
    const mp=G.map;onStep();
    // keep walking without a hitch if the stick is still held and nothing interrupted us
    const d=heldDir();
    if(d>=0&&G.map===mp&&G.mode==='world'&&!Say.on&&!Menus.length&&!Cs.g&&!busy()&&!Pr.a&&!Pr.start){
      if(tryMove(d)&&over>0){Wd.px+=Wd.dx*over;Wd.py+=Wd.dy*over;Wd.mv-=over;}
    }else if(d<0)Wd.spd=Math.max(1.3,Wd.spd*.6);
  }
}
function onStep(){
  const m=cur();if(typeof livingStep==='function')livingStep();if(typeof world2Step==='function')world2Step();
  const w=m.warps.find(w=>w.x===G.x&&w.y===G.y);
  if(w){doWarp(w);return;}
  const it=m.items.find(i=>i.x===G.x&&i.y===G.y&&!G.flags['got_'+i.id]);
  if(it){
    G.flags['got_'+it.id]=1;G.items[it.it]=(G.items[it.it]||0)+it.n;sfx.pick();
    say(`Found ${it.n>1?it.n+' ':''}${IT[it.it].n}${it.it==='cigs'&&it.n>1?'':''}!`+(it.it==='perogi'?' Baba would be proud.':''));
    return;
  }
  if(checkSight())return;
  if(typeof gangJumpCheck==='function'&&G.steps>Wd.noEnc&&gangJumpCheck())return;
  if(ENC.has(tileAt(m,G.x,G.y))&&m.enc&&G.steps>Wd.noEnc&&Math.random()<.12)startWild();
}
function doWarp(w){
  if(w.req&&!G.flags[w.req]){
    Cs.run(function*(){
      sfx.bump();yield* talk(w.deny,0);
      G.x=Wd.lx;G.y=Wd.ly;Wd.px=G.x*T;Wd.py=G.y*T;
    }());
    return;
  }
  sfx.door();
  fadeTo(()=>{enterMap(w.to,w.tx,w.ty,w.dir);Cs.run((function*(){yield 20;checkSight();})());});
}
function checkSight(){
  const m=cur();
  for(const n of npcsHere()){
    if(!n.tr||defeated(n))continue;
    for(let k=1;k<=n.tr.sight;k++){
      const x=n.x+DX[n.dir]*k,y=n.y+DY[n.dir]*k;
      if(x===G.x&&y===G.y){Cs.run(challenge(n));return true;}
      if(SOLID.has(tileAt(m,x,y))||npcAt(x,y))break;
    }
  }
  return false;
}
function* npcStep(n,d){
  n.dir=d;const tx=n.x+DX[d],ty=n.y+DY[d];
  for(let i=0;i<8;i++){n.px+=DX[d]*2;n.py+=DY[d]*2;yield 1;}
  n.x=tx;n.y=ty;n.px=tx*T;n.py=ty*T;
}
function faceTo(n,x,y){
  const dx=x-n.x,dy=y-n.y;
  n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0);
}
function* challenge(n){
  n.excl=34;sfx.crit();yield 38;n.excl=0;
  while(Math.abs(n.x-G.x)+Math.abs(n.y-G.y)>1){
    const dx=G.x-n.x,dy=G.y-n.y;
    let d;if(Math.abs(dx)>Math.abs(dy)||dy===0)d=dx<0?2:3;else d=dy<0?1:0;
    if(blocked(n.x+DX[d],n.y+DY[d])){break;}
    yield* npcStep(n,d);
  }
  faceTo(n,G.x,G.y);G.dir=({0:1,1:0,2:3,3:2})[n.dir];
  yield* talk(n.tr.pre,0);
  if(n.tr.gag){
    yield* talk('Dougie winds up a bottle for a big throw... "Watch this!"',0);
    sfx.bottle();yield 20;
    yield* talk('The bottle slips behind him and comes right back down!',0);
    sfx.ow();Fx.shake=22;Fx.flashCol='#ffd23a';Fx.flash=6;yield 22;
    yield* talk('CLONK!! Right in the nuts!!!',0);
    n.tr.hurt=1;
  }
  yield* fight(n);
}
function* fight(n){
  let res=null,rec=null;
  const foes=n.tr.team.map(([s,l,nm])=>mkMon(s,l,nm));
  if(n.tr.hurt){foes[0].hp=Math.max(1,foes[0].hp-Math.floor(foes[0].mhp*.25));n.tr.hurt=0;}
  fadeTo(()=>startBattle({tr:n.tr,name:n.tr.name,look:n.look,npcId:n.id,foes,boss:n.boss||null,done:(r,m)=>{res=r;rec=m;G.mode='world';}}));
  yield()=>res!==null;

    if(G.crew){G.crew.wins=(G.crew.wins||0)+1;crewGain(n.boss?60:(n.tr.team.length>1?30:14));}
    if(n.tr.join)yield* talk(`${n.tr.name} respects you now. Maybe ask him to join your crew once you have one.`,0);
    if(n.boss==='pSmokey'){yield* talk('SmokeyBooty drops to a knee. The whole pod goes quiet. That is ALL EIGHT PATCHES.',0);yield* talk('A guard leans in: "Kowalski wants to see you. Southeast tower. Tonight."',0);return;}
    if(n.boss)yield* talk(`The ${PATCHES.filter(p=>G.flags[p]).length} patch${PATCHES.filter(p=>G.flags[p]).length>1?'es':''} on your jumpsuit show everyone who runs this place.`,0);
  }else if(res==='lose'){yield* whiteout();}
}
function* whiteout(){
  G.flags.lostOnce=1;
  fadeTo(null);yield()=>Fx.fade>=1;Fx.st=0;
  G.items.cigs=Math.floor(G.items.cigs/2);G.gang.forEach(m=>{m.hp=m.mhp;m.st=null;});

function startWild(){
  const m=cur(),tot=m.enc.reduce((a,e)=>a+e[3],0);let r=Math.random()*tot,e=m.enc[0];
  for(const x of m.enc){r-=x[3];if(r<=0){e=x;break;}}
  const foe=mkMon(e[0],ri(e[1],e[2]),pick(WILDNAMES));
  Cs.run((function*(){
    sfx.crit();Fx.flashCol='#fff';Fx.flash=8;yield 20;

const FLAVOR={[TL.TV]:['Daytime TV. Somebody is yelling about a paternity test.','The TV only gets one channel. It is the news about the Browns.'],

  [TL.LAUND]:['A washing machine. Orange. All the clothes are orange.'],[TL.BED]:['A hospital bed. Clean sheets. A luxury.'],[TL.TABLE]:['A steel table bolted to the floor.'],
  [TL.GATE]:['A steel gate. Locked.'],[TL.FENCE]:['Chain-link. Razor wire on top. Not today.'],[TL.WIRE]:['Razor wire. Hard pass.'],[TL.TOWER]:['A guard tower. A guard waves. You do not wave back.']};
function interact(){
  const m=cur(),fx=G.x+DX[G.dir],fy=G.y+DY[G.dir];
  let n=npcAt(fx,fy);
  if(!n&&tileAt(m,fx,fy)===TL.COUNTER){const n2=npcAt(fx+DX[G.dir],fy+DY[G.dir]);if(n2&&n2.reach)n=n2;}
  if(n){faceTo(n,G.x,G.y);talkNpc(n);return;}
  const t=tileAt(m,fx,fy);
  if(t===TL.TRAY){tray(fx,fy);return;}
  if(t===TL.WEIGHT&&(G.map==='gym'||G.map==='yard')){trainStart();return;}
  if(t===34&&typeof stationAt==='function'){const st=stationAt(fx,fy);if(st){stationStart(st);return;}}
  if(t===33&&G.map==='tier2'&&typeof fishLine==='function'){fishLine();return;}
  if(t===TL.BUNK){sleepPrompt();return;}
  if((t===TL.SHOWER||t===TL.LOCKER||t===TL.CRATE||t===TL.SHELF||t===TL.LAUND||t===TL.SINK)&&typeof searchSpot==='function'){WS().stats.search++;if(typeof tunnelSearch==='function'&&tunnelSearch(t,fx,fy))return;if(searchSpot(t,fx,fy))return;}
  if(FLAVOR[t])say(pick(FLAVOR[t]));
}
function tray(x,y){
  const key=G.map+x+'_'+y;
  if((G.trays[key]||0)>G.steps){say('The tray is empty. The tray ladies are glaring at you.');return;}
  G.trays[key]=G.steps+260;
  const r=Math.random();
  if(r<.45){G.items.perogi++;sfx.pick();say('You sneak a hot perogi off the tray! Potato and cheese.');}
  else if(r<.7){G.items.perogi+=2;sfx.pick();say('Jackpot! Two fresh perogis, still steaming!');}
  else if(r<.84){G.items.shark=(G.items.shark||0)+1;sfx.pick();say('A SHARK CARD taped under the tray! Bonus!');}
  else if(r<.9){G.items.cigs+=2;sfx.pick();say('No perogis, but somebody left 2 L&M packs under the tray.');}
  else say('Cold mashed potatoes. The ladies laugh at you.');
}
function talkNpc(n){
  if(n.br)return brawlInteract(n);
  if(typeof questHook==='function'&&questHook(n))return;
  if(n.say&&typeof guardTalk==='function'&&guardTalk(n))return;
  if(n.tr){
    if(defeated(n)){
      if(n.tr.join&&!G.flags['gone_'+n.id]){openMenu({x:100,y:60,w:136,title:n.tr.name.toUpperCase().slice(0,18),items:[{l:'TALK',f:()=>say(n.tr.post||'...')},{l:'ASK TO JOIN',f:()=>askStory(n)},{l:'LEAVE',f:()=>{}}]});return;}
      say(n.tr.post||'...');return;}
    Cs.run((function*(){yield* challenge(n);})());return;
  }
  const s=n.say||['...'];
  if(n.act&&typeof LVACT!=='undefined'&&LVACT[n.act])return LVACT[n.act](n);
  if(s[0]==='inmate')return talkInmate(n);
  if(s[0]==='intake')return officer();
  if(s[0]==='baba')return baba();
  if(s[0]==='corey')return corey();
  if(s[0]==='nurse')return nurse();
  if(s[0]==='steph')return steph();
  s.forEach(t=>say(t));
}

  if(Menus.length){menuUpdate();return;}
  if(Cs.g){Cs.update();return;}
  if(busy())return;
  if(Wd.mv>0){stepMove();return;}
  Wd.fr=0;if(heldDir()<0)Wd.spd=0;

function mkLook(R){
  const pk=a=>a[Math.floor(R()*a.length)];
  const L={sk:pk(SKIN),hr:pk(HAIRC),st:pk(STY),hc:pk(HATC),sh:R()<.12?pk(['#4a6aa8','#e8e8ea','#6a8a5a']):'#e8731c',ac:[],w:R()<.28};
  if(L.sh==='#e8731c')L.pn=pk(['#e8731c','#e8731c','#d4651a','#c25a14']);
  if(L.st==='bald')L.hr=L.sk;
  if(R()<.18)L.ac.push('beard');
  if(R()<.1)L.ac.push('glasses');
  if(R()<.07)L.ac.push('scar');
  if(R()<.1&&!L.ac.includes('glasses'))L.ac.push('shades');
  if(R()<.12)L.ac.push('cig');
  if(R()<.025)L.ac.push('crazy');
  if(R()<.02)L.ac.push('chin');
  if(R()<.04&&L.st!=='beanie'&&L.st!=='cap')L.ac.push('hat');
  if(R()<.2)L.sleeve='#f2f0e8';
  return L;
}

function stepWalk(br){
  const a=br.a,b=br.b;
  // sliding between tiles
  if(a.px!==a.x*T||a.py!==a.y*T){
    const sx=Math.sign(a.x*T-a.px),sy=Math.sign(a.y*T-a.py);
    a.px+=sx*Math.min(1.7,Math.abs(a.x*T-a.px));a.py+=sy*Math.min(1.7,Math.abs(a.y*T-a.py));
    a.br.ph+=.5;return;
  }
  const dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)+Math.abs(dy)<=1){br.st='fight';br.t=0;a.br.ph=0;faceTo(a,b.x,b.y);faceTo(b,a.x,a.y);
    // crowd reacts
    npcsHere().forEach(n=>{if(n!==a&&n!==b&&!n.br&&Math.abs(n.x-a.x)+Math.abs(n.y-a.y)<=7&&n.say){faceTo(n,a.x,a.y);if(Math.random()<.4)n.excl=30;}});
    sfx.crit();return;}
  const opts=Math.abs(dx)>=Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];
  for(const [sx,sy] of opts){
    if(!sx&&!sy)continue;
    if(freeTile(a.x+sx,a.y+sy,null)){a.x+=sx;a.y+=sy;a.dir=sx<0?2:sx>0?3:sy<0?1:0;return;}
  }
  if(++br.t>40)brawlStop(br,true); // boxed in, give up
}

  if(Pr.down){NM.cy=(NM.cy+1)%NM.rows.length;sfx.blip();}
  if(Pr.left){NM.cx=(NM.cx+8)%9;sfx.blip();}
  if(Pr.right){NM.cx=(NM.cx+1)%9;sfx.blip();}
  if(Pr.a){const ch=NM.rows[NM.cy][NM.cx];if(NM.buf.length<14){NM.buf+=ch;sfx.ok();}else sfx.miss();}
  if(Pr.b){NM.buf=NM.buf.slice(0,-1);sfx.blip();}
  if(Pr.start){const nm=NM.buf.trim();if(nm.length>=2){const cb=NM.cb;NM.cb=null;G.mode='world';sfx.level();cb&&cb(nm);}else sfx.miss();}
}

/* ---- asking people to join ---- */
const PAY={greedy:6,hustler:5,lawyer:4,critic:3};
function joinReq(c){
  const z=zoneNow(),d=z.d||0,hard=['hot','scrap','grump'].includes(c.temp)||c.tr==='tough';
  return {bond:2+Math.round(d*5)+(hard?2:0),resp:Math.round(d*9),beat:hard,pay:PAY[c.tr]||0};
}
function askJoin(c,n){
  const nm=c.nm,v=vv(),mt=metOf(c.id);
  if(!G.crew){say(`${nm}: Roll with YOU? You are one guy. No crew, no name, no banner.`);say(`${nm}: Come back when people know who you run with.`);return;}
  if(G.gang.length>=crewCap()){say(`${nm}: I like it, but ${G.crew.name} is full right now.`);say(`(Crew level ${G.crew.lv} fits ${crewCap()} fighters. Level the crew up with gang fights and boss wins.)`);return;}
  const R=joinReq(c),bond=mt.bond||0;
  if(R.beat&&!mt.beat){say(`${nm}: I only follow someone who can put me down. Prove it. Fight me.`);return;}
  if(bond<R.bond){say(`${nm}: I do not know you well enough yet. (Bond ${bond}/${R.bond}) Talk. Joke. Share a beer. Earn it.`);return;}
  if(v.resp<R.resp){say(`${nm}: You are not somebody yet. Get more respect around here. (Respect ${v.resp}/${R.resp})`);return;}
  if(R.pay&&G.items.cigs<R.pay){say(`${nm}: My loyalty costs ${R.pay} L&M. You are short.`);return;}
  ask(`${nm} will join ${G.crew.name}${R.pay?' for '+R.pay+' L&M':''}. Deal?`,()=>{
    if(R.pay)G.items.cigs-=R.pay;
    const z=zoneNow(),sp=pick(z.sp),lv=Math.max(3,ri(z.lv[0],z.lv[1]));
    const mon=mkMon(sp,lv,nm.split(' ').pop().slice(0,10));mon.who=c.id;mon.hp=mon.mhp;
    G.gang.push(mon);G.flags['gone_'+n.id]=1;sfx.caught();
    say(`${nm}: ${pk(["I'm in.","Finally. Somebody with a plan.","Do I get a jacket? I want a jacket.","Count me in. Do not make it weird."])}`);
    say(`${mon.nm} joins ${G.crew.name}!`);
    crewGain(15);
  });
}
function askStory(n){
  const nm=n.tr.name;
  if(!G.crew){say(`${nm}: You beat me fair. But a crew? You are one guy. Come back when you have a name and a banner.`);return;}
  if(G.gang.length>=crewCap()){say(`${nm}: ${G.crew.name} is full. Level the crew up and ask again.`);return;}
  ask(`Ask ${nm} to join ${G.crew.name}?`,()=>{
    const mon=mkMon(n.tr.join,n.tr.team[0][1]);mon.hp=mon.mhp;
    G.gang.push(mon);G.flags['gone_'+n.id]=1;sfx.caught();
    say(`${nm}: ${n.tr.post||"I'm in."}`);say(`${mon.nm} joins ${G.crew.name}!`);
    crewGain(25);
  });
}

const W0=()=>({clock:7*60+40,day:1,q:{act:{},done:{}},ach:{},fit:'orange',ev:{last:0,n:0,done:{}},log:[],train:{},
  stats:{fights:0,wins:0,listen:0,weed:0,search:0,train:0,shark:0,fin:0,counter:0,sleep:0},endT:0});
function WS(){if(!G.W)G.W=W0();return G.W;}
function gameHour(){return Math.floor(WS().clock/60)%24;}
const PERIODS=[[6,'WAKE UP'],[7,'CHOW'],[8,'YARD TIME'],[12,'CHOW'],[13,'FREE TIME'],[17,'CHOW'],[18,'POD TIME'],[21,'LOCKDOWN']];
function period(){const h=gameHour();let p='LOCKDOWN';for(const [hh,n] of PERIODS)if(h>=hh)p=n;return p;}
function clockStr(){const c=WS().clock%1440,h=Math.floor(c/60),m=c%60;return `${((h+11)%12)+1}:${String(m).padStart(2,'0')}${h<12?'AM':'PM'}`;}
function clockAdd(mins){
  const w=WS(),d0=Math.floor(w.clock/1440),p0=period();w.clock+=mins;const d1=Math.floor(w.clock/1440);
  if(d1>d0){w.day+=d1-d0;if(G.L)G.L.day=w.day;onNewDay();}
  const p1=period();if(p1!==p0&&G.mode==='world')onPeriod(p1);
}
function onNewDay(){const w=WS();w.train={};w.ev.n=0;toast('DAY '+w.day);}
function onPeriod(p){
  toast(p==='CHOW'?'CHOW TIME — trays are hot':p==='LOCKDOWN'?'LOCKDOWN — get to a pod':p==='YARD TIME'?'YARD IS OPEN':p==='WAKE UP'?'WAKE UP CALL':p);
  if(p==='CHOW')G.trays={};
  if(p==='LOCKDOWN'&&G.map==='yard'&&!Cs.g){Cs.run(lockdownSweep());}
}
function* lockdownSweep(){
  yield 30;
  yield* talk('Guard (bullhorn): LOCKDOWN! Everybody off the yard! NOW!',0);
  const v=vv();if(v.heat>0){v.heat=Math.max(0,v.heat-1);}
  Fx.st=1;yield()=>Fx.st===2;enterMap('blockA',19,26,1);Fx.st=2;playSong(cur().song);

/* ---- day/night lighting ---- */
const ENVT={};
function envTimed(env,id){
  const h=gameHour(),k=id+':'+h;if(ENVT[k])return ENVT[k];
  let day=1;if(h<5||h>=22)day=0;else if(h<7)day=(h-5)/2;else if(h>=19)day=1-(h-19)/3;
  const o=Object.assign({},env);
  const mul=(a,f,t)=>a.map((v,i)=>v*f+(t?t[i]*(1-f):0));
  if(id==='yard'){
    const n=1-day;
    o.sun=mul(env.sun,.22+.78*day);o.amb=mul(env.amb,.45+.55*day,[.18,.2,.38]);o.bg=mul(env.bg,day,[.03,.03,.09]);o.fog=mul(env.fog,day,[.04,.04,.1]);
    o.sky=mul(env.sky,day,[.3,.3,.6]);o.gnd=mul(env.gnd,.5+.5*day);o.lamps=n>.3;o.lamp=[1,.85,.55];
    if(day>0&&day<1){o.sun=o.sun.map((v,i)=>v*(i===2?.85:1.1));}
  }else{
    const f=.82+.18*day;o.amb=mul(env.amb,f);o.sun=mul(env.sun,f);
  }
  return ENVT[k]=o;
}

/* ---- NPC routines: inmates wander near home, lean on the walls, mill around ---- */
function freeTileW(x,y,self){
  const m=cur();if(x<0||y<0||x>=m.w||y>=m.h)return false;const t=tileAt(m,x,y);
  if(SOLID.has(t)||t===TL.DOOR||t===TL.GATE)return false;
  if(x===G.x&&y===G.y)return false;
  if(Wd.mv>0&&x===G.x+DX[G.dir]&&y===G.y+DY[G.dir])return false;
  if(m.warps.some(w=>w.x===x&&w.y===y))return false;
  if(m.items.some(i=>i.x===x&&i.y===y&&!G.flags['got_'+i.id]))return false;
  return !cur().npcs.some(n=>n!==self&&n.x===x&&n.y===y);
}
function routineTick(){
  const m=cur();
  for(const n of m.npcs){
    if(n.rt){const r=n.rt;n.px+=DX[r.d]*2;n.py+=DY[r.d]*2;r.k++;if(r.k>=8){n.px=n.x*T;n.py=n.y*T;n.rt=null;}}
  }
  if(Say.on||Menus.length||Cs.g||busy())return;
  m._rt=(m._rt||0)+1;if(m._rt%22)return;
  const h=gameHour(),lock=period()==='LOCKDOWN';
  for(const n of npcsHere()){
    if(n.br||n.tr||n.reach||n.rt||!n.say||n.say[0]!=='inmate')continue;
    if(n.hx===undefined){n.hx=n.x;n.hy=n.y;}
    if(Math.abs(n.x-G.x)+Math.abs(n.y-G.y)<=1)continue;
    if(Math.random()>(lock?.06:.2))continue;
    if(Math.random()<.3){n.dir=ri(0,3);continue;}
    const d=ri(0,3),tx_=n.x+DX[d],ty=n.y+DY[d];
    if(Math.abs(tx_-n.hx)>3||Math.abs(ty-n.hy)>3){n.dir=d;continue;}
    if(!freeTileW(tx_,ty,n))continue;
    n.dir=d;n.px=n.x*T;n.py=n.y*T;n.x=tx_;n.y=ty;n.rt={d,k:0};
  }
}

function eventTick(force){
  const w=WS();if(G.map==='intake'&&!force)return;
  if(Cs.g||Say.on||Menus.length||busy()||Wd.mv>0)return;
  if(!force&&(G.steps-w.ev.last<140||Math.random()>.035))return;
  const pool=EVENTS.filter(e=>(!e.at||e.at.includes(G.map))&&(!e.ok||e.ok())&&w.ev.lastId!==e.id);
  if(!pool.length)return;
  const tot=pool.reduce((a,e)=>a+e.w,0);let r=Math.random()*tot,ev=pool[0];for(const e of pool){r-=e.w;if(r<=0){ev=e;break;}}
  w.ev.last=G.steps;w.ev.lastId=ev.id;w.ev.n++;
  Cs.run(ev.run());
}

function questStart(id){const w=WS();if(w.q.act[id]||w.q.done[id]||!QUESTS[id])return;w.q.act[id]=0;toast('NEW MISSION: '+QUESTS[id].t,'#6aef8a');sfx.pick();}
function questStep(id){const q=QUESTS[id];if(!q)return 0;let n=0;for(const s of q.steps){if(s.ok())n++;else break;}return n;}
function questTick(){
  const w=WS();if(!w.q.act.m1&&!w.q.done.m1)w.q.act.m1=0;
  for(const id in w.q.act){
    const q=QUESTS[id];if(!q){delete w.q.act[id];continue;}
    const n=questStep(id);
    if(n>w.q.act[id]&&n<q.steps.length){w.q.act[id]=n;toast('✓ '+q.steps[n-1].t,'#fff');}
    if(n>=q.steps.length){delete w.q.act[id];w.q.done[id]=1;toast('MISSION COMPLETE: '+q.t,'#ffd23a');sfx.level();try{q.rw&&q.rw();}catch(e){}
      if(typeof crewGain==='function'&&G.crew)crewGain(q.main?12:6);
      if(q.next)questStart(q.next);}
  }
}
function mainQuest(){const w=WS();for(const id in w.q.act)if(QUESTS[id].main)return id;return null;}
function objective(){
  const id=mainQuest();if(!id)return null;
  const q=QUESTS[id],n=questStep(id),st=q.steps[Math.min(n,q.steps.length-1)];
  if(!st)return null;
  if(st.at&&st.at.map===G.map)return {x:st.at.x,y:st.at.y,t:st.t.toUpperCase()};
  return {t:st.t.toUpperCase(),x:-1,y:-1};
}
function missionsMenu(){
  const w=WS();const items=[];
  const act=Object.keys(w.q.act).sort((a,b)=>(QUESTS[b].main?1:0)-(QUESTS[a].main?1:0));
  for(const id of act){const q=QUESTS[id],n=questStep(id);items.push({l:(q.main?'★ ':'')+q.t.slice(0,16),r:`${n}/${q.steps.length}`,f:()=>{
    say(`${q.t}\n${q.d}`);say(q.steps.map((s,i)=>(i<n?'[x] ':'[ ] ')+s.t).join('\n'));}});}

function* counterHit(me,foe){

  sfx.crit();bcap('COUNTER!',true);Fx.shake=8;
  yield* talk(pick([`${me.nm} slips it and COUNTERS!`,`${me.nm} catches ${foe.nm} coming in!`,`Right down the pipe. ${foe.nm} walked into that one.`]),28);
  const A=me.atk*stageMul(me.sg.atk),D=foe.def*stageMul(foe.sg.def);
  let dmg=Math.floor(((2*me.l/5+2)*(st==='boxer'?75:60)*A/D)/50)+3;dmg=Math.max(1,Math.floor(dmg*(.9+Math.random()*.2)));dmg=Math.min(dmg,foe.hp);

/* enemy archetype patterns: MUSCLE sets up then unloads, SNEAK softens you first, CHARM hypes then pops */
function patternBias(e,d,p){
  const t=SP[e.s].t,ep=B.ep,last=ep.last?M[ep.last]:null;
  let s=0;
  if(t==='MUS'){if(last&&last.p>=85&&d.p>=85)s-=2.5;if(last&&!last.p&&d.p>=85)s+=2.5;if(e.sta<30&&d.p>=85)s-=3;}
  else if(t==='SNK'){if(!p.st&&(d.fx==='bleed'||d.fx==='accdown'||d.fx==='stun'))s+=1.5;if((p.stn>0||p.sg.acc<0)&&d.p>=80)s+=2.5;}
  else if(t==='CHM'){if(e.sg.atk<1&&d.fx==='atkup')s+=2;if(e.sg.atk>=1&&d.p>=70)s+=2.5;}
  if(e._rage&&d.p>=85)s+=2;
  if(B.guard&&d.p>=70)s-=1.5;      // smart ones mix it up when you cover
  return s;
}

function* fightClub(){
  Fx.st=1;yield()=>Fx.st===2;
  enterMap('pit',11,14,1);Fx.st=2;playSong('boss');
  yield 20;
  yield* talk('The Pit. Guards on the catwalk. Inmates screaming from the fence. Money changing hands.',40);
  yield* talk('Sgt. Kowalski: FOUR ROUNDS. Winner takes everything. Loser takes the infirmary. BEGIN!',40);
  G.flags.clubStart=1;
  for(let i=0;i<FIGHTCLUB.length;i++){
    const e=FIGHTCLUB[i];
    G.gang.forEach(m=>{if(m.hp>0)m.hp=Math.min(m.mhp,m.hp+Math.floor(m.mhp*.5));m.st=null;});
    yield* talk(e.pre,40);

    const items=G.gang.map((m,ix)=>({l:m.nm.slice(0,10),r:`L${m.l} ${m.hp}/${m.mhp}`,d:m.hp<=0,f:()=>{picked=ix;}}));

      yield* talk('Sgt. Kowalski: That is a loss. The club is closed to you for tonight. Heal up and come back, if you dare.',44);
      G.gang.forEach(m=>{if(m.hp<=0)m.hp=1;});

const TRAIL=[];
function trailPush(){const last=TRAIL[0];if(!last||last.x!==G.x||last.y!==G.y||last.map!==G.map){TRAIL.unshift({x:G.x,y:G.y,map:G.map,dir:G.dir});if(TRAIL.length>8)TRAIL.length=8;}}
function followers(){if(!G.crew||G.gang.length<2)return [];return G.gang.slice(1,3);}
function drawFollowers(tt){
  const fs=followers();if(!fs.length)return;
  const moving=Wd.mv>0;
  fs.forEach((m,i)=>{
    const t=TRAIL.filter(p=>p.map===G.map)[i+1];if(!t)return;
    const L=LOOK[m.s]||LOOK.rookie;
    // ease toward the trail spot
    m._fx=m._fx===undefined?t.x:m._fx+(t.x-m._fx)*.16;m._fy=m._fy===undefined?t.y:m._fy+(t.y-m._fy)*.16;
    const mv=Math.abs(m._fx-t.x)+Math.abs(m._fy-t.y)>.03||moving;
    m._ph=strideOn(m,m._fx,m._fy,1.05,1);m._yw=m._yw===undefined?YAW[t.dir]:angTo(m._yw,YAW[t.dir],.2);m._w=(m._w||0)+((mv?1:0)-(m._w||0))*(mv?.28:.12);
    drawRig(L,m._fx+.5,0,m._fy+.5,m._yw,m._w>.02?blendPose(idlePose(tt,i+1),poseWalk(m._ph,1.05),m._w):idlePose(tt,i+1),{scale:1,lod:0});

function slotName(k){return k==='auto'?'AUTOSAVE':'SLOT '+k;}
function readSlot(k){try{const s=localStorage.getItem(SLOTKEYS[k]);return s?JSON.parse(s):null;}catch(e){return null;}}
function writeSlot(k,d){localStorage.setItem(SLOTKEYS[k],JSON.stringify(d));}
function snapSave(){
  const lead=(G.gang||[])[0];
  return {ver:GAME_VERSION,sv:SAVE_SCHEMA,t:Date.now(),sum:{day:(G.W&&G.W.day)||1,lv:lead?lead.l:1,map:G.map,crew:(G.gang||[]).length,rank:(typeof rank==='function'?rank():'')},
    W:G.W,ng:G.ng||0,pl:G.pl,crew:G.crew,L:G.L,map:G.map,x:G.x,y:G.y,dir:G.dir,flags:G.flags,items:G.items,gang:G.gang,steps:G.steps,trays:G.trays,babaT:G.babaT||0,v:G.v,met:G.met};
}
function sumOf(d){
  if(!d)return null;const s=d.sum||{};const lead=(d.gang||[])[0];
  return {day:s.day||(d.W&&d.W.day)||1,lv:s.lv||(lead?lead.l:1),map:s.map||d.map||'?',t:d.t||0,ver:d.ver||'1.0'};
}
function slotLabel(k){
  const s=sumOf(readSlot(k));if(!s)return slotName(k)+'  - empty -';
  const m=(typeof MAPS!=='undefined'&&MAPS[s.map]&&MAPS[s.map].name)?MAPS[s.map].name:String(s.map).toUpperCase();
  return `${k==='auto'?'AUTO':'SLOT '+k}  D${s.day} LV${s.lv} ${m}`.slice(0,26);
}
function latestSlot(){let best=null,bt=-1;for(const k of SLOTS){const d=readSlot(k);if(d){const t=d.t||1;if(t>bt){bt=t;best=k;}}}return best;}
function hasSave(){return latestSlot()!==null;}
function saveGame(slot,quiet){
  slot=slot||G.slot||1;
  try{writeSlot(slot,snapSave());if(slot!=='auto')G.slot=slot;if(!quiet){sfx.ok();say(`Saved to ${slotName(slot)}.`);}}
  catch(e){if(!quiet)say('Could not save here. (Storage is blocked.)');}
}
/* migration: anything an update adds or removes gets a safe default, so old saves always load */
function migrateSave(d){
  d.items=Object.assign({cigs:0,beer:0,weed:0,shank:0,perogi:0,shark:0,ramen:0,protein:0},d.items||{});
  d.flags=d.flags||{};d.steps=d.steps||0;d.trays=d.trays||{};d.met=d.met||{};
  d.gang=(d.gang||[]).filter(Boolean).map(m=>{
    if(!SP[m.s])m.s='goon';
    m.moves=(m.moves||[]).filter(mv=>mv&&M[mv.id]);
    if(!m.moves.length){const ls=SP[m.s].ls.filter(e=>e[0]<=(m.l||1)).map(e=>e[1]);m.moves=[...new Set(ls)].slice(-4).map(id=>({id,pp:M[id].pp}));}
    m.l=m.l||1;return m;});
  if(!d.gang.length)d.gang=[mkMon('bandit',5,'BANDIT')];
  if(!d.map||!MAPS[d.map]){d.map='yard';d.x=24;d.y=21;d.dir=0;}
  return d;
}
function loadGame(slot){

    const oldVer=d.ver||'1.0';d=migrateSave(d);
    Object.assign(G,{W:d.W||null,ng:d.ng||0,pl:d.pl||PL0(),crew:d.crew||null,L:d.L||L0(),flags:d.flags,items:d.items,gang:d.gang,steps:d.steps,trays:d.trays||{},babaT:d.babaT||0,v:d.v||V0(),met:d.met||{}});
    G.gang.forEach(cleanMon);if(!G.W)G.W=W0();if(G.W.q&&G.W.q.act&&!Object.keys(G.W.q.act).length&&!Object.keys(G.W.q.done).length)G.W.q.act.m1=0;

/* ---- backup codes: a real HTML sheet so copy/paste works on iPhone ---- */
function encodeSave(d){return 'RBL1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d))));}
function decodeSave(c){c=(c||'').trim().replace(/\s+/g,'');if(c.startsWith('RBL1:'))c=c.slice(5);return JSON.parse(decodeURIComponent(escape(atob(c))));}
function backupModal(){

    <textarea id="bkt" style="width:100%;height:110px;border-radius:8px;border:1px solid #6a5a80;background:#0f0a18;color:#9ad;font-size:11px;padding:8px;box-sizing:border-box" placeholder="Paste a backup code here to restore">${code}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button id="bkc" style="flex:1;padding:12px;border-radius:10px;border:0;background:#f27a12;color:#fff;font-weight:800;font-size:15px">Copy code</button>

/* ===== SOUNDTRACK: your own songs, added from the phone, saved on the device, played as the game's music ===== */
const MUS={list:[],mode:'mine',i:0,el:null,on:false,db:null,ready:false,shuffle:true,url:null,vol:.55};
function musPrefs(){try{const p=JSON.parse(localStorage.getItem('rbl_music')||'{}');MUS.mode=p.mode||'mine';MUS.shuffle=p.shuffle!==false;MUS.vol=p.vol===undefined?.55:p.vol;}catch(e){}}
function musSavePrefs(){try{localStorage.setItem('rbl_music',JSON.stringify({mode:MUS.mode,shuffle:MUS.shuffle,vol:MUS.vol}));}catch(e){}}
function musDB(){
  return new Promise((res,rej)=>{
    if(MUS.db)return res(MUS.db);
    if(typeof indexedDB==='undefined')return rej('no idb');
    const r=indexedDB.open('podboss_music',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('songs',{keyPath:'id'});};
    r.onsuccess=()=>{MUS.db=r.result;res(MUS.db);};r.onerror=()=>rej(r.error);
  });
}
function musTx(mode,fn){return musDB().then(db=>new Promise((res,rej)=>{const t=db.transaction('songs',mode),st=t.objectStore('songs');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);}));}
function musLoadList(){
  return musDB().then(db=>new Promise(res=>{const out=[];const c=db.transaction('songs').objectStore('songs').openCursor();
    c.onsuccess=()=>{const cur=c.result;if(cur){out.push({id:cur.value.id,name:cur.value.name,n:cur.value.n||0});cur.continue();}else{out.sort((a,b)=>a.n-b.n);MUS.list=out;MUS.ready=true;res(out);}};
    c.onerror=()=>res(out);})).catch(()=>{MUS.ready=true;return [];});
}
function musAdd(files){
  const arr=[...files].filter(f=>/^audio\//.test(f.type)||/\.(mp3|m4a|aac|wav|ogg)$/i.test(f.name));
  const base=Date.now();
  return Promise.all(arr.map((f,k)=>musTx('readwrite',st=>st.put({id:'s'+base+'_'+k,name:f.name.replace(/\.[^.]+$/,'').slice(0,40),blob:f,n:base+k})))).then(musLoadList).then(()=>arr.length);
}
function musRemove(id){return musTx('readwrite',st=>st.delete(id)).then(musLoadList);}
function musGet(id){return musDB().then(db=>new Promise(res=>{const r=db.transaction('songs').objectStore('songs').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}));}
function musActive(){return MUS.mode==='mine'&&MUS.list.length>0&&!muted;}
function musEl(){
  if(!MUS.el&&typeof Audio!=='undefined'){MUS.el=new Audio();MUS.el.preload='auto';MUS.el.setAttribute('playsinline','');MUS.el.addEventListener('ended',()=>musNext());}
  return MUS.el;
}
function musPlay(i){
  if(!MUS.list.length)return;
  MUS.i=((i%MUS.list.length)+MUS.list.length)%MUS.list.length;
  const s=MUS.list[MUS.i],el=musEl();if(!el)return;
  musGet(s.id).then(rec=>{if(!rec)return;if(MUS.url)URL.revokeObjectURL(MUS.url);MUS.url=URL.createObjectURL(rec.blob);
    el.src=MUS.url;el.volume=MUS.vol;const p=el.play();MUS.on=true;if(p&&p.catch)p.catch(()=>{MUS.on=false;});
    if(typeof toast==='function')toast('NOW PLAYING: '+s.name.toUpperCase().slice(0,24),'#9ad');});
}
function musNext(){if(!MUS.list.length)return;musPlay(MUS.shuffle&&MUS.list.length>2?MUS.i+1+Math.floor(Math.random()*(MUS.list.length-1)):MUS.i+1);}
function musStop(){if(MUS.el){MUS.el.pause();}MUS.on=false;}
/* the chiptune engine stays quiet while your songs are playing */
function musTick(){
  if(musActive()){if(!MUS.on||(MUS.el&&MUS.el.paused&&MUS.el.src&&!MUS.el.ended)){/* waits for a tap (iPhone needs one) */}}
  else if(MUS.on)musStop();
  if(MUS.el)MUS.el.volume=MUS.vol;
}
function musUnlock(){ // called from real taps: iPhone only starts audio inside a gesture
  if(musActive()&&(!MUS.on||(MUS.el&&MUS.el.paused))){if(MUS.el&&MUS.el.src&&MUS.el.paused&&MUS.on!==false){const p=MUS.el.play();if(p&&p.catch)p.catch(()=>{});}else musPlay(MUS.shuffle?Math.floor(Math.random()*MUS.list.length):MUS.i);}
}
if(typeof document!=='undefined'&&document.addEventListener){
  ['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{try{musUnlock();}catch(e){}},{passive:true}));

    case 'world':worldUpdate();break;

    case 'end':endUpdate();break;
    case 'name':nameUpdate();break;
    case 'train':trainUpdate();break;
    case 'mapview':mapUpdate();break;
  }
  switch(G.mode){
    case 'title':titleDraw();break;
    case 'intro':introDraw();break;
    case 'world':worldDraw();break;
    case 'battle':battle3Draw();break;
    case 'end':endDraw();break;
    case 'name':nameDraw();break;
    case 'train':trainDraw();break;
    case 'mapview':mapDraw();break;
  }
  Say.draw();menuDraw();fxDraw();
  for(const k in Pr)Pr[k]=0;
}
let last=0,acc=0;
function showErr(e){const p=document.getElementById('err');if(p&&p.textContent.length<1500){p.style.display='block';p.textContent+=(e&&e.stack?e.stack.split('\n').slice(0,3).join(' | '):e)+'\n';}}
function raf(t){
  const dt=Math.min(100,t-last||16);last=t;acc+=dt;
  let n=0;while(acc>=16.67&&n<4){try{frame();}catch(e){showErr(e);}acc-=16.67;n++;}
  if(n===4)acc=0;
  requestAnimationFrame(raf);
}
function boot(){
  if(boot.done)return;boot.done=1;
  try{if(glInit())R3.atlas=(typeof atlasTex==='function'?atlasTex:glTex)(smoothAtlas(),false);}catch(e){showErr(e);}
  try{resize();openTitle();}catch(e){showErr(e);}
  requestAnimationFrame(raf);
}
(function(){
  let ok=false;
  try{document.fonts.load('8px "Press Start 2P"').then(()=>{boot();}).catch(boot);}catch(e){boot();}
  setTimeout(boot,1800);
})();
</script>
