<script>
'use strict';
/* ===== CORE: canvas, input, audio, text, menus, fx ===== */
const W=240,T=16;let H=300;const OFF=()=>Math.round((H-216)/2);
const cv=document.getElementById('screen');
let g=cv.getContext('2d'),S=2;
const FONT='bold 10px "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif';
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lcdEl=document.getElementById('lcd');
function layout(){
  const vv=window.visualViewport,w=Math.round((vv&&vv.width)||innerWidth),h=Math.round((vv&&vv.height)||innerHeight),r=document.documentElement;
  const land=w>h&&h<=640;r.dataset.o=land?'l':'p';
  r.style.setProperty('--W',w+'px');r.style.setProperty('--Hh',h+'px');r.style.setProperty('--lu',Math.min(h*.0118,w*.0062)+'px');
}
function resize(){
  layout();

  const sc=Math.min(bw/W,bh/H);
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
  S=Math.max(2,Math.round(sc*dpr));cv.width=W*S;cv.height=H*S;
  g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  window.VW={sc,bw,bh,cx0:(bw-Math.floor(W*sc))/2,cy0:(bh-Math.floor(H*sc))/2};
  if(typeof glResize==='function')glResize(bw,bh,dpr);
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>{[60,200,450,900].forEach(t=>setTimeout(resize,t));});
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
setInterval(()=>{const vv=window.visualViewport,w=Math.round((vv&&vv.width)||innerWidth),h=Math.round((vv&&vv.height)||innerHeight);if(w+'x'+h!==resize.last){resize.last=w+'x'+h;resize();}},400);
if(typeof ResizeObserver!=='undefined'){try{new ResizeObserver(()=>resize()).observe(lcdEl);}catch(e){}}

/* ---- input ---- */
const K={up:0,down:0,left:0,right:0,a:0,b:0,start:0,select:0},Pr={};
function setKey(k,v){v=v?1:0;if(v&&!K[k]){Pr[k]=1;try{ac();}catch(e){}}K[k]=v;}
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'a',KeyJ:'a',Space:'a',KeyX:'down',KeyB:'b',KeyK:'b',Enter:'start',ShiftLeft:'select',ShiftRight:'select',Backspace:'select'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){setKey(k,1);e.preventDefault();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){setKey(k,0);e.preventDefault();}});
function releaseAll(){for(const k in K)setKey(k,0);document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  if(!window.PointerEvent){el.addEventListener('touchstart',e=>{e.preventDefault();setKey(k,1);el.classList.add('on');},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();setKey(k,0);el.classList.remove('on');},{passive:false});el.addEventListener('mousedown',()=>setKey(k,1));el.addEventListener('mouseup',()=>setKey(k,0));return;}
  const dn=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}setKey(k,1);el.classList.add('on');};
  const up=e=>{e.preventDefault();setKey(k,0);el.classList.remove('on');};
  el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',e=>{if(!e.buttons&&e.pointerType==='mouse')up(e);});
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const dpEl=document.getElementById('dpad');
function dpSet(e){
  const r=dpEl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  const ax=Math.abs(x),ay=Math.abs(y),on=Math.hypot(x,y)>.1;
  setKey('left',on&&x<0&&ax>=ay*.8);setKey('right',on&&x>0&&ax>=ay*.8);
  setKey('up',on&&y<0&&ay>ax*.8);setKey('down',on&&y>0&&ay>ax*.8);
  dpEl.classList.add('on');
}
function dpEnd(e){e.preventDefault();['up','down','left','right'].forEach(k=>setKey(k,0));dpEl.classList.remove('on');}
dpEl.addEventListener('pointerdown',e=>{e.preventDefault();try{dpEl.setPointerCapture(e.pointerId);}catch(_){}dpSet(e);});
dpEl.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')dpSet(e);});
dpEl.addEventListener('pointerup',dpEnd);dpEl.addEventListener('pointercancel',dpEnd);
dpEl.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ---- audio ---- */
let AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function beep(f,d=.08,type='square',v=.04,slide=0,t0=0){
  if(muted)return;const a=AC;if(!a)return;
  try{
    const t=a.currentTime+t0,o=a.createOscillator(),gn=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function seq(fs,step=.08,type='square',v=.04){fs.forEach((f,i)=>f&&beep(f,step*1.2,type,v,0,i*step));}

/* ---- text + panels ---- */
function tx(s,x,y,c='#fff',al='left',sh='#000'){
  g.font=FONT;g.textBaseline='top';g.textAlign=al;
  if(sh){g.fillStyle=sh;g.fillText(s,x+1,y+1);}
  g.fillStyle=c;g.fillText(s,x,y);
}
function wrap(s,maxW){
  g.font=FONT;const out=[];
  for(const para of String(s).split('\n')){
    let line='';
    for(const w of para.split(' ')){
      const t=line?line+' '+w:w;
      if(g.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;
    }
    out.push(line);
  }
  return out;
}
function panel(x,y,w,h,fill='#1a1022',bd='#f3a65a'){
  g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle=bd;g.fillRect(x,y,w,h);
  g.fillStyle='#5a2d12';g.fillRect(x+1,y+1,w-2,h-2);
  g.fillStyle=fill;g.fillRect(x+2,y+2,w-4,h-4);
  g.fillStyle='#ffffff10';g.fillRect(x+2,y+2,w-4,2);
}
function bar(x,y,w,p,h=4){
  p=clamp(p,0,1);
  g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle='#3a3340';g.fillRect(x,y,w,h);
  g.fillStyle=p>.5?'#4fd16a':p>.2?'#f2c230':'#e8452e';g.fillRect(x,y,Math.round(w*p),h);
  g.fillStyle='#ffffff44';g.fillRect(x,y,Math.round(w*p),1);
}

/* ---- message box (typewriter) ---- */
const Say={
  q:[],cur:null,n:0,hold:0,lines:[],
  add(t,cb,o){
    const L=wrap(t,214);
    if(L.length<=3){this.q.push({t:L.join('\n'),L,cb,o:o||{}});return;}
    for(let i=0;i<L.length;i+=3){
      const part=L.slice(i,i+3);
      this.q.push({t:part.join('\n'),L:part,cb:i+3>=L.length?cb:null,o:o||{}});
    }
  },
  get on(){return !!(this.cur||this.q.length);},
  clear(){this.q=[];this.cur=null;},
  update(){
    if(!this.cur){
      if(!this.q.length)return;
      this.cur=this.q.shift();this.n=0;this.hold=0;this.full=this.cur.L.join('').length;
    }
    const c=this.cur;
    if(this.n<this.full){
      if(Pr.a||Pr.b){this.n=this.full;Pr.a=Pr.b=0;return;}
      this.n+=(K.a||K.b)?3:1;if(this.n%4===0)sfx.tick();return;
    }
    this.hold++;
    const auto=c.o.auto;
    if(Pr.a||Pr.b||(auto&&this.hold>auto)){
      Pr.a=Pr.b=0;this.cur=null;sfx.blip();if(c.cb)c.cb();
    }
  },
  draw(){
    if(!this.cur)return;
    const c=this.cur;panel(4,H-62,232,58,'#140c1c');
    let left=this.n;
    c.L.forEach((ln,i)=>{
      if(left<=0)return;
      tx(ln.slice(0,left),11,H-56+i*16,'#fff');left-=ln.length;
    });
    if(this.n>=this.full&&!c.o.auto&&((Date.now()/300)|0)%2)tx('▼',221,H-18,'#f3a65a');
  }
};
const say=(t,cb,o)=>Say.add(t,cb,o);

/* ---- menus ---- */
const Menus=[];
function openMenu(m){m.cur=m.cur||0;m.top=0;Menus.push(m);sfx.blip();return m;}
function menuUpdate(){
  const m=Menus[Menus.length-1];if(!m)return false;
  const n=m.items.length,cols=m.cols||1;
  if(Pr.up){m.cur=cols>1?(m.cur-cols+n)%n:(m.cur+n-1)%n;sfx.blip();}
  if(Pr.down){m.cur=cols>1?(m.cur+cols)%n:(m.cur+1)%n;sfx.blip();}
  if(cols>1){if(Pr.left){m.cur=(m.cur+n-1)%n;sfx.blip();}if(Pr.right){m.cur=(m.cur+1)%n;sfx.blip();}}
  if(m.onMove)m.onMove(m.cur);
  if(Pr.a){
    const it=m.items[m.cur];Pr.a=0;
    if(!it||it.d){sfx.bump();}
    else{sfx.ok();if(!m.stay)Menus.pop();if(it.f)it.f();}
  }else if(Pr.b){
    Pr.b=0;
    if(m.nocancel){sfx.bump();}
    else if(m.cancel){sfx.blip();Menus.pop();m.cancel();}
    else{sfx.blip();Menus.pop();}
  }
  return true;
}
function menuDraw(){
  Menus.forEach(m=>{
    const rh=m.rh||13,cols=m.cols||1,vis=m.vis||m.items.length,n=m.items.length;
    const rows=Math.ceil(Math.min(vis,n)/cols),hdr=m.title?12:0;
    const h=rows*rh+8+hdr;
    panel(m.x,m.y,m.w,h);
    const ttl=typeof m.title==='function'?m.title():m.title;
    if(ttl)tx(ttl,m.x+6,m.y+5,'#f3a65a');
    const rowCur=Math.floor(m.cur/cols);
    if(rowCur<m.top)m.top=rowCur;
    if(rowCur>=m.top+rows)m.top=rowCur-rows+1;
    for(let i=0;i<rows*cols;i++){
      const idx=m.top*cols+i;if(idx>=n)break;
      const it=m.items[idx],r=Math.floor(i/cols),c=i%cols,cw=(m.w-10)/cols;
      const x=m.x+6+c*cw,y=m.y+4+hdr+r*rh+1;
      const col=it.d?'#7a6e86':'#fff';
      if(idx===m.cur)tx('▶',x-1,y,'#f3a65a');
      tx(it.l,x+8,y,col);
      if(it.r)tx(it.r,x+cw-6,y,it.d?'#7a6e86':'#f3c27a','right');
    }
    if(m.top>0)tx('▲',m.x+m.w-12,m.y+3,'#f3a65a');
    if(m.top+rows<Math.ceil(n/cols))tx('▼',m.x+m.w-12,m.y+h-10,'#f3a65a');
  });
}
function ask(text,yes,no){
  say(text,()=>{
    openMenu({x:164,y:H-96,w:68,items:[{l:'YES',f:yes},{l:'NO',f:no||(()=>{})}],cancel:no||(()=>{})});
  });
}

/* ---- fx ---- */
const Fx={fade:0,st:0,cb:null,shake:0,flash:0,flashCol:'#fff'};
function fadeTo(cb){Fx.st=1;Fx.cb=cb;}
function fxUpdate(){
  if(Fx.st===1){Fx.fade+=.1;if(Fx.fade>=1){Fx.fade=1;Fx.st=2;const f=Fx.cb;Fx.cb=null;if(f)f();}}
  else if(Fx.st===2){Fx.fade-=.1;if(Fx.fade<=0){Fx.fade=0;Fx.st=0;}}
  if(Fx.shake>0)Fx.shake--;
  if(Fx.flash>0)Fx.flash--;
}
function fxDraw(){
  if(Fx.fade>0){g.fillStyle=`rgba(0,0,0,${Fx.fade})`;g.fillRect(0,0,W,H);}
  if(Fx.flash>0){g.globalAlpha=Fx.flash/10;g.fillStyle=Fx.flashCol;g.fillRect(0,0,W,H);g.globalAlpha=1;}
}
const busy=()=>Fx.st!==0;

/* ---- tap the screen: select menu items, advance text ---- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();ac();
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
  const m=Menus[Menus.length-1];
  if(Say.on&&!m){Pr.a=1;return;}
  if(m){
    const rh=m.rh||11,cols=m.cols||1,vis=m.vis||m.items.length,n=m.items.length,rows=Math.ceil(Math.min(vis,n)/cols);
    const hdr=((typeof m.title==='function'?m.title():m.title)?12:0),h=rows*rh+8+hdr,cw=(m.w-10)/cols;
    if(px>=m.x&&px<=m.x+m.w&&py>=m.y&&py<=m.y+h){
      const c=Math.min(cols-1,Math.max(0,Math.floor((px-m.x-6)/cw))),rr=Math.floor((py-m.y-4-hdr)/rh);
      const idx=(m.top+rr)*cols+c;
      if(rr>=0&&rr<rows&&idx>=0&&idx<n){m.cur=idx;Pr.a=1;}
    }else if(!m.nocancel)Pr.b=1;
  }
});

function person(c,x0,y0,L,dir,fr,s){
  const flip=dir===3,side=dir===2||dir===3,w=L.w||0;
  const r=(x,y,w2,h,col)=>{if(flip)x=16-x-w2;c.fillStyle=col;c.fillRect(x0+x*s,y0+y*s,w2*s,h*s);};
  const sk=L.sk||'#e8b48a',hr=L.hr||'#3a2414',sh=L.sh||'#e8731c',pn=L.pn||'#e8731c',st=L.st||'short',ac=L.ac||[];
  const dk=(col)=>col;
  r(3,15,10,1,'#0005');
  const lf=fr===1?1:0,rf=fr===2?1:0;
  if(side){r(5,12+lf,3,3-lf,pn);r(8,12+rf,3,3-rf,pn);r(5,14,3,1,'#1d1a22');r(8,14,3,1,'#1d1a22');}
  else{r(5,12+lf,3,3-lf,pn);r(8,12+rf,3,3-rf,pn);r(5,14,3,1,'#1d1a22');r(8,14,3,1,'#1d1a22');}
  // torso + arms
  if(side){
    r(5-w,8,6+w*2,5,sh);r(5-w,8,6+w*2,1,'#ffffff22');r(5-w,12,6+w*2,1,'#0003');
    r(6,8+(fr?1:0),3,4,sh);r(6,8+(fr?1:0),3,1,'#ffffff22');r(7,12+(fr?1:0),1,1,sk);
  }else{
    r(4-w,8,8+w*2,5,sh);r(4-w,8,8+w*2,1,'#ffffff22');r(4-w,12,8+w*2,1,'#0003');r(7,8,2,2,dir===0?'#0003':'#0000');
    r(3-w,8+(fr===1?1:0),1,4,sh);r(12+w,8+(fr===2?1:0),1,4,sh);
    r(3-w,12+(fr===1?1:0),1,1,sk);r(12+w,12+(fr===2?1:0),1,1,sk);
    if(L.stripe){r(4-w,10,8+w*2,1,L.stripe);}
  }
  // head
  if(side){
    r(4,1,7,7,sk);r(3,5,1,1,sk);r(10,4,1,2,sk);
    if(st!=='bald')r(8,0,3,6,hr);
    if(st==='short'||st==='long'||st==='fro'||st==='buzz')r(4,0,7,2,hr);
    if(st==='long'){r(9,5,2,4,hr);}
    if(st==='fro')r(3,0,9,4,hr);
    if(st==='mohawk'){r(5,0,5,1,hr);r(6,-0,3,1,hr);}
    r(5,4,1,2,'#111');
    if(ac.includes('shades'))r(4,4,4,2,'#111');
    if(ac.includes('mask')){r(4,3,6,3,'#151515');r(5,4,2,1,'#fff');r(5,4,1,1,'#111');}
    if(ac.includes('beard'))r(4,6,6,2,hr);
    if(ac.includes('chin'))r(3,7,5,2,sk);
    if(st==='beanie'){r(4,0,7,3,L.hc||'#333');r(4,3,7,1,'#555');}
    if(st==='bandana'){r(4,1,7,2,L.hc||'#d22');r(10,2,2,2,L.hc||'#d22');}
    if(ac.includes('cig')){r(2,6,3,1,'#f4f4f0');r(1,6,1,1,'#ff6a1a');}
    if(ac.includes('scar'))r(6,2,1,3,'#b55');
  }else{
    r(4,1,8,7,sk);r(3,4,1,2,sk);r(12,4,1,2,sk);
    if(dir===0){
      r(6,4,1,2,'#111');r(9,4,1,2,'#111');r(7,6,2,1,'#8a3a2a');
      if(st==='short'||st==='long'){r(4,0,8,3,hr);r(4,3,1,1,hr);r(11,3,1,1,hr);}
      if(st==='buzz'){r(4,1,8,2,hr);}
      if(st==='bald')r(5,1,3,1,'#ffffff55');
      if(st==='mohawk'){r(7,0,2,3,hr);r(4,1,8,1,'#0002');}
      if(st==='long'){r(3,3,1,6,hr);r(12,3,1,6,hr);}
      if(st==='fro')r(3,0,10,4,hr);
      if(st==='beanie'){r(4,0,8,3,L.hc||'#333');r(4,3,8,1,'#555');}
      if(st==='bandana'){r(4,1,8,2,L.hc||'#d22');r(4,3,8,1,'#0002');}
      if(ac.includes('scar'))r(10,2,1,3,'#b55');
      if(ac.includes('shades'))r(5,4,6,2,'#111');
      if(ac.includes('mask')){r(4,3,8,3,'#151515');r(5,4,2,1,'#fff');r(9,4,2,1,'#fff');r(6,4,1,1,'#111');r(10,4,1,1,'#111');}
      if(ac.includes('beard')){r(5,6,6,2,hr);r(7,6,2,1,'#8a3a2a');}
      if(ac.includes('chin')){r(5,7,6,2,sk);r(6,8,4,1,'#0003');}
      if(ac.includes('cig')){r(10,6,4,1,'#f4f4f0');r(14,6,1,1,'#ff6a1a');}
    }else{
      if(st!=='bald')r(4,0,8,6,hr);
      if(st==='long'){r(3,3,1,6,hr);r(12,3,1,6,hr);}
      if(st==='fro')r(3,0,10,5,hr);
      if(st==='beanie'){r(4,0,8,3,L.hc||'#333');r(4,3,8,1,'#555');}
      if(st==='bandana'){r(4,1,8,2,L.hc||'#d22');r(4,3,8,2,hr);}
      if(st==='bald')r(5,1,3,1,'#ffffff55');
      if(ac.includes('mask'))r(4,3,8,1,'#151515');
    }
    if(ac.includes('crown')){r(5,1,6,1,'#ffd23a');r(5,0,1,1,'#ffd23a');r(7,0,2,1,'#ffd23a');r(10,0,1,1,'#ffd23a');r(7,0,1,1,'#fff6a0');}
  }
  if(ac.includes('crown')&&side){r(5,1,5,1,'#ffd23a');r(5,0,1,1,'#ffd23a');r(7,0,1,1,'#ffd23a');r(9,0,1,1,'#ffd23a');}
  if(ac.includes('smoke')){r(1,0,3,2,'#d0cbd8');r(12,1,3,2,'#bdb7c8');r(2,2,2,1,'#9a94a8');r(13,3,2,1,'#9a94a8');}
}

function mstat(m){
  const b=SP[m.s].b,L=m.l;
  m.mhp=Math.floor(b[0]*L/16)+L+10;m.atk=Math.floor(b[1]*L/20)+5;
  m.def=Math.floor(b[2]*L/20)+5;m.spd=Math.floor(b[3]*L/20)+5;
  if(typeof statHook==='function')statHook(m);
}
function mkMon(s,l,nm){
  const m={s,l,nm:nm||SP[s].n,xp:0,st:null,moves:[]};
  mstat(m);m.hp=m.mhp;
  let ls=SP[s].ls.filter(e=>e[0]<=l).map(e=>e[1]);
  ls=[...new Set(ls)].slice(-4);
  m.moves=ls.map(id=>({id,pp:M[id].pp}));
  return m;
}

function openDeal(){
  const offers=[['cigs',.10],['beer',.15],['weed',.20],['perogi',.32]];
  const items=offers.map(([id,b])=>({l:IT[id].n,r:'x'+(G.items[id]||0),d:!(G.items[id]>0),f:()=>{Menus.length=0;B.choice={t:'deal',id,b};}}));
  openMenu({x:4,y:30,w:232,items,title:'OFFER A DEAL',stay:true,cancel:()=>{}});
}

/* ---- turn resolution ---- */
function enemyMove(){
  const e=B.em,p=B.pm;
  const opts=e.moves.map((mv,i)=>({mv,i})).filter(o=>o.mv.pp>0);
  if(!opts.length)return -1;
  const smart=B.boss||(B.trainer&&Math.random()<.6);
  const sc=opts.map(o=>{
    const d=M[o.mv.id];let s=1+Math.random()*(smart?.6:2.4);
    if(d.p){s+=d.p/20*typeMult(d.t,SP[p.s].t)*(SP[e.s].t===d.t?1.25:1);}
    else if(d.fx==='heal'){s+=e.hp<e.mhp*.4?5:-3;}
    else if(d.fx==='atkdown'){s+=p.sg.atk>-1?2.5:-2;}
    else if(d.fx==='defup'||d.fx==='atkup'||d.fx==='high'||d.fx==='drunkup'){s+=e.sg.atk<1&&e.sg.def<1?2:-2;}
    else if(d.fx==='accdown'){s+=p.sg.acc>-1?2:-2;}
    if(d.fx==='stunbonus'&&p.stn>0)s+=4;
    if(typeof patternBias==='function')s+=patternBias(e,d,p);
    return s;
  });
  let bi=0;sc.forEach((s,i)=>{if(s>sc[bi])bi=s>sc[bi]?i:bi;});
  B.ep.last=opts[bi].mv.id;
  return opts[bi].i;
}
function* resolveTurn(pc){
  let r=null;
  if(pc.t==='run'){
    const ch=clamp(.5+(B.pm.spd-B.em.spd)*.02,.25,.95);
    if(Math.random()<ch){yield* talk('Got away safely!');return 'run';}
    yield* talk("Can't get away!");
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='deal'){
    const res=yield* tryDeal(pc);
    if(res==='recruit')return 'recruit';
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='guard'){
    B.guard=1;B.pm.sta=Math.min(100,B.pm.sta+35);sfx.ok();
    yield* talk(pick([`${B.pm.nm} tucks the chin and covers up.`,`${B.pm.nm} raises the guard. Waiting...`,`${B.pm.nm} slows it down, breathes, hands high.`]),26);
    r=yield* enemyTurn();B.guard=0;return r||'continue';
  }
  if(pc.t==='crew'){
    yield* useCrewAb(pc.id);
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='fin'){
    yield* finisher();
    r=yield* checkFaints();if(r)return r;
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='switch'){
    const old=B.pm;
    yield* talk(`Come back, ${old.nm}!`,20);
    B.pm=G.gang[pc.i];B.part.add(B.pm);B.off.p.a=1;sfx.ok();
    yield* talk(`Go! ${B.pm.nm}!`,20);
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='item'){
    G.items[pc.id]--;
    yield* applyItem(pc.id,G.gang[pc.i],true);
    r=yield* enemyTurn();return r||'continue';
  }
  // move
  const pi=pc.i,ei=B.ei>=0&&B.em.moves[B.ei]&&B.em.moves[B.ei].pp>0?B.ei:enemyMove();B.ei=-1;
  const pmv=pc.t==='arm'?G.L.arms[pi]:(pi>=0?B.pm.moves[pi]:{id:'struggle',pp:1}),emv=ei>=0?B.em.moves[ei]:{id:'struggle',pp:1};
  const pp=(M[pmv.id].pri||0),ep=(M[emv.id].pri||0);
  const ps_=B.pm.spd*stageMul(B.pm.sg.spd||0),es_=B.em.spd*stageMul(B.em.sg.spd||0);
  let pFirst=pp!==ep?pp>ep:(ps_!==es_?ps_>es_:Math.random()<.5);
  const order=pFirst?[['p',pmv],['e',emv]]:[['e',emv],['p',pmv]];
  for(const [s,mv] of order){
    const att=s==='p'?B.pm:B.em;
    if(!alive(att))continue;
    if(s==='e'&&!alive(B.pm))continue;
    yield* execMove(s,mv);
    r=yield* checkFaints();
    if(r)return r;
  }
  r=yield* endTurn();
  return r||'continue';
}
function* enemyTurn(){
  const ei=B.ei>=0&&B.em.moves[B.ei]&&B.em.moves[B.ei].pp>0?B.ei:enemyMove();B.ei=-1;
  const mv=ei>=0?B.em.moves[ei]:{id:'struggle',pp:1};
  yield* execMove('e',mv);
  let r=yield* checkFaints();if(r)return r;
  return yield* endTurn();
}
function* endTurn(){
  for(const s of ['p','e']){
    const m=s==='p'?B.pm:B.em;
    if(!alive(m))continue;
    if(m.st==='bleed'){
      yield* hurt(s,Math.max(1,Math.floor(m.mhp/8)));sfx.hit();
      yield* talk(`${m.nm} is bleeding!`,24);
    }else if(m.st==='high'&&m.hp<m.mhp){
      m.hp=Math.min(m.mhp,m.hp+Math.max(1,Math.floor(m.mhp/16)));yield* talk(`${m.nm} is feeling nice and mellow.`,24);
    }
    if(m.shk>0)m.shk--;
    m.sta=Math.min(100,(m.sta||0)+12+(s==='p'&&m.s==='bandit'&&G.pl&&G.pl.tr&&G.pl.tr.cardio?8:0));
    if(s==='e'&&B.boss&&!m._rage&&m.hp<m.mhp*.35){m._rage=1;m.sg.atk=Math.min(3,m.sg.atk+1);m.sta=100;sfx.siren();Fx.shake=12;bcap(m.nm+' IS ENRAGED!',true);yield* talk(`${m.nm} roars. The whole pod goes quiet. He is not done.`,36);}
  }
  B.turn++;
  if(alive(B.em)&&alive(B.pm)&&typeof bossTrait==='function'){const bt=bossTrait();if(bt&&bt.turn)yield* bt.turn(B.em,B.pm);}
  if(B.smoke>0)B.smoke=Math.max(0,B.smoke-40);
  return yield* checkFaints();
}
function* setStatus(m,st,msg){
  if(m.st){yield* talk('It did not work. '+m.nm+' is already messed up.',26);return false;}
  m.st=st;yield* talk(msg,30);return true;
}
function* execMove(s,mvslot){
  const att=s==='p'?B.pm:B.em,def=s==='p'?B.em:B.pm,ds=s==='p'?'e':'p';
  const d=M[mvslot.id];
  if(att.stn>0){att.stn--;yield* talk(`${att.nm} is too dizzy to move!`,30);return;}
  if(att.st==='drunk'&&Math.random()<.25){sfx.miss();yield* talk(`${att.nm} stumbles around drunk!`,30);return;}
  if(mvslot.id!=='struggle'&&!d.eternal)mvslot.pp=Math.max(0,mvslot.pp-1);
  const cost=staCost(d),gassed=(att.sta||0)<cost;att.sta=Math.max(0,(att.sta||0)-cost);
  if(gassed&&d.p)yield* talk(pick([`${att.nm} is GASSED. Arms like noodles.`,`${att.nm} is sucking wind. That one has nothing on it.`]),26);
  if(d.fx==='lukey')yield* talk(`${att.nm} yells "I'LL GIVE YOU LUKEY!!"`,40);
  else yield* talk(d.s?storyLine(d,att,def,s):`${att.nm} used ${d.n}!`,d.s?44:28);
  // accuracy
  const E=B.env||BENV.pod;
  if(E.slip&&Math.random()<E.slip&&!d.self){sfx.miss();Fx.shake=8;yield* talk(pick(E.slipLines||['slips!']).replace('{a}',att.nm),30);yield* hurt(s,Math.max(1,Math.floor(att.mhp*.04)));return;}
  let acc=d.a*accMul(att.sg.acc)*E.acc*(gassed?.8:1);
  if(!d.self&&Math.random()*100>acc){if(s==='p')B.chain=0;if(d.p&&hasCombo(mvslot.id)&&R3.ok){yield* comboFight(s,mvslot.id,Math.max(1,d.p),true);}else if(d.p&&R3.ok){yield* lunge(s,mvslot.id,true);}sfx.miss();if(typeof plCount==='function'&&s==='e'&&def.s==='bandit')plCount('dodge',1);yield* talk('But it missed!',26);return;}
  // bottle fumble
  if(d.fx==='bottle'&&Math.random()<.22+E.fumble){yield* bottleFumble(s,att);return;}
  if(d.fx==='bottle')yield* bottleThrow(s);
  if(d.p){
    if(!hasCombo(mvslot.id))yield* lunge(s,mvslot.id);
    const crit=Math.random()<(((d.crit||att.shk>0)?.25:.0625)+E.crit+(att.s==='bandit'?(typeof plCrit==='function'?plCrit():0):0));
    let bonus=att.shk>0?1.3:1;
    if(d.fx==='stunbonus'&&def.stn>0)bonus*=2;
    if(d.fx==='lukey')bonus*=1;
    const A=att.atk*stageMul(att.sg.atk),D=def.def*stageMul(def.sg.def);
    const tm=typeMult(d.t,SP[def.s].t),stab=SP[att.s].t===d.t?1.25:1;
    let dmg=Math.floor(((2*att.l/5+2)*d.p*A/D)/50)+2;
    dmg=Math.max(1,Math.floor(dmg*tm*stab*(crit?1.6:1)*(.85+Math.random()*.15)*bonus*E.dmg*(E.big&&d.p>=95?E.big:1)*(gassed?.6:1)*(s==='e'&&B.guard?.45:1)*(s==='p'&&B.chain>=2?1.15:1)*((d.t==='SNK'&&typeof nightMod==='function')?nightMod():1)));
    let blocked=false;
    if(!crit&&d.p<100){
      const pB=s==='e'?(B.guard?1:0):((def.sg.def>0?.22+.12*def.sg.def:.08)+(SP[def.s].t==='MUS'?.06:0)+(B.boss?.1:0)+(def.stn>0?-1:0));
      if(Math.random()<pB){blocked=true;dmg=Math.max(1,Math.floor(dmg*(s==='e'&&B.guard?1:.6)));if(B.an&&B.an[ds])B.an[ds].blk=1;}
    }
    dmg=Math.min(dmg,def.hp);
    crit?sfx.crit():sfx.hit();
    if(typeof plCount==='function'){if(s==='p'&&att.s==='bandit'){plCount('hit',1);if(crit)plCount('crit',1);}if(s==='e'&&def.s==='bandit')plCount('taken',dmg);}
    if(d.fx==='lukey'){Fx.shake=16;Fx.flashCol='#4aa0ff';Fx.flash=8;}
    if(s==='e'&&B.guard){sfx.bump();Fx.shake=4;bcap('BLOCKED');}
    if(hasCombo(mvslot.id))yield* comboFight(s,mvslot.id,dmg,false);else yield* hurt(ds,dmg);
    if(B.an&&B.an[ds])B.an[ds].blk=0;
    if(blocked&&s==='p')yield* talk(pick([`${def.nm} covers up and eats it on the arms.`,`${def.nm} blocks most of it.`,`${def.nm} gets his guard up in time.`]),22);
    if(s==='p'){B.chain++;if(B.chain===3){bcap('3-HIT CHAIN!',true);sfx.level();}else if(B.chain>3)bcap(B.chain+'-HIT CHAIN');}
    else{B.chain=0;}
    if(crit)yield* talk('A critical hit!',22);
    if(s==='e'&&B.guard&&d.p>=70&&alive(def)&&alive(att)){yield* counterHit(def,att);}
    if(s==='e'&&alive(def)&&typeof bossTrait==='function'){const bt=bossTrait();if(bt&&bt.hit)yield* bt.hit(att,def);}
    if(d.p>=85&&dmg>=def.mhp*.2&&alive(def)&&Math.random()<.4&&!def.stn){def.stn=1;B.dizzy[ds]=90;Fx.shake=16;bcap('KNOCKDOWN!',true);sfx.slam();if(typeof b3Knockdown==='function'&&B.s3)b3Knockdown(ds);yield* talk(pick([`${def.nm} goes DOWN! The ref would have stopped it.`,`${def.nm} eats concrete. He is not getting up fast.`,`${def.nm} is flat on his back, counting ceiling tiles.`]),34);}
    if(d.drain&&alive(att)){const hl=Math.max(1,Math.floor(dmg*d.drain));att.hp=Math.min(att.mhp,att.hp+hl);yield* talk(`${att.nm} heals ${hl} HP!`,24);}
    if(d.w&&s==='p'&&mvslot.pp<=0&&!d.eternal){const ix=G.L.arms.indexOf(mvslot);if(ix>=0)G.L.arms.splice(ix,1);yield* talk(`The ${d.n} breaks apart!`,30);}
    if(alive(def)&&def.hp<def.mhp*.25&&!def._low){def._low=1;yield* talk(pick([`${def.nm} is spitting blood, barely on his feet!`,`${def.nm}'s knees buckle. One more good shot...`,`${def.nm} is swaying. The crowd smells blood.`]),34);}
    else if(alive(def)&&d.p>=85&&dmg>=def.mhp*.25)yield* talk(pick([`${def.nm} crashes hard. That one hurt.`,`${def.nm} hits the ground like a sack of laundry!`,`That one echoed off the walls!`]),30);
    if(tm>1)yield* talk("It's super effective!",24);else if(tm<1)yield* talk("It's not very effective...",24);
    if(d.fx==='recoil'){const rc=Math.max(1,Math.floor(dmg/4));yield* hurt(s,rc);yield* talk(`${att.nm} hurt itself in the process!`,24);}
    if(alive(def)){
      if(d.fx==='lukey'){def.stn=1;B.dizzy[ds]=90;yield* talk(`The cops swarm in! ${def.nm} is stunned!`,34);}
      else{yield* applyFx(d.fx,d.c,att,def,ds,s);yield* applyFx(d.fx2,d.c2,att,def,ds,s);}
      if(att.shk>0&&Math.random()<.4&&!def.st){def.st='bleed';yield* talk(`${def.nm} is cut deep and bleeding!`,26);}
    }
    if(d.fx==='steal'&&Math.random()*100<(d.c||40)){
      const n=ri(1,3);
      if(s==='e'){const t=Math.min(n,G.items.cigs);if(t>0){G.items.cigs-=t;sfx.pick();yield* talk(`${att.nm} swiped ${t} L&M ${t>1?'packs':'pack'}!`,28);}}
      else{G.items.cigs+=n;sfx.pick();yield* talk(`${att.nm} swiped ${n} L&M ${n>1?'packs':'pack'}!`,28);}
    }
    return;
  }
  // status moves
  yield* lunge(s,mvslot.id);
  switch(d.fx){
    case 'atkdown':def.sg.atk=Math.max(-3,def.sg.atk-1);sfx.blip();yield* talk(`${def.nm}'s attack fell!`,26);break;
    case 'accdown':def.sg.acc=Math.max(-3,def.sg.acc-1);sfx.blip();yield* talk(`${def.nm}'s aim got worse!`,26);break;
    case 'spddown':def.sg.spd=Math.max(-3,(def.sg.spd||0)-1);sfx.blip();yield* talk(`${def.nm} slows down!`,26);break;
    case 'defup':att.sg.def=Math.min(3,att.sg.def+1);sfx.heal();yield* talk(`${att.nm}'s defense rose!`,26);break;
    case 'atkup':att.sg.atk=Math.min(3,att.sg.atk+1);sfx.heal();yield* talk(`${att.nm}'s attack rose!`,26);break;
    case 'heal':{const h=Math.max(1,Math.floor(att.mhp*.4));att.hp=Math.min(att.mhp,att.hp+h);sfx.heal();yield* talk(`${att.nm} recovered health!`,26);break;}
    case 'drunkup':att.sg.atk=Math.min(3,att.sg.atk+2);if(!att.st)att.st='drunk';sfx.bottle();yield* talk(`${att.nm} chugs a beer. Attack way up, but wobbly!`,30);break;
    case 'high':att.sg.def=Math.min(3,att.sg.def+1);att.sg.acc=Math.max(-3,att.sg.acc-1);if(!att.st)att.st='high';sfx.heal();yield* talk(`${att.nm} takes a rip. Chill. Tougher, but the aim is off.`,32);break;
  }
}
function* applyFx(fx,c,att,def,ds,s){
  if(!fx||!alive(def))return;
  const hit=Math.random()*100<(c||35);
  switch(fx){
    case 'stun':if(hit){def.stn=1;B.dizzy[ds]=90;yield* talk(`${def.nm} is stunned!`,24);}break;
    case 'defdown':if(hit){def.sg.def=Math.max(-3,def.sg.def-1);sfx.blip();yield* talk(`${def.nm}'s guard is broken! Defense fell!`,26);}break;
    case 'atkdown':if(hit){def.sg.atk=Math.max(-3,def.sg.atk-1);sfx.blip();yield* talk(`${def.nm} is rattled! Attack fell!`,26);}break;
    case 'accdown':if(hit){def.sg.acc=Math.max(-3,def.sg.acc-1);sfx.blip();yield* talk(`${def.nm} can't see straight! Accuracy fell!`,26);}break;
    case 'spddown':if(hit){def.sg.spd=Math.max(-3,(def.sg.spd||0)-1);sfx.blip();yield* talk(`${def.nm}'s legs are heavy! Speed fell!`,26);}break;
    case 'bleed':if(hit&&!def.st){def.st='bleed';yield* talk(`${def.nm} is bleeding!`,26);}break;
  }
}
function* bottleThrow(s){
  const fx=s==='p'?70:190,tx=s==='p'?190:70,fy=s==='p'?100:50,ty=s==='p'?50:100;
  sfx.bottle();
  for(let i=0;i<=16;i++){const k=i/16;B.proj={x:fx+(tx-fx)*k,y:fy+(ty-fy)*k-Math.sin(k*Math.PI)*24,r:k*12,k,from:s};yield 1;}
  B.proj=null;
}
function* bottleFumble(s,att){
  const sx=s==='p'?70:190,sy=s==='p'?100:50;
  sfx.bottle();
  for(let i=0;i<=14;i++){const k=i/14;B.proj={x:sx+(s==='p'?1:-1)*k*14,y:sy-k*36,r:k*10,fk:k,ph:1,who:s};yield 1;}
  yield* talk('...the bottle slips out of his hand!',26);
  for(let i=0;i<=10;i++){const k=i/10;B.proj={x:sx+(s==='p'?1:-1)*(14-k*14),y:sy-36+k*58,r:20+k*14,fk:k,ph:2,who:s};yield 1;}
  B.proj=null;
  sfx.ow();Fx.shake=18;Fx.flashCol='#ffd23a';Fx.flash=5;B.dizzy[s]=120;
  yield* talk('CLONK!! Right in the nuts!!!',44);
  const dmg=Math.max(2,Math.floor(att.mhp/6));
  yield* hurt(s,Math.min(dmg,att.hp));
  att.stn=1;
  yield* talk(`${att.nm} is curled up in agony!`,34);
}

/* ---- items, deals ---- */
function* applyItem(id,m,inBattle){
  const it=IT[id];
  if(id==='shank'){m.shk=3;sfx.pick();yield* talk(`${m.nm} grips the shank. Hits cut deeper for 3 turns!`,32);return;}
  if(id==='beer'){m.sg&&(m.sg.atk=Math.min(3,m.sg.atk+2));if(!m.st)m.st='drunk';m.hp=Math.min(m.mhp,m.hp+it.h);sfx.bottle();yield* talk(`${m.nm} chugs the warm prison beer. Hits harder, but wobbly!`,34);return;}
  if(id==='perogi'){
    const was=m.hp<=0;
    m.hp=was?Math.floor(m.mhp/2):m.mhp;if(!was)m.st=null;else m.st=null;
    sfx.heal();yield* talk(was?`${m.nm} sniffs a perogi and wakes up!`:`${m.nm} scarfs a perogi. Fully healed!`,32);return;
  }
  const amt=it.h;m.hp=Math.min(m.mhp,m.hp+amt);
  if(id==='weed'){m.sg&&(m.sg.def=Math.min(3,m.sg.def+1),m.sg.acc=Math.max(-3,m.sg.acc-1));if(!m.st)m.st='high';}
  if(id==='cigs')m.stn=0;
  sfx.heal();yield* talk(id==='weed'?`${m.nm} gets mellow. +${amt} HP, tougher but the aim is off.`:`${m.nm} smokes an L&M and calms down. +${amt} HP.`,32);
}
function* tryDeal(pc){
  const f=B.em;G.items[pc.id]--;
  yield* talk(`You offer ${f.nm} some ${IT[pc.id].n}...`,34);
  const ch=clamp(.35+(1-f.hp/f.mhp)*.4,.2,.9);
  for(let i=0;i<3;i++){sfx.blip();B.off.e.y=-3;yield 8;B.off.e.y=0;yield 8;}
  if(Math.random()<ch){sfx.caught();f.stn=1;f.sg.atk=Math.max(-3,f.sg.atk-1);B.dizzy.e=90;yield* talk(`${f.nm} grabs it and starts counting. "Hold on, hold on..." Distracted! Attack fell.`,40);}
  else{sfx.miss();yield* talk(`${f.nm} laughs. "Not enough."`,34);}
  return 'fail';
}
function* tryDealOld(pc){
  const f=B.em;
  if(G.gang.length>=6){yield* talk('Your crew is full (6)! Release someone first.');return 'fail';}
  G.items[pc.id]--;
  yield* talk(`You offer ${f.nm} some ${IT[pc.id].n}...`,34);
  let ch=.12+(1-f.hp/f.mhp)*.5+pc.b+(f.st?.08:0)+(f.stn>0?.1:0)-Math.max(0,f.l-maxLevel())*.03;
  ch=clamp(ch,.05,.95);
  for(let i=0;i<3;i++){sfx.blip();B.off.e.y=-3;yield 8;B.off.e.y=0;yield 8;}
  if(Math.random()<ch){
    sfx.caught();
    const mon=f;mon.st=null;cleanMon(mon);mon.hp=Math.max(1,mon.hp);G.gang.push(mon);
    yield* talk(`${f.nm} the ${SP[f.s].n} joins your crew!`,50);
    B.recruited=mon;return 'recruit';
  }
  sfx.miss();
  yield* talk(ch>.5?`${f.nm} almost took it...`:`${f.nm} laughs. "Not enough."`,34);
  return 'fail';
}

/* ---- faint, xp ---- */
function* checkFaints(){
  if(!alive(B.em)){
    sfx.hit();for(let i=0;i<14;i++){B.off.e.y+=3;B.off.e.a=1-i/14;yield 1;}B.off.e.a=0;
    yield* talk(`${B.em.nm} is down!`,30);
    if(typeof plCount==='function')plCount('ko',1);
    yield* award();
    if(B.fi+1<B.foes.length){
      B.fi++;B.em=B.foes[B.fi];B.off.e={x:0,y:0,a:1,fl:0,vx:90};
      for(let i=0;i<20;i++){B.off.e.vx=Math.max(0,B.off.e.vx-5);yield 1;}B.off.e.vx=0;
      yield* talk(`${B.o.name} sends out ${B.em.nm}!`,34);
    }else return 'win';
    return null;
  }
  if(!alive(B.pm)){
    sfx.hit();for(let i=0;i<14;i++){B.off.p.y+=3;B.off.p.a=1-i/14;yield 1;}B.off.p.a=0;
    yield* talk(`${B.pm.nm} is knocked out!`,30);

function checkSight(){

      const x=n.x+DX[n.dir]*k,y=n.y+DY[n.dir]*k;

const FLAVOR={[TL.TV]:['Daytime TV. Somebody is yelling about a paternity test.','The TV only gets one channel. It is the news about the Browns.'],
  [TL.BUNK]:['A bunk. Thin as a pancake.'],[TL.TOILET]:['No. Just no.'],[TL.LOCKER]:['Empty locker. Smells like feet.'],[TL.SINK]:['A steel sink. The water is brown-ish.'],
  [TL.POSTER]:['A faded poster: "SNITCHES GET STITCHES. ALSO PAROLE."'],[TL.CRATE]:['Crates of mystery food. Probably perogi-adjacent.'],
  [TL.WEIGHT]:['A rusty bench. Somebody benched way too much and left it.'],[TL.SHELF]:['Shelves of overpriced snacks. A bag of chips is 4 packs of L&M.'],
  [TL.LAUND]:['A washing machine. Orange. All the clothes are orange.'],[TL.BED]:['A hospital bed. Clean sheets. A luxury.'],[TL.TABLE]:['A steel table bolted to the floor.'],
  [TL.GATE]:['A steel gate. Locked.'],[TL.FENCE]:['Chain-link. Razor wire on top. Not today.'],[TL.WIRE]:['Razor wire. Hard pass.'],[TL.TOWER]:['A guard tower. A guard waves. You do not wave back.']};
function interact(){
  const m=cur(),fx=G.x+DX[G.dir],fy=G.y+DY[G.dir];
  let n=npcAt(fx,fy);
  if(!n&&tileAt(m,fx,fy)===TL.COUNTER){const n2=npcAt(fx+DX[G.dir],fy+DY[G.dir]);if(n2&&n2.reach)n=n2;}
  if(n){faceTo(n,G.x,G.y);talkNpc(n);return;}
  const t=tileAt(m,fx,fy);
  if(t===TL.TRAY){tray(fx,fy);return;}
  if(t===TL.WEIGHT&&(G.map==='gym'||G.map==='yard')){trainStart();return;}
  if(t===TL.BUNK){sleepPrompt();return;}
  if((t===TL.SHOWER||t===TL.LOCKER||t===TL.CRATE||t===TL.SHELF||t===TL.LAUND||t===TL.SINK)&&typeof searchSpot==='function'){WS().stats.search++;if(typeof tunnelSearch==='function'&&tunnelSearch(t,fx,fy))return;if(searchSpot(t,fx,fy))return;}
  if(FLAVOR[t])say(pick(FLAVOR[t]));
}
function tray(x,y){
  const key=G.map+x+'_'+y;
  if((G.trays[key]||0)>G.steps){say('The tray is empty. The tray ladies are glaring at you.');return;}
  G.trays[key]=G.steps+260;
  const r=Math.random();
  if(r<.45){G.items.perogi++;sfx.pick();say('You sneak a hot perogi off the tray! Potato and cheese.');}
  else if(r<.7){G.items.perogi+=2;sfx.pick();say('Jackpot! Two fresh perogis, still steaming!');}
  else if(r<.84){G.items.shark=(G.items.shark||0)+1;sfx.pick();say('A SHARK CARD taped under the tray! Bonus!');}
  else if(r<.9){G.items.cigs+=2;sfx.pick();say('No perogis, but somebody left 2 L&M packs under the tray.');}
  else say('Cold mashed potatoes. The ladies laugh at you.');
}
function talkNpc(n){
  if(n.br)return brawlInteract(n);
  if(typeof questHook==='function'&&questHook(n))return;
  if(n.say&&typeof guardTalk==='function'&&guardTalk(n))return;
  if(n.tr){
    if(defeated(n)){
      if(n.tr.join&&!G.flags['gone_'+n.id]){openMenu({x:100,y:60,w:136,title:n.tr.name.toUpperCase().slice(0,18),items:[{l:'TALK',f:()=>say(n.tr.post||'...')},{l:'ASK TO JOIN',f:()=>askStory(n)},{l:'LEAVE',f:()=>{}}]});return;}
      say(n.tr.post||'...');return;}
    Cs.run((function*(){yield* challenge(n);})());return;
  }
  const s=n.say||['...'];
  if(s[0]==='inmate')return talkInmate(n);
  if(s[0]==='intake')return officer();
  if(s[0]==='baba')return baba();
  if(s[0]==='corey')return corey();
  if(s[0]==='nurse')return nurse();
  s.forEach(t=>say(t));
}
function officer(){
  if(!G.flags.gotSuit){
    Cs.run((function*(){
      yield* talk('Officer Dunkle: Name. ...Regal Bandit Popstar? That is not a name, that is a threat.',0);
      yield* talk('Officer Dunkle: Whatever. Welcome to Lake County Jail. Four pods, four pod bosses. Nobody gets out until the bosses say so.',0);
      yield* talk('Officer Dunkle: Here is your jumpsuit and a few L&M packs. In here, smokes are money.',0);

function mkLook(R){
  const pk=a=>a[Math.floor(R()*a.length)];
  const L={sk:pk(SKIN),hr:pk(HAIRC),st:pk(STY),hc:pk(HATC),sh:R()<.12?pk(['#4a6aa8','#e8e8ea','#6a8a5a']):'#e8731c',ac:[],w:R()<.28};
  if(L.sh==='#e8731c')L.pn=pk(['#e8731c','#e8731c','#d4651a','#c25a14']);
  if(L.st==='bald')L.hr=L.sk;
  if(R()<.18)L.ac.push('beard');
  if(R()<.1)L.ac.push('glasses');
  if(R()<.07)L.ac.push('scar');
  if(R()<.1&&!L.ac.includes('glasses'))L.ac.push('shades');
  if(R()<.12)L.ac.push('cig');
  if(R()<.025)L.ac.push('crazy');
  if(R()<.02)L.ac.push('chin');
  if(R()<.04&&L.st!=='beanie'&&L.st!=='cap')L.ac.push('hat');
  if(R()<.2)L.sleeve='#f2f0e8';
  return L;
}

/* ---- conversation engine ---- */
const spl=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const chance=p=>Math.random()<p;
function giveCigs(n){G.items.cigs+=n;sfx.pick();}
function heatTick(){const v=vv();if(G.steps-(v.ht||0)>420&&v.heat>0){v.heat--;v.ht=G.steps;}}
function shakedown(done){
  const v=vv(),lost=Math.min(G.items.cigs,spl(2,5));
  G.items.cigs-=lost;v.heat=2;
  say('Guard Hobbs: SHAKEDOWN! Hands where I can see them! Not there. Higher. Okay, now you look like a pop star.');
  say(lost?`Hobbs pockets ${lost} L&M packs. "Evidence." He is smoking one. "Evidence of what, Hobbs?" "Flavor."`:'Hobbs finds nothing but lint. He is disappointed. He keeps the lint.',done);
}
function talkInmate(n){
  const c=ROSTER_BY[n.say[1]];if(!c)return;
  faceTo(n,G.x,G.y);heatTick();
  const v=vv(),mt=metOf(c.id),T_=TRAIT[c.tr];
  if(v.heat>=6){shakedown(()=>{});return;}
  const first=mt.n===0;mt.n++;
  const TP=TEMPER[c.temp]||TEMPER.chill,z=zoneNow();
  const name=c.nm;
  const L=()=>{
    if(first){
      const a=c.intro?c.intro:[name+': '+pk(HELLO)+' '+pk(T_.intro)];
      a.forEach(t=>say(t));
      say(`(${TP.n}) ${pk(TP.flav)}`);
      if(c.temp==='hot'&&Math.random()<.2+z.d*.55){say(`${name}: WHAT ARE YOU LOOKING AT?! You know what? FINE!`,()=>duel(n,c,`${name}: I'VE BEEN WAITING ALL DAY FOR THIS!`));return;}
      if(c.crime)say(`${name}: I'm in for ${c.crime}`);
      say('...',()=>choice(c,n));
    }else{
      const b=c.banter?pk(c.banter):name+': '+pk(T_.banter);
      say(b);
      if(G.steps>=mt.cd)say('(Talk some more?)',()=>choice(c,n));
    }
  };
  {const rg=typeof repGreet==='function'?repGreet(name,mt):null;if(rg&&!first&&Math.random()<.5)say(rg);}
  L();
}
function choice(c,n){
  const v=vv(),mt=metOf(c.id),T_=TRAIT[c.tr],name=c.nm;
  const items=[];
  const add=(l,f,d)=>items.push({l,f,d:!!d});
  T_.ch.forEach(k=>{
    if(k==='joke'||k==='joke2')add(k==='joke'?'TELL A JOKE':'DO A BIT',()=>act(c,'joke'));
    else if(k==='compliment')add('COMPLIMENT',()=>act(c,'compliment'));
    else if(k==='intimidate')add('INTIMIDATE',()=>act(c,'intimidate'));
    else if(k==='listen')add('LISTEN',()=>act(c,'listen'));
    else if(k==='bribe')add('TIP 2 L&M',()=>act(c,'bribe'),G.items.cigs<2);
    else if(k==='trade')add('GIVE PEROGI',()=>act(c,'trade'),G.items.perogi<1);
    else if(k==='weed')add('SELL WEED',()=>act(c,'weed'),G.items.weed<1);
    else if(k==='beer')add('SHARE BEER',()=>act(c,'beer'),G.items.beer<1);
  });
  if(!items.some(i=>i.l==='SELL WEED')&&G.items.weed>0)add('SELL WEED',()=>act(c,'weed'));
  if(c.temp==='hot'||c.temp==='scrap'||c.temp==='grump')add('FIGHT',()=>duel(n,c,`${name}: Oh, it's ON.`));
  if(typeof questChoice==='function')questChoice(c,n,add);
  add('ASK TO JOIN',()=>askJoin(c,n));
  add('LEAVE',()=>{say(pk([`${name}: Later.`,`${name}: Don't be a stranger. Be a normal person.`,`${name}: Peace out. Or in. Whatever.`]));});
  openMenu({x:56,y:Math.max(24,H-68-(items.length*13+20)),w:180,items,title:name.toUpperCase().slice(0,22),cancel:()=>{}});
}
function act(c,k){
  const v=vv(),mt=metOf(c.id),T_=TRAIT[c.tr],nm=c.nm;
  const r0=v.resp+v.cheer+v.fav;
  const cool=()=>{mt.bond=(mt.bond||0)+Math.max(0,(v.resp+v.cheer+v.fav)-r0);mt.cd=G.steps+90;};
  const heat=(h)=>{v.heat=Math.max(0,v.heat+h);if(v.heat>=5)say('⚠ Heat is climbing. Guards are staring.');};
  switch(k){
   case 'joke':{
    const p=.38+(c.tr==='comedian'?.25:0)+(c.tr==='sleepy'?-.1:0)+(c.tr==='holy'?-.1:0)+Math.min(.2,v.cheer*.02);
    if(chance(p)){v.resp++;v.cheer++;say(pk(JOKE_OK));if(chance(.4)){const g=spl(1,2);giveCigs(g);say(`${nm} laughs so hard he pays a "laugh tax": +${g} L&M.`);}}
    else{v.cheer=Math.max(0,v.cheer-0);say(pk(JOKE_BAD));if(chance(.25)){v.resp--;say('Respect -1');}}
    break;}
   case 'compliment':{
    const p=.62+(c.tr==='fan'?.3:0)+(c.tr==='tough'?-.3:0);
    if(chance(p)){v.resp++;say(pk([`${nm} blushes. A man his size should not blush that hard.`,`${nm}: "Stop it. No, keep going."`,`${nm}: "That's the nicest thing anyone has said since the arraignment."`]));
      if(c.tr==='fan'){v.resp+=2;say('He asks you to sign his arm. You sign "RBP". It looks like a rash. Respect +2');}
      else if(chance(.3)){giveCigs(1);say('He slips you a pack. "For the compliment." +1 L&M');}}
    else{say(pk([`${nm} squints. "What do you want?"`,`${nm}: "Is this a mugging? With feelings?"`]));}
    break;}
   case 'intimidate':{

function stepWalk(br){
  const a=br.a,b=br.b;
  // sliding between tiles
  if(a.px!==a.x*T||a.py!==a.y*T){
    const sx=Math.sign(a.x*T-a.px),sy=Math.sign(a.y*T-a.py);
    a.px+=sx*Math.min(1.7,Math.abs(a.x*T-a.px));a.py+=sy*Math.min(1.7,Math.abs(a.y*T-a.py));
    a.br.ph+=.5;return;
  }
  const dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)+Math.abs(dy)<=1){br.st='fight';br.t=0;a.br.ph=0;faceTo(a,b.x,b.y);faceTo(b,a.x,a.y);
    // crowd reacts
    npcsHere().forEach(n=>{if(n!==a&&n!==b&&!n.br&&Math.abs(n.x-a.x)+Math.abs(n.y-a.y)<=7&&n.say){faceTo(n,a.x,a.y);if(Math.random()<.4)n.excl=30;}});
    sfx.crit();return;}
  const opts=Math.abs(dx)>=Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];
  for(const [sx,sy] of opts){
    if(!sx&&!sy)continue;
    if(freeTile(a.x+sx,a.y+sy,null)){a.x+=sx;a.y+=sy;a.dir=sx<0?2:sx>0?3:sy<0?1:0;return;}

function brawlUpdate(){

function brawlRig(n,nx,nz,tt){
  const s=n.br,br=n.brw,o=s.o,[ox,oz]=wpos(o);
  const dx=ox-nx,dz=oz-nz,yaw=Math.atan2(dx,dz),len=Math.hypot(dx,dz)||1,ux=dx/len,uz=dz/len;
  let off=0,pose={bob:0,armL:[-1,.3],armR:[-1,-.3]},flash=0,y=0,lean=0,roll=0;
  const sw=Math.sin(tt*9+n.x);
  if(br.st==='walk'&&n.brw.a===n){pose=poseWalk(s.ph,1.4);pose.armL=[-1.1,.2];pose.armR=[-1.1,-.2];}
  else if(s.down){
    roll=-1.45;y=.32;lean=0;pose={armL:[.3,0],armR:[-.2,0]};
    if(br.endT>230){const k=(br.endT-230)/70;roll=-1.45*(1-k);y=.32*(1-k);}
  }
  else if(s.wn){pose={bob:Math.abs(sw)*.06,armL:[-2.6+sw*.3,0],armR:[-3+Math.sin(tt*11)*.4,0]};}
  else if(br.st==='end'){pose={bob:0,armL:[-.4,.1],armR:[-.4,-.1]};}
  else{
    pose={bob:Math.abs(sw)*.03,armL:[-1+sw*.08,.3],armR:[-1-sw*.08,-.3]};
    if(s.kind){
      const k=s.k,ex=k<.35?-.5*Math.sin(k/.35*Math.PI/2):k<.55?-.5+1.5*((k-.35)/.2):1-((k-.55)/.45);
      const f=Math.max(ex,0),bk=Math.max(-ex,0);
      switch(s.kind.k){
        case 'jab':pose.armR=[-1.6*f+.4*bk-1*(1-f)*(1-bk),0];off=.32*f;break;
        case 'hook':pose.armR=[-1.35,0];pose.armRy=1.2*bk-1.5*f;pose.twist=.5*bk-.5*f;off=.2*f;break;
        case 'kick':pose.legR=-1.5*f+.5*bk;lean=-.18*f;pose.armL=[-.6,.8];pose.armR=[-.6,-.8];off=.15*f;break;
        case 'butt':pose.headX=-.9*f;lean=.25*f;off=.3*f;break;
        case 'tackle':lean=.75*f-.2*bk;pose.armL=[-1.6,.2];pose.armR=[-1.6,-.2];off=.7*f;break;
      }
    }
    if(s.rec>0){const r=s.rec/16;off-=.35*r;pose.headX=(pose.headX||0)+.7*r;flash=r>.5?.75:0;lean-=.3*r;}
    else if(s.rec<0){off-=0;}
  }
  pose.lean=lean;pose.roll=roll;
  // sideways wobble so the fighters circle a little
  const side=(!s.down&&br.st==='fight')?Math.sin(tt*2.2+n.x)*.06:0;
  return {x:nx+ux*off-uz*side,y,z:nz+uz*off+ux*side,yaw,pose,flash};
}

    if(p.tr.heavy)m.atk=Math.floor(m.atk*1.12);if(p.tr.killer)m.atk=Math.floor(m.atk*1.08);

const PAY={greedy:6,hustler:5,lawyer:4,critic:3};
function joinReq(c){

function askJoin(c,n){

  if(G.gang.length>=crewCap()){say(`${nm}: I like it, but ${G.crew.name} is full right now.`);say(`(Crew level ${G.crew.lv} fits ${crewCap()} fighters. Level the crew up with gang fights and boss wins.)`);return;}
  const R=joinReq(c),bond=mt.bond||0;
  if(R.beat&&!mt.beat){say(`${nm}: I only follow someone who can put me down. Prove it. Fight me.`);return;}
  if(bond<R.bond){say(`${nm}: I do not know you well enough yet. (Bond ${bond}/${R.bond}) Talk. Joke. Share a beer. Earn it.`);return;}
  if(v.resp<R.resp){say(`${nm}: You are not somebody yet. Get more respect around here. (Respect ${v.resp}/${R.resp})`);return;}
  if(R.pay&&G.items.cigs<R.pay){say(`${nm}: My loyalty costs ${R.pay} L&M. You are short.`);return;}
  ask(`${nm} will join ${G.crew.name}${R.pay?' for '+R.pay+' L&M':''}. Deal?`,()=>{
    if(R.pay)G.items.cigs-=R.pay;

  });

const W0=()=>({clock:7*60+40,day:1,q:{act:{},done:{}},ach:{},fit:'orange',ev:{last:0,n:0,done:{}},log:[],train:{},

function gameHour(){return Math.floor(WS().clock/60)%24;}
const PERIODS=[[6,'WAKE UP'],[7,'CHOW'],[8,'YARD TIME'],[12,'CHOW'],[13,'FREE TIME'],[17,'CHOW'],[18,'POD TIME'],[21,'LOCKDOWN']];
function period(){const h=gameHour();let p='LOCKDOWN';for(const [hh,n] of PERIODS)if(h>=hh)p=n;return p;}
function clockStr(){const c=WS().clock%1440,h=Math.floor(c/60),m=c%60;return `${((h+11)%12)+1}:${String(m).padStart(2,'0')}${h<12?'AM':'PM'}`;}
function clockAdd(mins){

  if(d1>d0){w.day+=d1-d0;if(G.L)G.L.day=w.day;onNewDay();}

const ENVT={};
function envTimed(env,id){
  const h=gameHour(),k=id+':'+h;if(ENVT[k])return ENVT[k];
  let day=1;if(h<5||h>=22)day=0;else if(h<7)day=(h-5)/2;else if(h>=19)day=1-(h-19)/3;
  const o=Object.assign({},env);
  const mul=(a,f,t)=>a.map((v,i)=>v*f+(t?t[i]*(1-f):0));
  if(id==='yard'){
    const n=1-day;
    o.sun=mul(env.sun,.22+.78*day);o.amb=mul(env.amb,.45+.55*day,[.18,.2,.38]);o.bg=mul(env.bg,day,[.03,.03,.09]);o.fog=mul(env.fog,day,[.04,.04,.1]);

/* ---- NPC routines: inmates wander near home, lean on the walls, mill around ---- */
function freeTileW(x,y,self){
  const m=cur();if(x<0||y<0||x>=m.w||y>=m.h)return false;const t=tileAt(m,x,y);
  if(SOLID.has(t)||t===TL.DOOR||t===TL.GATE)return false;
  if(x===G.x&&y===G.y)return false;
  if(Wd.mv>0&&x===G.x+DX[G.dir]&&y===G.y+DY[G.dir])return false;
  if(m.warps.some(w=>w.x===x&&w.y===y))return false;
  if(m.items.some(i=>i.x===x&&i.y===y&&!G.flags['got_'+i.id]))return false;
  return !cur().npcs.some(n=>n!==self&&n.x===x&&n.y===y);
}
function routineTick(){
  const m=cur();
  for(const n of m.npcs){
    if(n.rt){const r=n.rt;n.px+=DX[r.d]*2;n.py+=DY[r.d]*2;r.k++;if(r.k>=8){n.px=n.x*T;n.py=n.y*T;n.rt=null;}}
  }
  if(Say.on||Menus.length||Cs.g||busy())return;
  m._rt=(m._rt||0)+1;if(m._rt%22)return;
  const h=gameHour(),lock=period()==='LOCKDOWN';
  for(const n of npcsHere()){
    if(n.br||n.tr||n.reach||n.rt||!n.say||n.say[0]!=='inmate')continue;
    if(n.hx===undefined){n.hx=n.x;n.hy=n.y;}
    if(Math.abs(n.x-G.x)+Math.abs(n.y-G.y)<=1)continue;
    if(Math.random()>(lock?.06:.2))continue;
    if(Math.random()<.3){n.dir=ri(0,3);continue;}
    const d=ri(0,3),tx_=n.x+DX[d],ty=n.y+DY[d];
    if(Math.abs(tx_-n.hx)>3||Math.abs(ty-n.hy)>3){n.dir=d;continue;}
    if(!freeTileW(tx_,ty,n))continue;
    n.dir=d;n.px=n.x*T;n.py=n.y*T;n.x=tx_;n.y=ty;n.rt={d,k:0};
  }
}

function questStart(id){const w=WS();if(w.q.act[id]||w.q.done[id]||!QUESTS[id])return;w.q.act[id]=0;toast('NEW MISSION: '+QUESTS[id].t,'#6aef8a');sfx.pick();}
function questStep(id){const q=QUESTS[id];if(!q)return 0;let n=0;for(const s of q.steps){if(s.ok())n++;else break;}return n;}
function questTick(){
  const w=WS();if(!w.q.act.m1&&!w.q.done.m1)w.q.act.m1=0;
  for(const id in w.q.act){
    const q=QUESTS[id];if(!q){delete w.q.act[id];continue;}
    const n=questStep(id);
    if(n>w.q.act[id]&&n<q.steps.length){w.q.act[id]=n;toast('✓ '+q.steps[n-1].t,'#fff');}
    if(n>=q.steps.length){delete w.q.act[id];w.q.done[id]=1;toast('MISSION COMPLETE: '+q.t,'#ffd23a');sfx.level();try{q.rw&&q.rw();}catch(e){}
      if(typeof crewGain==='function'&&G.crew)crewGain(q.main?12:6);
      if(q.next)questStart(q.next);}
  }
}
function mainQuest(){const w=WS();for(const id in w.q.act)if(QUESTS[id].main)return id;return null;}
function objective(){
  const id=mainQuest();if(!id)return null;
  const q=QUESTS[id],n=questStep(id),st=q.steps[Math.min(n,q.steps.length-1)];
  if(!st)return null;
  if(st.at&&st.at.map===G.map)return {x:st.at.x,y:st.at.y,t:st.t.toUpperCase()};
  return {t:st.t.toUpperCase(),x:-1,y:-1};
}
function missionsMenu(){
  const w=WS();const items=[];
  const act=Object.keys(w.q.act).sort((a,b)=>(QUESTS[b].main?1:0)-(QUESTS[a].main?1:0));
  for(const id of act){const q=QUESTS[id],n=questStep(id);items.push({l:(q.main?'★ ':'')+q.t.slice(0,16),r:`${n}/${q.steps.length}`,f:()=>{
    say(`${q.t}\n${q.d}`);say(q.steps.map((s,i)=>(i<n?'[x] ':'[ ] ')+s.t).join('\n'));}});}

const TRN={on:0,k:0,rep:0,hits:0,spd:.05,dir:1,zone:[.42,.58],msg:'',t:0,done:0};
function trainStart(){
  const w=WS(),key=G.map+'_'+w.day;
  if(w.train[key]){say('You already trained here today. Muscles need rest. Also the bench is sweaty.');return;}
  w.train[key]=1;
  Object.assign(TRN,{on:1,k:.1,rep:0,hits:0,spd:.045,dir:1,msg:'PRESS A IN THE GOLD ZONE',t:0,done:0});

function trainUpdate(){
  TRN.t++;
  if(TRN.done){if(Pr.a||Pr.b){Pr.a=Pr.b=0;G.mode='world';trainFinish();}return;}
  TRN.k+=TRN.spd*TRN.dir;if(TRN.k>1){TRN.k=1;TRN.dir=-1;}if(TRN.k<0){TRN.k=0;TRN.dir=1;}
  if(Pr.a){Pr.a=0;const hit=TRN.k>=TRN.zone[0]&&TRN.k<=TRN.zone[1];TRN.rep++;
    if(hit){TRN.hits++;sfx.ok();TRN.msg=pick(['CLEAN!','GOOD REP!','LIGHT WEIGHT!','YEAH BUDDY!']);}else{sfx.bump();TRN.msg=pick(['SLOPPY','TOO EARLY','FORM!']);}
    TRN.spd+=.012;const zw=Math.max(.08,.16-TRN.rep*.015);const c=.3+Math.random()*.4;TRN.zone=[c-zw/2,c+zw/2];
    if(TRN.rep>=6){TRN.done=1;TRN.msg=`${TRN.hits}/6 CLEAN REPS — press A`;}}
  if(Pr.b){Pr.b=0;TRN.done=1;TRN.msg=`${TRN.hits}/6 — press A`;}
}
function trainFinish(){
  const w=WS(),b=G.gang.find(m=>m.s==='bandit')||G.gang[0],sc=TRN.hits;
  w.stats.train++;const xp=Math.max(4,b.l*5*sc);b.xp+=xp;
  let msg=`Training done. ${sc}/6 clean reps. +${xp} XP.`;
  if(sc>=4){pl().pts++;msg+=' +1 STAT POINT!';}
  if(sc>=6){const k=pick(['str','end','chn','agi','hnd']);pl().s[k]++;restat();msg+=' PERFECT! +1 '+k.toUpperCase()+'!';}
  if(typeof plCount==='function')plCount('hit',sc);
  sfx.level();say(msg);
  while(b.xp>=xpNeed(b.l)&&b.l<100){b.xp-=xpNeed(b.l);const oh=b.mhp;b.l++;mstat(b);b.hp+=b.mhp-oh;sfx.level();say(`${b.nm} grew to level ${b.l}!`);if(typeof plLevelUp==='function')plLevelUp(b);}
}

/* enemy archetype patterns: MUSCLE sets up then unloads, SNEAK softens you first, CHARM hypes then pops */
function patternBias(e,d,p){
  const t=SP[e.s].t,ep=B.ep,last=ep.last?M[ep.last]:null;
  let s=0;
  if(t==='MUS'){if(last&&last.p>=85&&d.p>=85)s-=2.5;if(last&&!last.p&&d.p>=85)s+=2.5;if(e.sta<30&&d.p>=85)s-=3;}
  else if(t==='SNK'){if(!p.st&&(d.fx==='bleed'||d.fx==='accdown'||d.fx==='stun'))s+=1.5;if((p.stn>0||p.sg.acc<0)&&d.p>=80)s+=2.5;}
  else if(t==='CHM'){if(e.sg.atk<1&&d.fx==='atkup')s+=2;if(e.sg.atk>=1&&d.p>=70)s+=2.5;}
  if(e._rage&&d.p>=85)s+=2;
  if(B.guard&&d.p>=70)s-=1.5;      // smart ones mix it up when you cover
  return s;
}

const TRAIL=[];
function trailPush(){const last=TRAIL[0];if(!last||last.x!==G.x||last.y!==G.y||last.map!==G.map){TRAIL.unshift({x:G.x,y:G.y,map:G.map,dir:G.dir});if(TRAIL.length>8)TRAIL.length=8;}}
function followers(){if(!G.crew||G.gang.length<2)return [];return G.gang.slice(1,3);}
function drawFollowers(tt){
  const fs=followers();if(!fs.length)return;
  const moving=Wd.mv>0;
  fs.forEach((m,i)=>{
    const t=TRAIL.filter(p=>p.map===G.map)[i+1];if(!t)return;
    const L=LOOK[m.s]||LOOK.rookie;
    // ease toward the trail spot
    m._fx=m._fx===undefined?t.x:m._fx+(t.x-m._fx)*.22;m._fy=m._fy===undefined?t.y:m._fy+(t.y-m._fy)*.22;
    const mv=Math.abs(m._fx-t.x)+Math.abs(m._fy-t.y)>.03||moving;
    m._ph=(m._ph||0)+(mv?.38:0);
    drawRig(L,m._fx+.5,0,m._fy+.5,YAW[t.dir],mv?poseWalk(m._ph,1.05):{bob:Math.sin(tt*2+i)*.015,armL:[0,0],armR:[0,0]},{scale:1,lod:0});
  });
}

function patrolTick(){
  if(Say.on||Menus.length||Cs.g||busy())return;
  const m=cur();
  for(const n of m.npcs){
    if(!n.pat||n.rt)continue;
    n._pt=(n._pt||0)+1;if(n._pt%14)continue;
    const p=n.pat,ax=p.axis;
    let nx=n.x,ny=n.y;if(ax==='x')nx+=p.d;else ny+=p.d;
    const off=ax==='x'?nx-p.x0:ny-p.y0;
    if(off<0||off>p.len||!freeTileW(nx,ny,n)){p.d*=-1;n.dir=ax==='x'?(p.d>0?3:2):(p.d>0?0:1);continue;}
    n.dir=ax==='x'?(p.d>0?3:2):(p.d>0?0:1);n.px=n.x*T;n.py=n.y*T;n.x=nx;n.y=ny;n.rt={d:n.dir,k:0};
    // sees you?
    for(let k=1;k<=4;k++){const sx=n.x+DX[n.dir]*k,sy=n.y+DY[n.dir]*k;if(SOLID.has(tileAt(m,sx,sy)))break;
      if(sx===G.x&&sy===G.y){guardSpots(n);break;}}
  }
}

}

  if(Fx.shake>0&&G.mode!=='battle')g.translate(ri(-2,2),ri(-1,1));
  fxUpdate();
  switch(G.mode){
    case 'title':titleUpdate();break;
    case 'intro':introUpdate();break;
    case 'world':worldUpdate();break;
    case 'battle':if(Say.on)Say.update();else if(Menus.length)menuUpdate();else Co.update();break;
    case 'end':endUpdate();break;
    case 'name':nameUpdate();break;
    case 'train':trainUpdate();break;
    case 'mapview':mapUpdate();break;
  }
  switch(G.mode){
    case 'title':titleDraw();break;
    case 'intro':introDraw();break;
    case 'world':worldDraw();break;
    case 'battle':battle3Draw();break;
    case 'end':endDraw();break;
    case 'name':nameDraw();break;
    case 'train':trainDraw();break;
    case 'mapview':mapDraw();break;
  }
  Say.draw();menuDraw();fxDraw();
  for(const k in Pr)Pr[k]=0;
}
let last=0,acc=0;
function showErr(e){const p=document.getElementById('err');if(p&&p.textContent.length<1500){p.style.display='block';p.textContent+=(e&&e.stack?e.stack.split('\n').slice(0,3).join(' | '):e)+'\n';}}
function raf(t){
  const dt=Math.min(100,t-last||16);last=t;acc+=dt;
  let n=0;while(acc>=16.67&&n<4){try{frame();}catch(e){showErr(e);}acc-=16.67;n++;}
  if(n===4)acc=0;
  requestAnimationFrame(raf);
}
function boot(){
  if(boot.done)return;boot.done=1;
  try{if(glInit())R3.atlas=glTex(smoothAtlas(),false);}catch(e){showErr(e);}
  try{resize();openTitle();}catch(e){showErr(e);}
  requestAnimationFrame(raf);
}
(function(){
  let ok=false;
  try{document.fonts.load('8px "Press Start 2P"').then(()=>{boot();}).catch(boot);}catch(e){boot();}
  setTimeout(boot,1800);
})();
</script>
