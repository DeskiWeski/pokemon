<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07050a">
<title>Regal Bandit Lockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout concept: full-bleed game screen, thumb controls floating below (portrait) or beside (landscape). Single dark look by choice. */
:root{--bg:#07050a;--fg:#f5e9d8;--key:rgba(30,24,40,.78);--key-hi:rgba(255,255,255,.18);--btn:rgba(138,47,124,.82);--line:rgba(255,255,255,.22);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background-color:var(--bg);color:var(--fg);overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;font:12px/1.3 ui-monospace,Menlo,monospace}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;background-image:radial-gradient(ellipse at 50% 15%,#2a1830 0%,transparent 70%)}
#screen{display:block;width:min(100vw,calc((100dvh - 240px)*1.1111));max-width:100vw;height:auto;aspect-ratio:240/216;image-rendering:pixelated;touch-action:none;margin-top:env(safe-area-inset-top,0px);box-shadow:0 0 0 1px #000,0 0 30px #000a}
.ctl{position:absolute;touch-action:none}
.dp{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.dpad{position:relative;width:min(40vw,168px);height:min(40vw,168px);touch-action:none}
.dpad:before,.dpad:after{content:"";position:absolute;background:var(--key);border-radius:12px;box-shadow:inset 0 2px 0 var(--key-hi),0 0 0 1px var(--line)}
.dpad:before{left:0;right:0;top:33%;bottom:33%}
.dpad:after{top:0;bottom:0;left:33%;right:33%}
.dpad .hub{position:absolute;left:33%;top:33%;width:34%;height:34%;z-index:2;border-radius:50%;background:radial-gradient(circle,#0e0b14 35%,transparent 36%)}
.dpad i{position:absolute;z-index:3;width:0;height:0;border:9px solid transparent;pointer-events:none;opacity:.7}
.dpad .u{left:calc(50% - 9px);top:8%;border-bottom-color:#ccc}.dpad .d{left:calc(50% - 9px);bottom:8%;border-top-color:#ccc}
.dpad .l{top:calc(50% - 9px);left:8%;border-right-color:#ccc}.dpad .r{top:calc(50% - 9px);right:8%;border-left-color:#ccc}
.dpad.on:before,.dpad.on:after{filter:brightness(1.6)}
.ab{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(46vw,190px);height:min(30vw,126px)}
.btn{position:absolute;width:min(22vw,88px);height:min(22vw,88px);border-radius:50%;border:0;padding:0;background:var(--btn);box-shadow:inset 0 3px 0 var(--key-hi),0 0 0 2px var(--line);color:#fff;font:800 20px/1 "Press Start 2P",Impact,sans-serif;touch-action:none}
.btn.b{left:0;bottom:0}.btn.a{right:0;top:0}
.btn.on,.pill.on{filter:brightness(1.7);transform:scale(.95)}
.mid{left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:22px}
.pill{border:0;padding:10px 18px;border-radius:20px;background:var(--key);color:#d8cce8;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:1px;box-shadow:inset 0 1px 0 var(--key-hi),0 0 0 1px var(--line);touch-action:none}
@media (orientation:landscape){
  #screen{width:min(calc(100vw - 2px),calc(100dvh*1.1111));margin-top:0}
  .dp{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .ab{bottom:calc(26px + env(safe-area-inset-bottom,0px))}
  .dpad{width:min(34dvh,150px);height:min(34dvh,150px)}
  .btn{width:min(20dvh,80px);height:min(20dvh,80px)}
  .ab{width:min(40dvh,170px);height:min(28dvh,116px)}
  .mid{left:auto;right:auto;bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);opacity:.55}
  .dpad,.ab,.pill{opacity:.8}
}
</style>
<main class="stage" id="stage">
<canvas id="screen" width="480" height="432" aria-label="Game screen"></canvas>
<div class="ctl dp"><div class="dpad" id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><div class="hub"></div></div></div>
<div class="ctl ab"><button class="btn b" data-k="b" aria-label="B">B</button><button class="btn a" data-k="a" aria-label="A">A</button></div>
<div class="ctl mid"><button class="pill" data-k="select" aria-label="Select">SELECT</button><button class="pill" data-k="start" aria-label="Start">START</button></div>
</main>
<pre id="err" style="display:none;position:fixed;left:0;right:0;top:0;z-index:99;margin:0;padding:8px;background:#600;color:#fff;font:11px/1.3 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto"></pre>
<script>
window.addEventListener("error",function(e){var p=document.getElementById("err");if(p){p.style.display="block";p.textContent+=(e.message||"error")+" @"+(e.lineno||"?")+"\n";}});
window.addEventListener("unhandledrejection",function(e){var p=document.getElementById("err");if(p){p.style.display="block";p.textContent+="promise: "+(e.reason&&e.reason.message||e.reason)+"\n";}});
</script>
<script>
'use strict';
/* ===== CORE: canvas, input, audio, text, menus, fx ===== */
const W=240,H=216,T=16;
const cv=document.getElementById('screen');
let g=cv.getContext('2d'),S=2;
const FONT='8px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace';
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function resize(){
  const w=cv.clientWidth||240,dpr=Math.min(window.devicePixelRatio||1,3);
  S=Math.max(2,Math.round(w*dpr/W));cv.width=W*S;cv.height=H*S;
  g=cv.getContext('2d');g.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);

/* ---- input ---- */
const K={up:0,down:0,left:0,right:0,a:0,b:0,start:0,select:0},Pr={};
function setKey(k,v){v=v?1:0;if(v&&!K[k]){Pr[k]=1;try{ac();}catch(e){}}K[k]=v;}
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'a',KeyJ:'a',Space:'a',KeyX:'b',KeyK:'b',Enter:'start',ShiftLeft:'select',ShiftRight:'select',Backspace:'select'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){setKey(k,1);e.preventDefault();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){setKey(k,0);e.preventDefault();}});
function releaseAll(){for(const k in K)setKey(k,0);document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  if(!window.PointerEvent){el.addEventListener('touchstart',e=>{e.preventDefault();setKey(k,1);el.classList.add('on');},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();setKey(k,0);el.classList.remove('on');},{passive:false});el.addEventListener('mousedown',()=>setKey(k,1));el.addEventListener('mouseup',()=>setKey(k,0));return;}
  const dn=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}setKey(k,1);el.classList.add('on');};
  const up=e=>{e.preventDefault();setKey(k,0);el.classList.remove('on');};
  el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',e=>{if(!e.buttons&&e.pointerType==='mouse')up(e);});
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const dpEl=document.getElementById('dpad');
function dpSet(e){
  const r=dpEl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  const ax=Math.abs(x),ay=Math.abs(y),on=Math.hypot(x,y)>.1;
  setKey('left',on&&x<0&&ax>=ay*.8);setKey('right',on&&x>0&&ax>=ay*.8);
  setKey('up',on&&y<0&&ay>ax*.8);setKey('down',on&&y>0&&ay>ax*.8);
  dpEl.classList.add('on');
}
function dpEnd(e){e.preventDefault();['up','down','left','right'].forEach(k=>setKey(k,0));dpEl.classList.remove('on');}
dpEl.addEventListener('pointerdown',e=>{e.preventDefault();try{dpEl.setPointerCapture(e.pointerId);}catch(_){}dpSet(e);});
dpEl.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')dpSet(e);});
dpEl.addEventListener('pointerup',dpEnd);dpEl.addEventListener('pointercancel',dpEnd);
dpEl.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---- audio ---- */
let AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function beep(f,d=.08,type='square',v=.04,slide=0,t0=0){
  if(muted)return;const a=AC;if(!a)return;
  try{
    const t=a.currentTime+t0,o=a.createOscillator(),gn=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function seq(fs,step=.08,type='square',v=.04){fs.forEach((f,i)=>f&&beep(f,step*1.2,type,v,0,i*step));}
const sfx={
  blip(){beep(700,.04,'square',.03);},tick(){beep(1200,.015,'square',.012);},
  ok(){seq([880,1175],.06);},bump(){beep(110,.07,'square',.05);},
  hit(){beep(220,.14,'sawtooth',.06,-160);},crit(){beep(300,.2,'sawtooth',.07,-250);seq([0,1400,1000],.05);},
  miss(){beep(500,.12,'triangle',.04,-300);},heal(){seq([523,659,784,1047],.07);},
  pick(){seq([988,1319],.07);},door(){seq([330,247,196],.07,'triangle',.06);},
  win(){seq([523,659,784,0,659,784,1047],.1);},lose(){seq([392,349,311,262],.2,'triangle',.06);},
  siren(){seq([880,660,880,660],.18,'sawtooth',.03);},slam(){beep(90,.25,'sawtooth',.08,-40);},
  level(){seq([523,659,784,1047,1319],.07);},bottle(){beep(900,.3,'triangle',.04,-600);},
  ow(){seq([300,220,160],.09,'sawtooth',.06);},caught(){seq([784,988,1175,1568],.09);},
  step(){beep(90,.03,'triangle',.03);}
};
const SONGS={
  title:{t:190,l:[12,null,15,null,19,17,15,null,12,null,10,null,12,15,17,null],b:[0,null,0,null,-2,null,-2,null,0,null,0,null,-5,null,-4,null]},
  jail:{t:240,l:[0,null,null,3,null,null,5,null,3,null,null,0,null,-2,null,null],b:[0,null,0,0,null,0,3,null]},
  yard:{t:200,l:[7,null,12,null,10,null,7,null,5,7,null,3,null,5,null,null],b:[0,null,5,null,3,null,5,null]},
  battle:{t:120,l:[12,12,null,15,12,null,17,null,15,12,null,10,12,null,null,null],b:[0,0,null,0,3,3,null,3,5,5,null,5,3,3,null,null]},
  boss:{t:100,l:[12,null,12,13,12,null,15,null,12,null,12,10,12,null,8,null],b:[0,0,3,0,0,0,5,0,0,0,3,0,-2,-2,0,0]},
  calm:{t:300,l:[7,null,null,null,5,null,null,null,3,null,null,null,5,null,null,null],b:[0,null,null,null,-2,null,null,null]}
};
let song=null,sstep=0;
function playSong(n){if(song!==n){song=n;sstep=0;}}
(function mus(){
  const s=SONGS[song];
  if(s&&!muted&&AC){
    const i=sstep++,m=s.l[i%s.l.length],b=s.b[i%s.b.length];
    if(m!=null)beep(220*Math.pow(2,m/12),s.t/1000*.85,'square',.014);
    if(b!=null)beep(110*Math.pow(2,b/12),s.t/1000*1.3,'triangle',.035);
  }
  setTimeout(mus,s?s.t:200);
})();

/* ---- text + panels ---- */
function tx(s,x,y,c='#fff',al='left',sh='#000'){
  g.font=FONT;g.textBaseline='top';g.textAlign=al;
  if(sh){g.fillStyle=sh;g.fillText(s,x+1,y+1);}
  g.fillStyle=c;g.fillText(s,x,y);
}
function wrap(s,maxW){
  g.font=FONT;const out=[];
  for(const para of String(s).split('\n')){
    let line='';
    for(const w of para.split(' ')){
      const t=line?line+' '+w:w;
      if(g.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;
    }
    out.push(line);
  }
  return out;
}
function panel(x,y,w,h,fill='#1a1022',bd='#f3a65a'){
  g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle=bd;g.fillRect(x,y,w,h);
  g.fillStyle='#5a2d12';g.fillRect(x+1,y+1,w-2,h-2);
  g.fillStyle=fill;g.fillRect(x+2,y+2,w-4,h-4);
  g.fillStyle='#ffffff10';g.fillRect(x+2,y+2,w-4,2);
}
function bar(x,y,w,p,h=4){
  p=clamp(p,0,1);
  g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle='#3a3340';g.fillRect(x,y,w,h);
  g.fillStyle=p>.5?'#4fd16a':p>.2?'#f2c230':'#e8452e';g.fillRect(x,y,Math.round(w*p),h);
  g.fillStyle='#ffffff44';g.fillRect(x,y,Math.round(w*p),1);
}

/* ---- message box (typewriter) ---- */
const Say={
  q:[],cur:null,n:0,hold:0,lines:[],
  add(t,cb,o){
    const L=wrap(t,212);
    if(L.length<=3){this.q.push({t:L.join('\n'),L,cb,o:o||{}});return;}
    for(let i=0;i<L.length;i+=3){
      const part=L.slice(i,i+3);
      this.q.push({t:part.join('\n'),L:part,cb:i+3>=L.length?cb:null,o:o||{}});
    }
  },
  get on(){return !!(this.cur||this.q.length);},
  clear(){this.q=[];this.cur=null;},
  update(){
    if(!this.cur){
      if(!this.q.length)return;
      this.cur=this.q.shift();this.n=0;this.hold=0;this.full=this.cur.L.join('').length;
    }
    const c=this.cur;
    if(this.n<this.full){
      if(Pr.a||Pr.b){this.n=this.full;Pr.a=Pr.b=0;return;}
      this.n+=(K.a||K.b)?3:1;if(this.n%4===0)sfx.tick();return;
    }
    this.hold++;
    const auto=c.o.auto;
    if(Pr.a||Pr.b||(auto&&this.hold>auto)){
      Pr.a=Pr.b=0;this.cur=null;sfx.blip();if(c.cb)c.cb();
    }
  },
  draw(){
    if(!this.cur)return;
    const c=this.cur;panel(4,H-58,232,54);
    let left=this.n;
    c.L.forEach((ln,i)=>{
      if(left<=0)return;
      tx(ln.slice(0,left),12,H-50+i*13,'#fff');left-=ln.length;
    });
    if(this.n>=this.full&&!c.o.auto&&((Date.now()/300)|0)%2)tx('▼',222,H-17,'#f3a65a');
  }
};
const say=(t,cb,o)=>Say.add(t,cb,o);

/* ---- menus ---- */
const Menus=[];
function openMenu(m){m.cur=m.cur||0;m.top=0;Menus.push(m);sfx.blip();return m;}
function menuUpdate(){
  const m=Menus[Menus.length-1];if(!m)return false;
  const n=m.items.length,cols=m.cols||1;
  if(Pr.up){m.cur=cols>1?(m.cur-cols+n)%n:(m.cur+n-1)%n;sfx.blip();}
  if(Pr.down){m.cur=cols>1?(m.cur+cols)%n:(m.cur+1)%n;sfx.blip();}
  if(cols>1){if(Pr.left){m.cur=(m.cur+n-1)%n;sfx.blip();}if(Pr.right){m.cur=(m.cur+1)%n;sfx.blip();}}
  if(m.onMove)m.onMove(m.cur);
  if(Pr.a){
    const it=m.items[m.cur];Pr.a=0;
    if(!it||it.d){sfx.bump();}
    else{sfx.ok();if(!m.stay)Menus.pop();if(it.f)it.f();}
  }else if(Pr.b){
    Pr.b=0;
    if(m.nocancel){sfx.bump();}
    else if(m.cancel){sfx.blip();Menus.pop();m.cancel();}
    else{sfx.blip();Menus.pop();}
  }
  return true;
}
function menuDraw(){
  Menus.forEach(m=>{
    const rh=m.rh||11,cols=m.cols||1,vis=m.vis||m.items.length,n=m.items.length;
    const rows=Math.ceil(Math.min(vis,n)/cols),hdr=m.title?12:0;
    const h=rows*rh+8+hdr;
    panel(m.x,m.y,m.w,h);
    const ttl=typeof m.title==='function'?m.title():m.title;
    if(ttl)tx(ttl,m.x+6,m.y+5,'#f3a65a');
    const rowCur=Math.floor(m.cur/cols);
    if(rowCur<m.top)m.top=rowCur;
    if(rowCur>=m.top+rows)m.top=rowCur-rows+1;
    for(let i=0;i<rows*cols;i++){
      const idx=m.top*cols+i;if(idx>=n)break;
      const it=m.items[idx],r=Math.floor(i/cols),c=i%cols,cw=(m.w-10)/cols;
      const x=m.x+6+c*cw,y=m.y+4+hdr+r*rh+1;
      const col=it.d?'#7a6e86':'#fff';
      if(idx===m.cur)tx('▶',x-1,y,'#f3a65a');
      tx(it.l,x+8,y,col);
      if(it.r)tx(it.r,x+cw-6,y,it.d?'#7a6e86':'#f3c27a','right');
    }
    if(m.top>0)tx('▲',m.x+m.w-12,m.y+3,'#f3a65a');
    if(m.top+rows<Math.ceil(n/cols))tx('▼',m.x+m.w-12,m.y+h-10,'#f3a65a');
  });
}
function ask(text,yes,no){
  say(text,()=>{
    openMenu({x:164,y:H-96,w:68,items:[{l:'YES',f:yes},{l:'NO',f:no||(()=>{})}],cancel:no||(()=>{})});
  });
}

/* ---- fx ---- */
const Fx={fade:0,st:0,cb:null,shake:0,flash:0,flashCol:'#fff'};
function fadeTo(cb){Fx.st=1;Fx.cb=cb;}
function fxUpdate(){
  if(Fx.st===1){Fx.fade+=.1;if(Fx.fade>=1){Fx.fade=1;Fx.st=2;const f=Fx.cb;Fx.cb=null;if(f)f();}}
  else if(Fx.st===2){Fx.fade-=.1;if(Fx.fade<=0){Fx.fade=0;Fx.st=0;}}
  if(Fx.shake>0)Fx.shake--;
  if(Fx.flash>0)Fx.flash--;
}
function fxDraw(){
  if(Fx.fade>0){g.fillStyle=`rgba(0,0,0,${Fx.fade})`;g.fillRect(0,0,W,H);}
  if(Fx.flash>0){g.globalAlpha=Fx.flash/10;g.fillStyle=Fx.flashCol;g.fillRect(0,0,W,H);g.globalAlpha=1;}
}
const busy=()=>Fx.st!==0;

/* ---- tap the screen: select menu items, advance text ---- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();ac();
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
  const m=Menus[Menus.length-1];
  if(Say.on&&!m){Pr.a=1;return;}
  if(m){
    const rh=m.rh||11,cols=m.cols||1,vis=m.vis||m.items.length,n=m.items.length,rows=Math.ceil(Math.min(vis,n)/cols);
    const hdr=((typeof m.title==='function'?m.title():m.title)?12:0),h=rows*rh+8+hdr,cw=(m.w-10)/cols;
    if(px>=m.x&&px<=m.x+m.w&&py>=m.y&&py<=m.y+h){
      const c=Math.min(cols-1,Math.max(0,Math.floor((px-m.x-6)/cw))),rr=Math.floor((py-m.y-4-hdr)/rh);
      const idx=(m.top+rr)*cols+c;
      if(rr>=0&&rr<rows&&idx>=0&&idx<n){m.cur=idx;Pr.a=1;}
    }else if(!m.nocancel)Pr.b=1;
  }
});

function person(c,x0,y0,L,dir,fr,s){

  else{r(5,12+lf,3,3-lf,pn);r(8,12+rf,3,3-rf,pn);r(5,14,3,1,'#1d1a22');r(8,14,3,1,'#1d1a22');}

  if(side){
    r(5-w,8,6+w*2,5,sh);r(5-w,8,6+w*2,1,'#ffffff22');r(5-w,12,6+w*2,1,'#0003');

  if(side){

    if(st==='beanie'){r(4,0,7,3,L.hc||'#333');r(4,3,7,1,'#555');}
    if(st==='bandana'){r(4,1,7,2,L.hc||'#d22');r(10,2,2,2,L.hc||'#d22');}
    if(ac.includes('cig')){r(2,6,3,1,'#f4f4f0');r(1,6,1,1,'#ff6a1a');}
    if(ac.includes('scar'))r(6,2,1,3,'#b55');
  }else{
    r(4,1,8,7,sk);r(3,4,1,2,sk);r(12,4,1,2,sk);
    if(dir===0){
      r(6,4,1,2,'#111');r(9,4,1,2,'#111');r(7,6,2,1,'#8a3a2a');

const Co={g:null,wait:0,cond:null,
  run(gen){this.g=gen;this.wait=0;this.cond=null;},
  update(){
    if(!this.g)return;
    if(this.wait>0){this.wait--;return;}
    if(this.cond){if(!this.cond())return;this.cond=null;}
    const gen=this.g,r=gen.next();
    if(r.done){if(this.g===gen)this.g=null;return;}
    const v=r.value;
    if(typeof v==='number')this.wait=v;else if(typeof v==='function')this.cond=v;
  }
};

/* ---- turn resolution ---- */
function enemyMove(){
  const e=B.em,p=B.pm;
  const opts=e.moves.map((mv,i)=>({mv,i})).filter(o=>o.mv.pp>0);
  if(!opts.length)return -1;
  const smart=B.boss||(B.trainer&&Math.random()<.6);
  const sc=opts.map(o=>{
    const d=M[o.mv.id];let s=1+Math.random()*(smart?.6:2.4);
    if(d.p){s+=d.p/20*typeMult(d.t,SP[p.s].t)*(SP[e.s].t===d.t?1.25:1);}
    else if(d.fx==='heal'){s+=e.hp<e.mhp*.4?5:-3;}
    else if(d.fx==='atkdown'){s+=p.sg.atk>-1?2.5:-2;}
    else if(d.fx==='defup'||d.fx==='atkup'||d.fx==='high'||d.fx==='drunkup'){s+=e.sg.atk<1&&e.sg.def<1?2:-2;}
    else if(d.fx==='accdown'){s+=p.sg.acc>-1?2:-2;}
    if(d.fx==='stunbonus'&&p.stn>0)s+=4;
    return s;
  });
  let bi=0;sc.forEach((s,i)=>{if(s>sc[bi])bi=s>sc[bi]?i:bi;});
  return opts[bi].i;
}
function* resolveTurn(pc){
  let r=null;
  if(pc.t==='run'){
    const ch=clamp(.5+(B.pm.spd-B.em.spd)*.02,.25,.95);
    if(Math.random()<ch){yield* talk('Got away safely!');return 'run';}
    yield* talk("Can't get away!");
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='deal'){
    const res=yield* tryDeal(pc);
    if(res==='recruit')return 'recruit';
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='switch'){
    const old=B.pm;
    yield* talk(`Come back, ${old.nm}!`,20);
    B.pm=G.gang[pc.i];B.part.add(B.pm);B.off.p.a=1;sfx.ok();
    yield* talk(`Go! ${B.pm.nm}!`,20);
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='item'){
    G.items[pc.id]--;
    yield* applyItem(pc.id,G.gang[pc.i],true);
    r=yield* enemyTurn();return r||'continue';
  }
  // move
  const pi=pc.i,ei=enemyMove();
  const pmv=pi>=0?B.pm.moves[pi]:{id:'struggle',pp:1},emv=ei>=0?B.em.moves[ei]:{id:'struggle',pp:1};
  const pp=(M[pmv.id].pri||0),ep=(M[emv.id].pri||0);
  let pFirst=pp!==ep?pp>ep:(B.pm.spd!==B.em.spd?B.pm.spd>B.em.spd:Math.random()<.5);
  const order=pFirst?[['p',pmv],['e',emv]]:[['e',emv],['p',pmv]];
  for(const [s,mv] of order){
    const att=s==='p'?B.pm:B.em;
    if(!alive(att))continue;
    if(s==='e'&&!alive(B.pm))continue;
    yield* execMove(s,mv);
    r=yield* checkFaints();
    if(r)return r;
  }
  r=yield* endTurn();
  return r||'continue';
}
function* enemyTurn(){
  const ei=enemyMove();
  const mv=ei>=0?B.em.moves[ei]:{id:'struggle',pp:1};
  yield* execMove('e',mv);
  let r=yield* checkFaints();if(r)return r;
  return yield* endTurn();
}
function* endTurn(){
  for(const s of ['p','e']){
    const m=s==='p'?B.pm:B.em;
    if(!alive(m))continue;
    if(m.st==='bleed'){
      yield* hurt(s,Math.max(1,Math.floor(m.mhp/8)));sfx.hit();
      yield* talk(`${m.nm} is bleeding!`,24);
    }else if(m.st==='high'&&m.hp<m.mhp){
      m.hp=Math.min(m.mhp,m.hp+Math.max(1,Math.floor(m.mhp/16)));yield* talk(`${m.nm} is feeling nice and mellow.`,24);
    }
    if(m.shk>0)m.shk--;
  }
  return yield* checkFaints();
}
function* hurt(s,n){
  const m=s==='p'?B.pm:B.em;m.hp=Math.max(0,m.hp-n);
  B.off[s].fl=5;for(let i=0;i<10;i++){B.off[s].x=(i%2?3:-3);yield 1;}B.off[s].x=0;
}
function* lunge(s){
  const d=s==='p'?1:-1;
  for(let i=0;i<5;i++){B.off[s].x=d*i*3;B.off[s].y=-d*i*1.5;yield 1;}
  for(let i=5;i>=0;i--){B.off[s].x=d*i*3;B.off[s].y=-d*i*1.5;yield 1;}
  B.off[s].x=0;B.off[s].y=0;
}
function* setStatus(m,st,msg){
  if(m.st){yield* talk('It did not work. '+m.nm+' is already messed up.',26);return false;}
  m.st=st;yield* talk(msg,30);return true;
}
function* execMove(s,mvslot){
  const att=s==='p'?B.pm:B.em,def=s==='p'?B.em:B.pm,ds=s==='p'?'e':'p';
  const d=M[mvslot.id];
  if(att.stn>0){att.stn--;yield* talk(`${att.nm} is too dizzy to move!`,30);return;}
  if(att.st==='drunk'&&Math.random()<.25){sfx.miss();yield* talk(`${att.nm} stumbles around drunk!`,30);return;}
  if(mvslot.id!=='struggle')mvslot.pp=Math.max(0,mvslot.pp-1);
  if(d.fx==='lukey')yield* talk(`${att.nm} yells "I'LL GIVE YOU LUKEY!!"`,40);
  else yield* talk(`${att.nm} used ${d.n}!`,28);
  // accuracy
  let acc=d.a*accMul(att.sg.acc);
  if(!d.self&&Math.random()*100>acc){sfx.miss();yield* talk('But it missed!',26);return;}
  // bottle fumble
  if(d.fx==='bottle'&&Math.random()<.22){yield* bottleFumble(s,att);return;}
  if(d.fx==='bottle')yield* bottleThrow(s);
  if(d.p){
    yield* lunge(s);
    const crit=Math.random()<((d.crit||att.shk>0)?.25:.0625);
    let bonus=att.shk>0?1.3:1;
    if(d.fx==='stunbonus'&&def.stn>0)bonus*=2;
    if(d.fx==='lukey')bonus*=1;
    const A=att.atk*stageMul(att.sg.atk),D=def.def*stageMul(def.sg.def);
    const tm=typeMult(d.t,SP[def.s].t),stab=SP[att.s].t===d.t?1.25:1;
    let dmg=Math.floor(((2*att.l/5+2)*d.p*A/D)/50)+2;
    dmg=Math.max(1,Math.floor(dmg*tm*stab*(crit?1.6:1)*(.85+Math.random()*.15)*bonus));
    dmg=Math.min(dmg,def.hp);
    crit?sfx.crit():sfx.hit();
    if(d.fx==='lukey'){Fx.shake=16;Fx.flashCol='#4aa0ff';Fx.flash=8;}
    yield* hurt(ds,dmg);
    if(crit)yield* talk('A critical hit!',22);
    if(tm>1)yield* talk("It's super effective!",24);else if(tm<1)yield* talk("It's not very effective...",24);
    if(d.fx==='recoil'){const rc=Math.max(1,Math.floor(dmg/4));yield* hurt(s,rc);yield* talk(`${att.nm} hurt itself in the process!`,24);}
    if(alive(def)){
      if(d.fx==='stun'&&Math.random()*100<(d.c||20)){def.stn=1;B.dizzy[ds]=90;yield* talk(`${def.nm} is stunned!`,24);}
      if(d.fx==='lukey'){def.stn=1;B.dizzy[ds]=90;yield* talk(`The cops swarm in! ${def.nm} is stunned!`,34);}
      if(d.fx==='defdown'&&Math.random()*100<(d.c||40)){def.sg.def=Math.max(-3,def.sg.def-1);yield* talk(`${def.nm}'s defense fell!`,24);}
      if(d.fx==='bleed'&&Math.random()*100<(d.c||30)&&!def.st){def.st='bleed';yield* talk(`${def.nm} is bleeding!`,26);}
      else if(att.shk>0&&Math.random()<.4&&!def.st){def.st='bleed';yield* talk(`${def.nm} is cut deep and bleeding!`,26);}
    }
    if(d.fx==='steal'&&Math.random()*100<(d.c||40)){
      const n=ri(1,3);
      if(s==='e'){const t=Math.min(n,G.items.cigs);if(t>0){G.items.cigs-=t;sfx.pick();yield* talk(`${att.nm} swiped ${t} L&M ${t>1?'packs':'pack'}!`,28);}}
      else{G.items.cigs+=n;sfx.pick();yield* talk(`${att.nm} swiped ${n} L&M ${n>1?'packs':'pack'}!`,28);}
    }
    return;
  }
  // status moves
  switch(d.fx){
    case 'atkdown':def.sg.atk=Math.max(-3,def.sg.atk-1);sfx.blip();yield* talk(`${def.nm}'s attack fell!`,26);break;
    case 'accdown':def.sg.acc=Math.max(-3,def.sg.acc-1);sfx.blip();yield* talk(`${def.nm}'s aim got worse!`,26);break;
    case 'defup':att.sg.def=Math.min(3,att.sg.def+1);sfx.heal();yield* talk(`${att.nm}'s defense rose!`,26);break;
    case 'atkup':att.sg.atk=Math.min(3,att.sg.atk+1);sfx.heal();yield* talk(`${att.nm}'s attack rose!`,26);break;
    case 'heal':{const h=Math.max(1,Math.floor(att.mhp*.4));att.hp=Math.min(att.mhp,att.hp+h);sfx.heal();yield* talk(`${att.nm} recovered health!`,26);break;}
    case 'drunkup':att.sg.atk=Math.min(3,att.sg.atk+2);if(!att.st)att.st='drunk';sfx.bottle();yield* talk(`${att.nm} chugs a beer. Attack way up, but wobbly!`,30);break;
    case 'high':att.sg.def=Math.min(3,att.sg.def+1);att.sg.acc=Math.max(-3,att.sg.acc-1);if(!att.st)att.st='high';sfx.heal();yield* talk(`${att.nm} takes a rip. Chill. Tougher, but the aim is off.`,32);break;
  }
}
function* bottleThrow(s){
  const fx=s==='p'?70:190,tx=s==='p'?190:70,fy=s==='p'?100:50,ty=s==='p'?50:100;
  sfx.bottle();
  for(let i=0;i<=16;i++){const k=i/16;B.proj={x:fx+(tx-fx)*k,y:fy+(ty-fy)*k-Math.sin(k*Math.PI)*24,r:k*12};yield 1;}
  B.proj=null;
}
function* bottleFumble(s,att){
  const sx=s==='p'?70:190,sy=s==='p'?100:50;
  sfx.bottle();
  for(let i=0;i<=14;i++){const k=i/14;B.proj={x:sx+(s==='p'?1:-1)*k*14,y:sy-k*36,r:k*10};yield 1;}
  yield* talk('...the bottle slips out of his hand!',26);
  for(let i=0;i<=10;i++){const k=i/10;B.proj={x:sx+(s==='p'?1:-1)*(14-k*14),y:sy-36+k*58,r:20+k*14};yield 1;}
  B.proj=null;
  sfx.ow();Fx.shake=18;Fx.flashCol='#ffd23a';Fx.flash=5;B.dizzy[s]=120;
  yield* talk('CLONK!! Right in the nuts!!!',44);
  const dmg=Math.max(2,Math.floor(att.mhp/6));
  yield* hurt(s,Math.min(dmg,att.hp));
  att.stn=1;
  yield* talk(`${att.nm} is curled up in agony!`,34);
}

/* ---- items, deals ---- */
function* applyItem(id,m,inBattle){
  const it=IT[id];
  if(id==='shank'){m.shk=3;sfx.pick();yield* talk(`${m.nm} grips the shank. Hits cut deeper for 3 turns!`,32);return;}
  if(id==='beer'){m.sg&&(m.sg.atk=Math.min(3,m.sg.atk+2));if(!m.st)m.st='drunk';m.hp=Math.min(m.mhp,m.hp+it.h);sfx.bottle();yield* talk(`${m.nm} chugs the warm prison beer. Hits harder, but wobbly!`,34);return;}
  if(id==='perogi'){
    const was=m.hp<=0;
    m.hp=was?Math.floor(m.mhp/2):m.mhp;if(!was)m.st=null;else m.st=null;
    sfx.heal();yield* talk(was?`${m.nm} sniffs a perogi and wakes up!`:`${m.nm} scarfs a perogi. Fully healed!`,32);return;
  }
  const amt=it.h;m.hp=Math.min(m.mhp,m.hp+amt);
  if(id==='weed'){m.sg&&(m.sg.def=Math.min(3,m.sg.def+1),m.sg.acc=Math.max(-3,m.sg.acc-1));if(!m.st)m.st='high';}
  if(id==='cigs')m.stn=0;
  sfx.heal();yield* talk(id==='weed'?`${m.nm} gets mellow. +${amt} HP, tougher but the aim is off.`:`${m.nm} smokes an L&M and calms down. +${amt} HP.`,32);
}
function* tryDeal(pc){
  const f=B.em;
  if(G.gang.length>=6){yield* talk('Your crew is full (6)! Release someone first.');return 'fail';}
  G.items[pc.id]--;
  yield* talk(`You offer ${f.nm} some ${IT[pc.id].n}...`,34);
  let ch=.12+(1-f.hp/f.mhp)*.5+pc.b+(f.st?.08:0)+(f.stn>0?.1:0)-Math.max(0,f.l-maxLevel())*.03;
  ch=clamp(ch,.05,.95);
  for(let i=0;i<3;i++){sfx.blip();B.off.e.y=-3;yield 8;B.off.e.y=0;yield 8;}
  if(Math.random()<ch){
    sfx.caught();
    const mon=f;mon.st=null;cleanMon(mon);mon.hp=Math.max(1,mon.hp);G.gang.push(mon);
    yield* talk(`${f.nm} the ${SP[f.s].n} joins your crew!`,50);
    B.recruited=mon;return 'recruit';
  }
  sfx.miss();
  yield* talk(ch>.5?`${f.nm} almost took it...`:`${f.nm} laughs. "Not enough."`,34);
  return 'fail';
}

/* ---- faint, xp ---- */
function* checkFaints(){
  if(!alive(B.em)){
    sfx.hit();for(let i=0;i<14;i++){B.off.e.y+=3;B.off.e.a=1-i/14;yield 1;}B.off.e.a=0;
    yield* talk(`${B.em.nm} is down!`,30);
    yield* award();
    if(B.fi+1<B.foes.length){
      B.fi++;B.em=B.foes[B.fi];B.off.e={x:0,y:0,a:1,fl:0,vx:90};
      for(let i=0;i<20;i++){B.off.e.vx=Math.max(0,B.off.e.vx-5);yield 1;}B.off.e.vx=0;
      yield* talk(`${B.o.name} sends out ${B.em.nm}!`,34);
    }else return 'win';
    return null;
  }
  if(!alive(B.pm)){
    sfx.hit();for(let i=0;i<14;i++){B.off.p.y+=3;B.off.p.a=1-i/14;yield 1;}B.off.p.a=0;
    yield* talk(`${B.pm.nm} is knocked out!`,30);
    if(!G.gang.some(alive))return 'lose';
    B.choice=null;openGang(true);yield()=>B.choice!==null;
    const c=B.choice;B.pm=G.gang[c.i];B.part.add(B.pm);B.off.p={x:0,y:0,a:1,fl:0,vx:0};sfx.ok();
    yield* talk(`Go! ${B.pm.nm}!`,22);
    return null;
  }
  return null;
}
function* award(){
  const base=Math.floor(B.em.l*(B.trainer?18:12)*(B.boss?1.5:1));
  const ups=[];
  for(const m of G.gang){
    if(!alive(m))continue;
    const g2=B.part.has(m)?base:Math.floor(base/2);
    m.xp+=g2;
    if(B.part.has(m))yield* talk(`${m.nm} gains ${g2} XP.`,24);
    while(m.xp>=xpNeed(m.l)&&m.l<40){
      m.xp-=xpNeed(m.l);const oh=m.mhp;m.l++;mstat(m);m.hp+=m.mhp-oh;
      sfx.level();yield* talk(`${m.nm} grew to level ${m.l}!`,34);
      for(const e of SP[m.s].ls)if(e[0]===m.l)yield* learnMove(m,e[1]);
    }
  }
}
function* learnMove(m,id){
  if(m.moves.some(x=>x.id===id))return;
  if(m.moves.length<4){m.moves.push({id,pp:M[id].pp});sfx.pick();yield* talk(`${m.nm} learned ${M[id].n}!`,34);return;}
  yield* talk(`${m.nm} wants to learn ${M[id].n}. Forget a move?`,50);
  let ch=null;
  const items=m.moves.map((x,i)=>({l:M[x.id].n,f:()=>{ch=i;}}));items.push({l:"Don't learn it",f:()=>{ch=-1;}});
  openMenu({x:4,y:50,w:232,items,title:'FORGET WHICH?',nocancel:true});
  yield()=>ch!==null;
  if(ch>=0){const old=M[m.moves[ch].id].n;m.moves[ch]={id,pp:M[id].pp};yield* talk(`${m.nm} forgot ${old} and learned ${M[id].n}!`,40);}
  else yield* talk(`${m.nm} did not learn ${M[id].n}.`,30);
}
function* finish(r){
  const o=B.o;
  B.res=r;
  if(r==='win'){
    sfx.win();
    if(B.trainer){
      yield* talk(`You defeated ${o.name}!`,36);
      if(o.tr.post)yield* talk(o.tr.post,40);
      const c=o.tr.win||0;if(c){G.items.cigs+=c;yield* talk(`${o.name} hands over ${c} L&M packs.`,34);}
      if(Math.random()<(B.boss?0:.4)){G.items.perogi++;sfx.pick();yield* talk('A perogi fell out of his pocket! Baba would be proud.',40);}
      if(o.boss){G.flags[o.boss]=1;sfx.level();yield* talk(`You earned ${PATCHNAME[o.boss]} PATCH! Rank: ${rank()}`,60);}
    }else{
      if(Math.random()<.3){const n=ri(1,2);G.items.cigs+=n;sfx.pick();yield* talk(`Found ${n} L&M ${n>1?'packs':'pack'} on him.`,32);}
      if(Math.random()<.15){G.items.perogi++;sfx.pick();yield* talk('Found a perogi! Lucky day.',32);}
    }
  }else if(r==='lose'){
    sfx.lose();
    if(o.tr&&o.tr.lose)yield* talk(o.tr.lose,40);
    yield* talk('You black out...',50);
  }
  for(let i=0;i<12;i++){Fx.fade=Math.min(1,i/12);yield 1;}
  Fx.fade=1;Fx.st=2;
  G.gang.forEach(cleanMon);
  const cb=B.o.done,res=r,mon=B.recruited;
  B=null;
  cb&&cb(res,mon);
}

/* ===== WORLD: movement, NPCs, interactions, menus ===== */
const Cs=Object.assign(Object.create(Co),{g:null,wait:0,cond:null});
const Wd={px:0,py:0,mv:0,dx:0,dy:0,fr:0,wk:0,lx:0,ly:0,banner:null,noEnc:0};
const cur=()=>MAPS[G.map];
const DX=[0,0,-1,1],DY=[1,-1,0,0];
const tileAt=(m,x,y)=>(x<0||y<0||x>=m.w||y>=m.h)?TL.WALL:m.t[y*m.w+x];
const npcsHere=()=>cur().npcs.filter(n=>!G.flags['gone_'+n.id]);
const npcAt=(x,y)=>npcsHere().find(n=>n.x===x&&n.y===y);
const defeated=n=>!!G.flags['d_'+n.id];
function enterMap(id,x,y,dir){
  G.map=id;G.x=x;G.y=y;G.dir=dir;Wd.px=x*T;Wd.py=y*T;Wd.mv=0;Wd.lx=x;Wd.ly=y;
  const m=cur();playSong(m.song);
  m.npcs.forEach(n=>{n.px=n.x*T;n.py=n.y*T;});
  Wd.banner={t:m.name,f:110};
}
function blocked(x,y){
  const m=cur(),t=tileAt(m,x,y);
  return SOLID.has(t)||!!npcAt(x,y);
}
function tryMove(d){
  G.dir=d;const nx=G.x+DX[d],ny=G.y+DY[d];
  if(blocked(nx,ny)){if(!Wd.bumped){sfx.bump();Wd.bumped=8;}return;}
  Wd.lx=G.x;Wd.ly=G.y;Wd.mv=T;Wd.dx=DX[d];Wd.dy=DY[d];
}
function stepMove(){
  const sp=K.b?4:2;
  Wd.px+=Wd.dx*sp;Wd.py+=Wd.dy*sp;Wd.mv-=sp;
  if(Wd.mv<=0){
    G.x+=Wd.dx;G.y+=Wd.dy;Wd.px=G.x*T;Wd.py=G.y*T;Wd.mv=0;
    G.steps++;Wd.wk^=1;Wd.fr=Wd.wk?1:2;
    if(G.steps%2===0)sfx.step();
    onStep();
  }
}
function onStep(){
  const m=cur();
  const w=m.warps.find(w=>w.x===G.x&&w.y===G.y);
  if(w){doWarp(w);return;}
  const it=m.items.find(i=>i.x===G.x&&i.y===G.y&&!G.flags['got_'+i.id]);
  if(it){
    G.flags['got_'+it.id]=1;G.items[it.it]=(G.items[it.it]||0)+it.n;sfx.pick();
    say(`Found ${it.n>1?it.n+' ':''}${IT[it.it].n}${it.it==='cigs'&&it.n>1?'':''}!`+(it.it==='perogi'?' Baba would be proud.':''));
    return;
  }
  if(checkSight())return;
  if(ENC.has(tileAt(m,G.x,G.y))&&m.enc&&G.steps>Wd.noEnc&&Math.random()<.12)startWild();
}
function doWarp(w){
  if(w.req&&!G.flags[w.req]){
    Cs.run(function*(){
      sfx.bump();yield* talk(w.deny,0);
      G.x=Wd.lx;G.y=Wd.ly;Wd.px=G.x*T;Wd.py=G.y*T;
    }());
    return;
  }
  sfx.door();

function checkSight(){
  const m=cur();
  for(const n of npcsHere()){
    if(!n.tr||defeated(n))continue;
    for(let k=1;k<=n.tr.sight;k++){
      const x=n.x+DX[n.dir]*k,y=n.y+DY[n.dir]*k;
      if(x===G.x&&y===G.y){Cs.run(challenge(n));return true;}
      if(SOLID.has(tileAt(m,x,y))||npcAt(x,y))break;
    }
  }
  return false;
}
function* npcStep(n,d){
  n.dir=d;const tx=n.x+DX[d],ty=n.y+DY[d];
  for(let i=0;i<8;i++){n.px+=DX[d]*2;n.py+=DY[d]*2;yield 1;}
  n.x=tx;n.y=ty;n.px=tx*T;n.py=ty*T;
}
function faceTo(n,x,y){
  const dx=x-n.x,dy=y-n.y;
  n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0);
}
function* challenge(n){
  n.excl=34;sfx.crit();yield 38;n.excl=0;
  while(Math.abs(n.x-G.x)+Math.abs(n.y-G.y)>1){
    const dx=G.x-n.x,dy=G.y-n.y;
    let d;if(Math.abs(dx)>Math.abs(dy)||dy===0)d=dx<0?2:3;else d=dy<0?1:0;
    if(blocked(n.x+DX[d],n.y+DY[d])){break;}
    yield* npcStep(n,d);
  }
  faceTo(n,G.x,G.y);G.dir=({0:1,1:0,2:3,3:2})[n.dir];
  yield* talk(n.tr.pre,0);
  if(n.tr.gag){
    yield* talk('Dougie winds up a bottle for a big throw... "Watch this!"',0);
    sfx.bottle();yield 20;
    yield* talk('The bottle slips behind him and comes right back down!',0);
    sfx.ow();Fx.shake=22;Fx.flashCol='#ffd23a';Fx.flash=6;yield 22;
    yield* talk('CLONK!! Right in the nuts!!!',0);
    n.tr.hurt=1;

}
function* fight(n){
  let res=null,rec=null;
  const foes=n.tr.team.map(([s,l,nm])=>mkMon(s,l,nm));
  if(n.tr.hurt){foes[0].hp=Math.max(1,foes[0].hp-Math.floor(foes[0].mhp*.25));n.tr.hurt=0;}
  fadeTo(()=>startBattle({tr:n.tr,name:n.tr.name,foes,boss:n.boss||null,done:(r,m)=>{res=r;rec=m;G.mode='world';}}));
  yield()=>res!==null;
  playSong(cur().song);

    G.flags['d_'+n.id]=1;

      const mon=mkMon(n.tr.join,n.tr.team[0][1]);mon.hp=mon.mhp;
      G.gang.push(mon);sfx.caught();G.flags['gone_'+n.id]=1;
      yield* talk(`${mon.nm} joins your crew!`,60);
    }else if(n.tr.join){yield* talk('Your crew is full! Release someone and talk to him again.',0);G.flags['d_'+n.id]=0;}
    if(n.boss==='pSmokey'){yield* ending();return;}
    if(n.boss)yield* talk(`The ${PATCHES.filter(p=>G.flags[p]).length} patch${PATCHES.filter(p=>G.flags[p]).length>1?'es':''} on your jumpsuit show everyone who runs this place.`,0);
  }else if(res==='lose'){yield* whiteout();}
}
function* whiteout(){

function startWild(){

function interact(){

  if(!n&&tileAt(m,fx,fy)===TL.COUNTER){const n2=npcAt(fx+DX[G.dir],fy+DY[G.dir]);if(n2&&n2.reach)n=n2;}
  if(n){faceTo(n,G.x,G.y);talkNpc(n);return;}

function tray(x,y){
  const key=G.map+x+'_'+y;
  if((G.trays[key]||0)>G.steps){say('The tray is empty. The tray ladies are glaring at you.');return;}
  G.trays[key]=G.steps+260;
  const r=Math.random();
  if(r<.45){G.items.perogi++;sfx.pick();say('You sneak a hot perogi off the tray! Potato and cheese.');}
  else if(r<.7){G.items.perogi+=2;sfx.pick();say('Jackpot! Two fresh perogis, still steaming!');}
  else if(r<.9){G.items.cigs+=2;sfx.pick();say('No perogis, but somebody left 2 L&M packs under the tray.');}

function talkNpc(n){

  const s=n.say||['...'];

  if(s[0]==='baba')return baba();

    g.fillStyle='rgba(255,250,200,.22)';g.beginPath();g.moveTo(240,0);g.lineTo(60,90);g.lineTo(220,170);g.fill();
    // shotgun
    R(40,100,120,4,'#9aa5b5');R(40,100,120,1,'#d6dde6');R(40,105,100,3,'#7a8594');R(110,104,24,5,'#5a3a1c');R(134,102,34,9,'#6e4a24');R(160,108,22,11,'#6e4a24');R(150,100,10,3,'#2b2631');
    R(36,99,6,6,'#2b2631');
    if((IS.t>>4)%2){tx('PUMPER',120,76,'#e8452e','center');}
    tx('<-- BACKSEAT',120,122,'#ffd23a','center');
  }else if(sc===3){
    R(0,0,W,H,'#0b0910');skyline();R(0,150,W,66,'#2a2830');

  }else if(sc===5){
    skyline();road();wagon(IS.wagonX,128);lights();
    if(IS.title){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,80,W,36);tx(IS.title,120,92,'#ffd23a','center');tx('Lake Erie State Pen',120,104,'#fff','center');}
  }
  if(IS.big){tx(IS.big,120+ri(-2,2),60+ri(-2,2),'#ffd23a','center');tx(IS.big,121,61,'#e8452e','center','#000');}

function* introGen(){
  IS.scene=0;IS.carX=-70;IS.lights=0;IS.cop.show=0;IS.big=null;playSong('calm');
  yield 10;
  for(let i=0;i<130;i++){IS.scroll+=3;IS.carX+=1.3;yield 1;}
  yield* talk('Cleveland, Ohio. 11:47 PM.',0);
  yield* talk('Bandit is rolling across town to cop some weed. Just a quiet little drive...',0);
  IS.lights=1;IS.cop.show=1;IS.copX=-150;sfx.siren();playSong(null);
  for(let i=0;i<70;i++){IS.scroll+=3;IS.copX+=2.4;yield 1;}
  yield* talk('*WOOP WOOP*   Red and blue lights in the mirror.',0);
  yield* talk('Bandit: Not tonight. NOT TONIGHT.',0);
  for(let i=0;i<40;i++){IS.scroll+=Math.max(0,3-i*.1);IS.carX+=Math.max(0,.4-i*.01);IS.copX+=.3;yield 1;}
  sfx.slam();
  IS.scene=1;IS.cop.show=2;IS.cop.x=IS.copX+44;IS.cop.walk=1;IS.flashlight=0;
  for(let i=0;i<30;i++){IS.cop.x+=1.6;yield 1;}
  IS.cop.walk=0;IS.flashlight=1;
  yield* talk('Officer: License and registration.',0);
  yield* talk('Bandit: Officer, I was just heading to... church.',0);
  yield* talk('Officer: At midnight. Smells like a Willowick bonfire in here.',0);
  yield* talk('The officer sweeps his flashlight across the backseat...',0);
  IS.scene=2;sfx.crit();yield 20;
  yield* talk('Officer: ...Is that a PUMPER in the backseat?',0);
  yield* talk('Bandit: ...That is not mine.',0);
  yield* talk('Officer: Step out of the car. Hands where I can see them.',0);
  IS.scene=3;IS.carX=70;IS.copX=-8;yield 20;
  IS.cuffed=1;sfx.slam();Fx.shake=8;yield 24;
  yield* talk('Officer: You are going downtown, pop star. Possession of a firearm and intent to buy.',0);
  yield* talk('Bandit: Wait, wait, WAIT!',0);
  IS.big="I'LL GIVE YOU LUKEY!!";sfx.crit();Fx.shake=22;IS.flash=8;
  yield* talk("Bandit: I'LL GIVE YOU LUKEY!!",0);
  IS.big=null;
  yield* talk('Officer: Sure you will. Into the patty wagon.',0);
  IS.scene=4;IS.copX=-200;IS.cop.show=0;IS.show={bandit:1,cop2:1,cop3:1};IS.bx=60;IS.wagonX=140;IS.bdir=3;
  for(let i=0;i<50;i++){IS.bx+=1.1;yield 1;}
  IS.show={};sfx.slam();Fx.shake=14;IS.flash=6;yield 30;
  yield* talk('*CLANG* The patty wagon door slams shut.',0);
  IS.scene=5;IS.wagonX=70;IS.lights=1;sfx.siren();
  for(let i=0;i<100;i++){IS.scroll+=4;IS.wagonX+=(i<30?0:3.4);if(i===20)IS.title='LAKE ERIE';yield 1;}
  fadeTo(null);yield()=>Fx.fade>=1;Fx.st=0;
  startNewWorld();
}
function startNewWorld(){
  G.flags={};G.items={cigs:6,beer:0,weed:0,shank:0,perogi:0};G.steps=0;G.trays={};G.babaT=0;
  G.gang=[mkMon('bandit',5,'BANDIT')];
  enterMap('intake',9,11,1);G.mode='world';Say.clear();
  Cs.run((function*(){
    yield 40;Fx.st=2;yield 20;
    yield* talk('Officer Dunkle: Over here, fish. The desk. NOW.',0);
  })());
}
function introUpdate(){
  if(Pr.start){Pr.start=0;Say.clear();Ic.g=null;Fx.fade=1;Fx.st=0;IS.big=null;startNewWorld();Fx.st=2;return;}
  if(Say.on)Say.update();else Ic.update();
}
function startIntro(){
  Menus.length=0;Say.clear();G.mode='intro';Fx.fade=0;Fx.st=0;IS.scene=0;IS.title='';IS.show={};IS.big=null;IS.cop={x:0,show:0};
  Ic.run(introGen());
}

/* ---- title ---- */
const TIT={t:0};
function openTitle(){
  G.mode='title';playSong('title');Menus.length=0;Say.clear();Fx.fade=0;Fx.st=0;
  openMenu({x:70,y:150,w:100,nocancel:true,items:[
    {l:'NEW GAME',f:()=>{sfx.ok();startIntro();}},
    {l:'CONTINUE',d:!hasSave(),f:()=>{if(loadGame()){Fx.fade=1;Fx.st=2;}else openTitle();}}
  ]});
}
function titleUpdate(){menuUpdate();if(G.mode==='title'&&!Menus.length)openTitle();}
function titleDraw(){
  TIT.t++;
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1a0c2e');gr.addColorStop(1,'#4a1a2a');g.fillStyle=gr;g.fillRect(0,0,W,H);

  const tg=g.createLinearGradient(0,100,0,116);tg.addColorStop(0,'#ffd23a');tg.addColorStop(1,'#e8731c');g.fillStyle=tg;g.fillText('REGAL BANDIT',120,102);
  g.font='16px "Press Start 2P", Impact, sans-serif';g.fillStyle='#000';g.fillText('LOCKUP',121,125);g.fillStyle='#fff';g.fillText('LOCKUP',120,124);
  tx('A CELL BLOCK ADVENTURE',120,142,'#c9a6ff','center');
  tx('TAP A MENU ITEM OR PRESS A',120,H-30,'#ffffff99','center');tx('(c) POD BOSS ENT.',120,H-16,'#8a7a9a','center');
}
function endBanner(){}

/* ---- ending ---- */
const ES={t:0,wx:260,lx:0,out:0,credits:0,y:0};

  yield* talk('SmokeyBooty drops to a knee. The whole block goes quiet.',0);
  fadeTo(null);yield()=>Fx.fade>=1;Fx.st=0;

  ES.t++;
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a1040');gr.addColorStop(1,'#e8731c');g.fillStyle=gr;g.fillRect(0,0,W,H);

  if(ES.out)drawPerson(LOOK.lukey,ES.wx-24,150+14,2,0,1.5);

    tx('THE BANDIT RUNS EVERY BLOCK',120,42,'#fff','center');
    tx(`RANK: ${rank()}`,120,64,'#f3c27a','center');
    tx(`CREW: ${G.gang.length}/6`,120,80,'#fff','center');
    tx(`STEPS: ${G.steps}`,120,96,'#fff','center');
    tx(`L&M PACKS: ${G.items.cigs}`,120,112,'#fff','center');
    tx('LUKEY IS NOW YOUR CELLIE.',120,140,'#ff7a5a','center');
    tx('THANKS FOR PLAYING',120,160,'#c9a6ff','center');
    if((ES.t>>5)%2)tx('PRESS A',120,190,'#ffd23a','center');
  }
}
function endUpdate(){if(Say.on)Say.update();else Cs.update();}

/* ---- main loop ---- */
function frame(){
  g.setTransform(S,0,0,S,0,0);g.imageSmoothingEnabled=false;
  if(Fx.shake>0&&G.mode!=='battle')g.translate(ri(-2,2),ri(-1,1));
  fxUpdate();
  switch(G.mode){
    case 'title':titleUpdate();break;
    case 'intro':introUpdate();break;
    case 'world':worldUpdate();break;
    case 'battle':if(Say.on)Say.update();else if(Menus.length)menuUpdate();else Co.update();break;
    case 'end':endUpdate();break;
  }
  switch(G.mode){
    case 'title':titleDraw();break;
    case 'intro':introDraw();break;
    case 'world':worldDraw();break;
    case 'battle':battleDraw();break;
    case 'end':endDraw();break;
  }
  Say.draw();menuDraw();fxDraw();
  for(const k in Pr)Pr[k]=0;
}
let last=0,acc=0;
function showErr(e){const p=document.getElementById('err');if(p&&p.textContent.length<1500){p.style.display='block';p.textContent+=(e&&e.stack?e.stack.split('\n').slice(0,3).join(' | '):e)+'\n';}}
function raf(t){
  const dt=Math.min(100,t-last||16);last=t;acc+=dt;
  let n=0;while(acc>=16.67&&n<4){try{frame();}catch(e){showErr(e);}acc-=16.67;n++;}
  if(n===4)acc=0;
  requestAnimationFrame(raf);
}
function boot(){
  if(boot.done)return;boot.done=1;
  try{resize();openTitle();}catch(e){showErr(e);}
  requestAnimationFrame(raf);
}
(function(){
  let ok=false;
  try{document.fonts.load('8px "Press Start 2P"').then(()=>{boot();}).catch(boot);}catch(e){boot();}
  setTimeout(boot,1800);
})();
</script>
