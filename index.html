<script>
'use strict';
/* ===== CORE: canvas, input, audio, text, menus, fx ===== */
const W=240,T=16;let H=300;const OFF=()=>Math.round((H-216)/2);
const cv=document.getElementById('screen');
let g=cv.getContext('2d'),S=2;
const FONT='bold 10px "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif';
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lcdEl=document.getElementById('lcd');
function layout(){
  const vv=window.visualViewport,w=Math.round((vv&&vv.width)||innerWidth),h=Math.round((vv&&vv.height)||innerHeight),r=document.documentElement;
  const land=w>h&&h<=640;r.dataset.o=land?'l':'p';
  r.style.setProperty('--W',w+'px');r.style.setProperty('--Hh',h+'px');r.style.setProperty('--lu',Math.min(h*.0118,w*.0062)+'px');
}
function resize(){
  layout();

  H=clamp(Math.round(W*bh/bw),216,430);
  const sc=Math.min(bw/W,bh/H);
  cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
  S=Math.max(2,Math.round(sc*dpr));cv.width=W*S;cv.height=H*S;
  g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  window.VW={sc,bw,bh,cx0:(bw-Math.floor(W*sc))/2,cy0:(bh-Math.floor(H*sc))/2};
  if(typeof glResize==='function')glResize(bw,bh,dpr);
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>{[60,200,450,900].forEach(t=>setTimeout(resize,t));});
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
setInterval(()=>{const vv=window.visualViewport,w=Math.round((vv&&vv.width)||innerWidth),h=Math.round((vv&&vv.height)||innerHeight);if(w+'x'+h!==resize.last){resize.last=w+'x'+h;resize();}},400);
if(typeof ResizeObserver!=='undefined'){try{new ResizeObserver(()=>resize()).observe(lcdEl);}catch(e){}}

/* ---- input ---- */
const K={up:0,down:0,left:0,right:0,a:0,b:0,start:0,select:0},Pr={};
function setKey(k,v){v=v?1:0;if(v&&!K[k]){Pr[k]=1;try{ac();}catch(e){}}K[k]=v;}
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'a',KeyJ:'a',Space:'a',KeyX:'down',KeyB:'b',KeyK:'b',Enter:'start',ShiftLeft:'select',ShiftRight:'select',Backspace:'select'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){setKey(k,1);e.preventDefault();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){setKey(k,0);e.preventDefault();}});
function releaseAll(){for(const k in K)setKey(k,0);document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  if(!window.PointerEvent){el.addEventListener('touchstart',e=>{e.preventDefault();setKey(k,1);el.classList.add('on');},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();setKey(k,0);el.classList.remove('on');},{passive:false});el.addEventListener('mousedown',()=>setKey(k,1));el.addEventListener('mouseup',()=>setKey(k,0));return;}
  const dn=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}setKey(k,1);el.classList.add('on');};
  const up=e=>{e.preventDefault();setKey(k,0);el.classList.remove('on');};
  el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',e=>{if(!e.buttons&&e.pointerType==='mouse')up(e);});
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const dpEl=document.getElementById('dpad');
function dpSet(e){
  const r=dpEl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  const ax=Math.abs(x),ay=Math.abs(y),on=Math.hypot(x,y)>.1;
  setKey('left',on&&x<0&&ax>=ay*.8);setKey('right',on&&x>0&&ax>=ay*.8);
  setKey('up',on&&y<0&&ay>ax*.8);setKey('down',on&&y>0&&ay>ax*.8);
  dpEl.classList.add('on');
}
function dpEnd(e){e.preventDefault();['up','down','left','right'].forEach(k=>setKey(k,0));dpEl.classList.remove('on');}
dpEl.addEventListener('pointerdown',e=>{e.preventDefault();try{dpEl.setPointerCapture(e.pointerId);}catch(_){}dpSet(e);});
dpEl.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')dpSet(e);});
dpEl.addEventListener('pointerup',dpEnd);dpEl.addEventListener('pointercancel',dpEnd);
dpEl.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---- audio ---- */
let AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function beep(f,d=.08,type='square',v=.04,slide=0,t0=0){
  if(muted)return;const a=AC;if(!a)return;
  try{
    const t=a.currentTime+t0,o=a.createOscillator(),gn=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function seq(fs,step=.08,type='square',v=.04){fs.forEach((f,i)=>f&&beep(f,step*1.2,type,v,0,i*step));}

/* ---- text + panels ---- */
function tx(s,x,y,c='#fff',al='left',sh='#000'){
  g.font=FONT;g.textBaseline='top';g.textAlign=al;
  if(sh){g.fillStyle=sh;g.fillText(s,x+1,y+1);}
  g.fillStyle=c;g.fillText(s,x,y);
}
function wrap(s,maxW){
  g.font=FONT;const out=[];
  for(const para of String(s).split('\n')){
    let line='';
    for(const w of para.split(' ')){
      const t=line?line+' '+w:w;
      if(g.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;
    }
    out.push(line);
  }
  return out;
}
function panel(x,y,w,h,fill='#1a1022',bd='#f3a65a'){
  g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle=bd;g.fillRect(x,y,w,h);
  g.fillStyle='#5a2d12';g.fillRect(x+1,y+1,w-2,h-2);
  g.fillStyle=fill;g.fillRect(x+2,y+2,w-4,h-4);
  g.fillStyle='#ffffff10';g.fillRect(x+2,y+2,w-4,2);
}
function bar(x,y,w,p,h=4){
  p=clamp(p,0,1);
  g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle='#3a3340';g.fillRect(x,y,w,h);
  g.fillStyle=p>.5?'#4fd16a':p>.2?'#f2c230':'#e8452e';g.fillRect(x,y,Math.round(w*p),h);
  g.fillStyle='#ffffff44';g.fillRect(x,y,Math.round(w*p),1);
}

/* ---- message box (typewriter) ---- */
const Say={
  q:[],cur:null,n:0,hold:0,lines:[],
  add(t,cb,o){
    const L=wrap(t,214);
    if(L.length<=3){this.q.push({t:L.join('\n'),L,cb,o:o||{}});return;}
    for(let i=0;i<L.length;i+=3){
      const part=L.slice(i,i+3);
      this.q.push({t:part.join('\n'),L:part,cb:i+3>=L.length?cb:null,o:o||{}});
    }
  },
  get on(){return !!(this.cur||this.q.length);},
  clear(){this.q=[];this.cur=null;},
  update(){
    if(!this.cur){
      if(!this.q.length)return;
      this.cur=this.q.shift();this.n=0;this.hold=0;this.full=this.cur.L.join('').length;
    }
    const c=this.cur;
    if(this.n<this.full){
      if(Pr.a||Pr.b){this.n=this.full;Pr.a=Pr.b=0;return;}
      this.n+=(K.a||K.b)?3:1;if(this.n%4===0)sfx.tick();return;
    }
    this.hold++;
    const auto=c.o.auto;
    if(Pr.a||Pr.b||(auto&&this.hold>auto)){
      Pr.a=Pr.b=0;this.cur=null;sfx.blip();if(c.cb)c.cb();
    }
  },
  draw(){
    if(!this.cur)return;
    const c=this.cur;panel(4,H-62,232,58,'#140c1c');
    let left=this.n;
    c.L.forEach((ln,i)=>{
      if(left<=0)return;
      tx(ln.slice(0,left),11,H-56+i*16,'#fff');left-=ln.length;
    });
    if(this.n>=this.full&&!c.o.auto&&((Date.now()/300)|0)%2)tx('▼',221,H-18,'#f3a65a');
  }
};
const say=(t,cb,o)=>Say.add(t,cb,o);

/* ---- menus ---- */
const Menus=[];
function openMenu(m){m.cur=m.cur||0;m.top=0;Menus.push(m);sfx.blip();return m;}
function menuUpdate(){
  const m=Menus[Menus.length-1];if(!m)return false;
  const n=m.items.length,cols=m.cols||1;
  if(Pr.up){m.cur=cols>1?(m.cur-cols+n)%n:(m.cur+n-1)%n;sfx.blip();}
  if(Pr.down){m.cur=cols>1?(m.cur+cols)%n:(m.cur+1)%n;sfx.blip();}
  if(cols>1){if(Pr.left){m.cur=(m.cur+n-1)%n;sfx.blip();}if(Pr.right){m.cur=(m.cur+1)%n;sfx.blip();}}
  if(m.onMove)m.onMove(m.cur);
  if(Pr.a){
    const it=m.items[m.cur];Pr.a=0;
    if(!it||it.d){sfx.bump();}
    else{sfx.ok();if(!m.stay)Menus.pop();if(it.f)it.f();}
  }else if(Pr.b){
    Pr.b=0;
    if(m.nocancel){sfx.bump();}
    else if(m.cancel){sfx.blip();Menus.pop();m.cancel();}
    else{sfx.blip();Menus.pop();}
  }
  return true;
}
function menuDraw(){
  Menus.forEach(m=>{
    const rh=m.rh||13,cols=m.cols||1,vis=m.vis||m.items.length,n=m.items.length;
    const rows=Math.ceil(Math.min(vis,n)/cols),hdr=m.title?12:0;
    const h=rows*rh+8+hdr;
    panel(m.x,m.y,m.w,h);
    const ttl=typeof m.title==='function'?m.title():m.title;
    if(ttl)tx(ttl,m.x+6,m.y+5,'#f3a65a');
    const rowCur=Math.floor(m.cur/cols);
    if(rowCur<m.top)m.top=rowCur;
    if(rowCur>=m.top+rows)m.top=rowCur-rows+1;
    for(let i=0;i<rows*cols;i++){
      const idx=m.top*cols+i;if(idx>=n)break;
      const it=m.items[idx],r=Math.floor(i/cols),c=i%cols,cw=(m.w-10)/cols;
      const x=m.x+6+c*cw,y=m.y+4+hdr+r*rh+1;
      const col=it.d?'#7a6e86':'#fff';
      if(idx===m.cur)tx('▶',x-1,y,'#f3a65a');
      tx(it.l,x+8,y,col);
      if(it.r)tx(it.r,x+cw-6,y,it.d?'#7a6e86':'#f3c27a','right');
    }
    if(m.top>0)tx('▲',m.x+m.w-12,m.y+3,'#f3a65a');
    if(m.top+rows<Math.ceil(n/cols))tx('▼',m.x+m.w-12,m.y+h-10,'#f3a65a');
  });
}
function ask(text,yes,no){

}

/* ---- fx ---- */
const Fx={fade:0,st:0,cb:null,shake:0,flash:0,flashCol:'#fff'};
function fadeTo(cb){Fx.st=1;Fx.cb=cb;}
function fxUpdate(){
  if(Fx.st===1){Fx.fade+=.1;if(Fx.fade>=1){Fx.fade=1;Fx.st=2;const f=Fx.cb;Fx.cb=null;if(f)f();}}
  else if(Fx.st===2){Fx.fade-=.1;if(Fx.fade<=0){Fx.fade=0;Fx.st=0;}}
  if(Fx.shake>0)Fx.shake--;
  if(Fx.flash>0)Fx.flash--;
}
function fxDraw(){
  if(Fx.fade>0){g.fillStyle=`rgba(0,0,0,${Fx.fade})`;g.fillRect(0,0,W,H);}
  if(Fx.flash>0){g.globalAlpha=Fx.flash/10;g.fillStyle=Fx.flashCol;g.fillRect(0,0,W,H);g.globalAlpha=1;}
}
const busy=()=>Fx.st!==0;

  if(m){
    const rh=m.rh||11,cols=m.cols||1,vis=m.vis||m.items.length,n=m.items.length,rows=Math.ceil(Math.min(vis,n)/cols);
    const hdr=((typeof m.title==='function'?m.title():m.title)?12:0),h=rows*rh+8+hdr,cw=(m.w-10)/cols;
    if(px>=m.x&&px<=m.x+m.w&&py>=m.y&&py<=m.y+h){
      const c=Math.min(cols-1,Math.max(0,Math.floor((px-m.x-6)/cw))),rr=Math.floor((py-m.y-4-hdr)/rh);
      const idx=(m.top+rr)*cols+c;
      if(rr>=0&&rr<rows&&idx>=0&&idx<n){m.cur=idx;Pr.a=1;}
    }else if(!m.nocancel)Pr.b=1;
  }
});

function person(c,x0,y0,L,dir,fr,s){

  const dk=(col)=>col;

  if(side){r(5,12+lf,3,3-lf,pn);r(8,12+rf,3,3-rf,pn);r(5,14,3,1,'#1d1a22');r(8,14,3,1,'#1d1a22');}
  else{r(5,12+lf,3,3-lf,pn);r(8,12+rf,3,3-rf,pn);r(5,14,3,1,'#1d1a22');r(8,14,3,1,'#1d1a22');}
  // torso + arms
  if(side){
    r(5-w,8,6+w*2,5,sh);r(5-w,8,6+w*2,1,'#ffffff22');r(5-w,12,6+w*2,1,'#0003');
    r(6,8+(fr?1:0),3,4,sh);r(6,8+(fr?1:0),3,1,'#ffffff22');r(7,12+(fr?1:0),1,1,sk);
  }else{

    r(3-w,8+(fr===1?1:0),1,4,sh);r(12+w,8+(fr===2?1:0),1,4,sh);
    r(3-w,12+(fr===1?1:0),1,1,sk);r(12+w,12+(fr===2?1:0),1,1,sk);

  }
  // head
  if(side){

    if(st==='long'){r(9,5,2,4,hr);}
    if(st==='fro')r(3,0,9,4,hr);
    if(st==='mohawk'){r(5,0,5,1,hr);r(6,-0,3,1,hr);}
    r(5,4,1,2,'#111');
    if(ac.includes('shades'))r(4,4,4,2,'#111');
    if(ac.includes('mask')){r(4,3,6,3,'#151515');r(5,4,2,1,'#fff');r(5,4,1,1,'#111');}
    if(ac.includes('beard'))r(4,6,6,2,hr);
    if(ac.includes('chin'))r(3,7,5,2,sk);
    if(st==='beanie'){r(4,0,7,3,L.hc||'#333');r(4,3,7,1,'#555');}
    if(st==='bandana'){r(4,1,7,2,L.hc||'#d22');r(10,2,2,2,L.hc||'#d22');}
    if(ac.includes('cig')){r(2,6,3,1,'#f4f4f0');r(1,6,1,1,'#ff6a1a');}
    if(ac.includes('scar'))r(6,2,1,3,'#b55');
  }else{
    r(4,1,8,7,sk);r(3,4,1,2,sk);r(12,4,1,2,sk);
    if(dir===0){
      r(6,4,1,2,'#111');r(9,4,1,2,'#111');r(7,6,2,1,'#8a3a2a');
      if(st==='short'||st==='long'){r(4,0,8,3,hr);r(4,3,1,1,hr);r(11,3,1,1,hr);}
      if(st==='buzz'){r(4,1,8,2,hr);}
      if(st==='bald')r(5,1,3,1,'#ffffff55');
      if(st==='mohawk'){r(7,0,2,3,hr);r(4,1,8,1,'#0002');}
      if(st==='long'){r(3,3,1,6,hr);r(12,3,1,6,hr);}
      if(st==='fro')r(3,0,10,4,hr);
      if(st==='beanie'){r(4,0,8,3,L.hc||'#333');r(4,3,8,1,'#555');}
      if(st==='bandana'){r(4,1,8,2,L.hc||'#d22');r(4,3,8,1,'#0002');}
      if(ac.includes('scar'))r(10,2,1,3,'#b55');
      if(ac.includes('shades'))r(5,4,6,2,'#111');
      if(ac.includes('mask')){r(4,3,8,3,'#151515');r(5,4,2,1,'#fff');r(9,4,2,1,'#fff');r(6,4,1,1,'#111');r(10,4,1,1,'#111');}
      if(ac.includes('beard')){r(5,6,6,2,hr);r(7,6,2,1,'#8a3a2a');}
      if(ac.includes('chin')){r(5,7,6,2,sk);r(6,8,4,1,'#0003');}
      if(ac.includes('cig')){r(10,6,4,1,'#f4f4f0');r(14,6,1,1,'#ff6a1a');}
    }else{
      if(st!=='bald')r(4,0,8,6,hr);
      if(st==='long'){r(3,3,1,6,hr);r(12,3,1,6,hr);}
      if(st==='fro')r(3,0,10,5,hr);
      if(st==='beanie'){r(4,0,8,3,L.hc||'#333');r(4,3,8,1,'#555');}

  }

  if(ac.includes('smoke')){r(1,0,3,2,'#d0cbd8');r(12,1,3,2,'#bdb7c8');r(2,2,2,1,'#9a94a8');r(13,3,2,1,'#9a94a8');}

function mstat(m){
  const b=SP[m.s].b,L=m.l;
  m.mhp=Math.floor(b[0]*L/16)+L+10;m.atk=Math.floor(b[1]*L/20)+5;
  m.def=Math.floor(b[2]*L/20)+5;m.spd=Math.floor(b[3]*L/20)+5;
  if(typeof statHook==='function')statHook(m);
}
function mkMon(s,l,nm){
  const m={s,l,nm:nm||SP[s].n,xp:0,st:null,moves:[]};
  mstat(m);m.hp=m.mhp;
  let ls=SP[s].ls.filter(e=>e[0]<=l).map(e=>e[1]);
  ls=[...new Set(ls)].slice(-4);
  m.moves=ls.map(id=>({id,pp:M[id].pp}));
  return m;
}

/* ---- turn resolution ---- */
function enemyMove(){
  const e=B.em,p=B.pm;
  const opts=e.moves.map((mv,i)=>({mv,i})).filter(o=>o.mv.pp>0);
  if(!opts.length)return -1;
  const smart=B.boss||(B.trainer&&Math.random()<.6);
  const sc=opts.map(o=>{
    const d=M[o.mv.id];let s=1+Math.random()*(smart?.6:2.4);
    if(d.p){s+=d.p/20*typeMult(d.t,SP[p.s].t)*(SP[e.s].t===d.t?1.25:1);}
    else if(d.fx==='heal'){s+=e.hp<e.mhp*.4?5:-3;}
    else if(d.fx==='atkdown'){s+=p.sg.atk>-1?2.5:-2;}
    else if(d.fx==='defup'||d.fx==='atkup'||d.fx==='high'||d.fx==='drunkup'){s+=e.sg.atk<1&&e.sg.def<1?2:-2;}
    else if(d.fx==='accdown'){s+=p.sg.acc>-1?2:-2;}
    if(d.fx==='stunbonus'&&p.stn>0)s+=4;
    return s;
  });
  let bi=0;sc.forEach((s,i)=>{if(s>sc[bi])bi=s>sc[bi]?i:bi;});
  return opts[bi].i;
}
function* resolveTurn(pc){
  let r=null;
  if(pc.t==='run'){
    const ch=clamp(.5+(B.pm.spd-B.em.spd)*.02,.25,.95);
    if(Math.random()<ch){yield* talk('Got away safely!');return 'run';}
    yield* talk("Can't get away!");
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='deal'){
    const res=yield* tryDeal(pc);
    if(res==='recruit')return 'recruit';
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='switch'){
    const old=B.pm;
    yield* talk(`Come back, ${old.nm}!`,20);
    B.pm=G.gang[pc.i];B.part.add(B.pm);B.off.p.a=1;sfx.ok();
    yield* talk(`Go! ${B.pm.nm}!`,20);
    r=yield* enemyTurn();return r||'continue';
  }
  if(pc.t==='item'){
    G.items[pc.id]--;
    yield* applyItem(pc.id,G.gang[pc.i],true);
    r=yield* enemyTurn();return r||'continue';
  }
  // move
  const pi=pc.i,ei=enemyMove();
  const pmv=pc.t==='arm'?G.L.arms[pi]:(pi>=0?B.pm.moves[pi]:{id:'struggle',pp:1}),emv=ei>=0?B.em.moves[ei]:{id:'struggle',pp:1};

function* execMove(s,mvslot){
  const att=s==='p'?B.pm:B.em,def=s==='p'?B.em:B.pm,ds=s==='p'?'e':'p';
  const d=M[mvslot.id];
  if(att.stn>0){att.stn--;yield* talk(`${att.nm} is too dizzy to move!`,30);return;}
  if(att.st==='drunk'&&Math.random()<.25){sfx.miss();yield* talk(`${att.nm} stumbles around drunk!`,30);return;}
  if(mvslot.id!=='struggle'&&!d.eternal)mvslot.pp=Math.max(0,mvslot.pp-1);
  if(d.fx==='lukey')yield* talk(`${att.nm} yells "I'LL GIVE YOU LUKEY!!"`,40);
  else yield* talk(d.s?storyLine(d,att,def,s):`${att.nm} used ${d.n}!`,d.s?44:28);
  // accuracy
  const E=B.env||BENV.pod;
  if(E.slip&&Math.random()<E.slip&&!d.self){sfx.miss();Fx.shake=8;yield* talk(pick(E.slipLines||['slips!']).replace('{a}',att.nm),30);yield* hurt(s,Math.max(1,Math.floor(att.mhp*.04)));return;}
  let acc=d.a*accMul(att.sg.acc)*E.acc;
  if(!d.self&&Math.random()*100>acc){if(d.p&&hasCombo(mvslot.id)&&R3.ok){yield* comboFight(s,mvslot.id,Math.max(1,d.p),true);}sfx.miss();if(typeof plCount==='function'&&s==='e'&&def.s==='bandit')plCount('dodge',1);yield* talk('But it missed!',26);return;}
  // bottle fumble
  if(d.fx==='bottle'&&Math.random()<.22+E.fumble){yield* bottleFumble(s,att);return;}
  if(d.fx==='bottle')yield* bottleThrow(s);
  if(d.p){
    if(!hasCombo(mvslot.id))yield* lunge(s,mvslot.id);
    const crit=Math.random()<(((d.crit||att.shk>0)?.25:.0625)+E.crit+(att.s==='bandit'?(typeof plCrit==='function'?plCrit():0):0));
    let bonus=att.shk>0?1.3:1;
    if(d.fx==='stunbonus'&&def.stn>0)bonus*=2;
    if(d.fx==='lukey')bonus*=1;
    const A=att.atk*stageMul(att.sg.atk),D=def.def*stageMul(def.sg.def);
    const tm=typeMult(d.t,SP[def.s].t),stab=SP[att.s].t===d.t?1.25:1;
    let dmg=Math.floor(((2*att.l/5+2)*d.p*A/D)/50)+2;
    dmg=Math.max(1,Math.floor(dmg*tm*stab*(crit?1.6:1)*(.85+Math.random()*.15)*bonus*E.dmg*(E.big&&d.p>=95?E.big:1)));
    dmg=Math.min(dmg,def.hp);
    crit?sfx.crit():sfx.hit();
    if(typeof plCount==='function'){if(s==='p'&&att.s==='bandit'){plCount('hit',1);if(crit)plCount('crit',1);}if(s==='e'&&def.s==='bandit')plCount('taken',dmg);}
    if(d.fx==='lukey'){Fx.shake=16;Fx.flashCol='#4aa0ff';Fx.flash=8;}
    if(hasCombo(mvslot.id))yield* comboFight(s,mvslot.id,dmg,false);else yield* hurt(ds,dmg);
    if(crit)yield* talk('A critical hit!',22);
    if(d.drain&&alive(att)){const hl=Math.max(1,Math.floor(dmg*d.drain));att.hp=Math.min(att.mhp,att.hp+hl);yield* talk(`${att.nm} heals ${hl} HP!`,24);}
    if(d.w&&s==='p'&&mvslot.pp<=0&&!d.eternal){const ix=G.L.arms.indexOf(mvslot);if(ix>=0)G.L.arms.splice(ix,1);yield* talk(`The ${d.n} breaks apart!`,30);}
    if(alive(def)&&def.hp<def.mhp*.25&&!def._low){def._low=1;yield* talk(pick([`${def.nm} is spitting blood, barely on his feet!`,`${def.nm}'s knees buckle. One more good shot...`,`${def.nm} is swaying. The crowd smells blood.`]),34);}
    else if(alive(def)&&d.p>=85&&dmg>=def.mhp*.25)yield* talk(pick([`${def.nm} crashes hard. That one hurt.`,`${def.nm} hits the ground like a sack of laundry!`,`That one echoed off the walls!`]),30);
    if(tm>1)yield* talk("It's super effective!",24);else if(tm<1)yield* talk("It's not very effective...",24);
    if(d.fx==='recoil'){const rc=Math.max(1,Math.floor(dmg/4));yield* hurt(s,rc);yield* talk(`${att.nm} hurt itself in the process!`,24);}
    if(alive(def)){
      if(d.fx==='lukey'){def.stn=1;B.dizzy[ds]=90;yield* talk(`The cops swarm in! ${def.nm} is stunned!`,34);}
      else{yield* applyFx(d.fx,d.c,att,def,ds,s);yield* applyFx(d.fx2,d.c2,att,def,ds,s);}
      if(att.shk>0&&Math.random()<.4&&!def.st){def.st='bleed';yield* talk(`${def.nm} is cut deep and bleeding!`,26);}
    }

      else{G.items.cigs+=n;sfx.pick();yield* talk(`${att.nm} swiped ${n} L&M ${n>1?'packs':'pack'}!`,28);}
    }
    return;
  }
  // status moves
  yield* lunge(s,mvslot.id);
  switch(d.fx){
    case 'atkdown':def.sg.atk=Math.max(-3,def.sg.atk-1);sfx.blip();yield* talk(`${def.nm}'s attack fell!`,26);break;
    case 'accdown':def.sg.acc=Math.max(-3,def.sg.acc-1);sfx.blip();yield* talk(`${def.nm}'s aim got worse!`,26);break;
    case 'spddown':def.sg.spd=Math.max(-3,(def.sg.spd||0)-1);sfx.blip();yield* talk(`${def.nm} slows down!`,26);break;
    case 'defup':att.sg.def=Math.min(3,att.sg.def+1);sfx.heal();yield* talk(`${att.nm}'s defense rose!`,26);break;
    case 'atkup':att.sg.atk=Math.min(3,att.sg.atk+1);sfx.heal();yield* talk(`${att.nm}'s attack rose!`,26);break;
    case 'heal':{const h=Math.max(1,Math.floor(att.mhp*.4));att.hp=Math.min(att.mhp,att.hp+h);sfx.heal();yield* talk(`${att.nm} recovered health!`,26);break;}
    case 'drunkup':att.sg.atk=Math.min(3,att.sg.atk+2);if(!att.st)att.st='drunk';sfx.bottle();yield* talk(`${att.nm} chugs a beer. Attack way up, but wobbly!`,30);break;
    case 'high':att.sg.def=Math.min(3,att.sg.def+1);att.sg.acc=Math.max(-3,att.sg.acc-1);if(!att.st)att.st='high';sfx.heal();yield* talk(`${att.nm} takes a rip. Chill. Tougher, but the aim is off.`,32);break;
  }
}
function* applyFx(fx,c,att,def,ds,s){
  if(!fx||!alive(def))return;
  const hit=Math.random()*100<(c||35);
  switch(fx){
    case 'stun':if(hit){def.stn=1;B.dizzy[ds]=90;yield* talk(`${def.nm} is stunned!`,24);}break;
    case 'defdown':if(hit){def.sg.def=Math.max(-3,def.sg.def-1);sfx.blip();yield* talk(`${def.nm}'s guard is broken! Defense fell!`,26);}break;
    case 'atkdown':if(hit){def.sg.atk=Math.max(-3,def.sg.atk-1);sfx.blip();yield* talk(`${def.nm} is rattled! Attack fell!`,26);}break;
    case 'accdown':if(hit){def.sg.acc=Math.max(-3,def.sg.acc-1);sfx.blip();yield* talk(`${def.nm} can't see straight! Accuracy fell!`,26);}break;
    case 'spddown':if(hit){def.sg.spd=Math.max(-3,(def.sg.spd||0)-1);sfx.blip();yield* talk(`${def.nm}'s legs are heavy! Speed fell!`,26);}break;
    case 'bleed':if(hit&&!def.st){def.st='bleed';yield* talk(`${def.nm} is bleeding!`,26);}break;
  }
}

function* award(){

function storyLine(d,att,def,s){

/* ===== WORLD: movement, NPCs, interactions, menus ===== */
const Cs=Object.assign(Object.create(Co),{g:null,wait:0,cond:null});
const Wd={px:0,py:0,mv:0,dx:0,dy:0,fr:0,wk:0,lx:0,ly:0,banner:null,noEnc:0};
const cur=()=>MAPS[G.map];
const DX=[0,0,-1,1],DY=[1,-1,0,0];
const tileAt=(m,x,y)=>(x<0||y<0||x>=m.w||y>=m.h)?TL.WALL:m.t[y*m.w+x];
const npcsHere=()=>cur().npcs.filter(n=>!G.flags['gone_'+n.id]);
const npcAt=(x,y)=>npcsHere().find(n=>n.x===x&&n.y===y);
const defeated=n=>!!G.flags['d_'+n.id];
function enterMap(id,x,y,dir){
  G.map=id;G.x=x;G.y=y;G.dir=dir;Wd.px=x*T;Wd.py=y*T;Wd.mv=0;Wd.lx=x;Wd.ly=y;
  const m=cur();playSong(m.song);
  m.npcs.forEach(n=>{n.px=n.x*T;n.py=n.y*T;});
  Wd.banner={t:m.name,f:110};
}
function blocked(x,y){
  const m=cur(),t=tileAt(m,x,y);
  return SOLID.has(t)||!!npcAt(x,y);
}
function tryMove(d){
  G.dir=d;const nx=G.x+DX[d],ny=G.y+DY[d];
  if(blocked(nx,ny)){if(!Wd.bumped){sfx.bump();Wd.bumped=8;}return;}
  Wd.lx=G.x;Wd.ly=G.y;Wd.mv=T;Wd.dx=DX[d];Wd.dy=DY[d];
}
function stepMove(){
  const sp=K.b?4:2;
  Wd.px+=Wd.dx*sp;Wd.py+=Wd.dy*sp;Wd.mv-=sp;
  if(Wd.mv<=0){
    G.x+=Wd.dx;G.y+=Wd.dy;Wd.px=G.x*T;Wd.py=G.y*T;Wd.mv=0;
    G.steps++;Wd.wk^=1;Wd.fr=Wd.wk?1:2;
    if(G.steps%2===0)sfx.step();
    onStep();
  }
}
function onStep(){
  const m=cur();
  const w=m.warps.find(w=>w.x===G.x&&w.y===G.y);
  if(w){doWarp(w);return;}
  const it=m.items.find(i=>i.x===G.x&&i.y===G.y&&!G.flags['got_'+i.id]);
  if(it){
    G.flags['got_'+it.id]=1;G.items[it.it]=(G.items[it.it]||0)+it.n;sfx.pick();
    say(`Found ${it.n>1?it.n+' ':''}${IT[it.it].n}${it.it==='cigs'&&it.n>1?'':''}!`+(it.it==='perogi'?' Baba would be proud.':''));
    return;
  }
  if(checkSight())return;
  if(ENC.has(tileAt(m,G.x,G.y))&&m.enc&&G.steps>Wd.noEnc&&Math.random()<.12)startWild();
}
function doWarp(w){
  if(w.req&&!G.flags[w.req]){
    Cs.run(function*(){
      sfx.bump();yield* talk(w.deny,0);
      G.x=Wd.lx;G.y=Wd.ly;Wd.px=G.x*T;Wd.py=G.y*T;
    }());
    return;
  }
  sfx.door();
  fadeTo(()=>{enterMap(w.to,w.tx,w.ty,w.dir);Cs.run((function*(){yield 20;checkSight();})());});
}
function checkSight(){
  const m=cur();
  for(const n of npcsHere()){
    if(!n.tr||defeated(n))continue;
    for(let k=1;k<=n.tr.sight;k++){
      const x=n.x+DX[n.dir]*k,y=n.y+DY[n.dir]*k;
      if(x===G.x&&y===G.y){Cs.run(challenge(n));return true;}
      if(SOLID.has(tileAt(m,x,y))||npcAt(x,y))break;
    }
  }
  return false;
}
function* npcStep(n,d){
  n.dir=d;const tx=n.x+DX[d],ty=n.y+DY[d];
  for(let i=0;i<8;i++){n.px+=DX[d]*2;n.py+=DY[d]*2;yield 1;}
  n.x=tx;n.y=ty;n.px=tx*T;n.py=ty*T;
}
function faceTo(n,x,y){
  const dx=x-n.x,dy=y-n.y;
  n.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0);
}
function* challenge(n){
  n.excl=34;sfx.crit();yield 38;n.excl=0;
  while(Math.abs(n.x-G.x)+Math.abs(n.y-G.y)>1){
    const dx=G.x-n.x,dy=G.y-n.y;
    let d;if(Math.abs(dx)>Math.abs(dy)||dy===0)d=dx<0?2:3;else d=dy<0?1:0;
    if(blocked(n.x+DX[d],n.y+DY[d])){break;}
    yield* npcStep(n,d);
  }
  faceTo(n,G.x,G.y);G.dir=({0:1,1:0,2:3,3:2})[n.dir];
  yield* talk(n.tr.pre,0);
  if(n.tr.gag){
    yield* talk('Dougie winds up a bottle for a big throw... "Watch this!"',0);
    sfx.bottle();yield 20;
    yield* talk('The bottle slips behind him and comes right back down!',0);
    sfx.ow();Fx.shake=22;Fx.flashCol='#ffd23a';Fx.flash=6;yield 22;
    yield* talk('CLONK!! Right in the nuts!!!',0);
    n.tr.hurt=1;
  }
  yield* fight(n);
}
function* fight(n){
  let res=null,rec=null;
  const foes=n.tr.team.map(([s,l,nm])=>mkMon(s,l,nm));
  if(n.tr.hurt){foes[0].hp=Math.max(1,foes[0].hp-Math.floor(foes[0].mhp*.25));n.tr.hurt=0;}
  fadeTo(()=>startBattle({tr:n.tr,name:n.tr.name,look:n.look,npcId:n.id,foes,boss:n.boss||null,done:(r,m)=>{res=r;rec=m;G.mode='world';}}));
  yield()=>res!==null;
  playSong(cur().song);
  Wd.noEnc=G.steps+4;
  if(res==='win'){
    G.flags['d_'+n.id]=1;
    if(typeof plCount==='function')plCount('win',1);
    if(G.crew){G.crew.wins=(G.crew.wins||0)+1;crewGain(n.boss?60:(n.tr.team.length>1?30:14));}
    if(n.tr.join)yield* talk(`${n.tr.name} respects you now. Maybe ask him to join your crew once you have one.`,0);
    if(n.boss==='pSmokey'){yield* ending();return;}
    if(n.boss)yield* talk(`The ${PATCHES.filter(p=>G.flags[p]).length} patch${PATCHES.filter(p=>G.flags[p]).length>1?'es':''} on your jumpsuit show everyone who runs this place.`,0);
  }else if(res==='lose'){yield* whiteout();}
}
function* whiteout(){
  fadeTo(null);yield()=>Fx.fade>=1;Fx.st=0;
  G.items.cigs=Math.floor(G.items.cigs/2);G.gang.forEach(m=>{m.hp=m.mhp;m.st=null;});
  enterMap('med',8,9,1);
  yield 30;Fx.st=2;yield 14;
  yield* talk('Nurse Rhonda: Found you face down in the hall. I patched you up. It cost half your smokes.',0);
}
function startWild(){
  const m=cur(),tot=m.enc.reduce((a,e)=>a+e[3],0);let r=Math.random()*tot,e=m.enc[0];
  for(const x of m.enc){r-=x[3];if(r<=0){e=x;break;}}
  const foe=mkMon(e[0],ri(e[1],e[2]),pick(WILDNAMES));
  Cs.run((function*(){
    sfx.crit();Fx.flashCol='#fff';Fx.flash=8;yield 20;
    let res=null;
    fadeTo(()=>startBattle({foes:[foe],name:foe.nm,done:(r)=>{res=r;G.mode='world';}}));
    yield()=>res!==null;
    playSong(cur().song);Wd.noEnc=G.steps+5;
    if(res==='lose')yield* whiteout();
  })());
}

  [TL.BUNK]:['A bunk. Thin as a pancake.'],[TL.TOILET]:['No. Just no.'],[TL.LOCKER]:['Empty locker. Smells like feet.'],[TL.SINK]:['A steel sink. The water is brown-ish.'],

  [TL.LAUND]:['A washing machine. Orange. All the clothes are orange.'],[TL.BED]:['A hospital bed. Clean sheets. A luxury.'],[TL.TABLE]:['A steel table bolted to the floor.'],
  [TL.GATE]:['A steel gate. Locked.'],[TL.FENCE]:['Chain-link. Razor wire on top. Not today.'],[TL.WIRE]:['Razor wire. Hard pass.'],[TL.TOWER]:['A guard tower. A guard waves. You do not wave back.']};
function interact(){
  const m=cur(),fx=G.x+DX[G.dir],fy=G.y+DY[G.dir];
  let n=npcAt(fx,fy);
  if(!n&&tileAt(m,fx,fy)===TL.COUNTER){const n2=npcAt(fx+DX[G.dir],fy+DY[G.dir]);if(n2&&n2.reach)n=n2;}
  if(n){faceTo(n,G.x,G.y);talkNpc(n);return;}
  const t=tileAt(m,fx,fy);
  if(t===TL.TRAY){tray(fx,fy);return;}
  if(FLAVOR[t])say(pick(FLAVOR[t]));
}
function tray(x,y){
  const key=G.map+x+'_'+y;
  if((G.trays[key]||0)>G.steps){say('The tray is empty. The tray ladies are glaring at you.');return;}
  G.trays[key]=G.steps+260;
  const r=Math.random();
  if(r<.45){G.items.perogi++;sfx.pick();say('You sneak a hot perogi off the tray! Potato and cheese.');}
  else if(r<.7){G.items.perogi+=2;sfx.pick();say('Jackpot! Two fresh perogis, still steaming!');}
  else if(r<.84){G.items.shark=(G.items.shark||0)+1;sfx.pick();say('A SHARK CARD taped under the tray! Bonus!');}
  else if(r<.9){G.items.cigs+=2;sfx.pick();say('No perogis, but somebody left 2 L&M packs under the tray.');}
  else say('Cold mashed potatoes. The ladies laugh at you.');
}
function talkNpc(n){
  if(n.br)return brawlInteract(n);
  if(n.tr){
    if(defeated(n)){
      if(n.tr.join&&!G.flags['gone_'+n.id]){openMenu({x:100,y:60,w:136,title:n.tr.name.toUpperCase().slice(0,18),items:[{l:'TALK',f:()=>say(n.tr.post||'...')},{l:'ASK TO JOIN',f:()=>askStory(n)},{l:'LEAVE',f:()=>{}}]});return;}
      say(n.tr.post||'...');return;}
    Cs.run((function*(){yield* challenge(n);})());return;
  }
  const s=n.say||['...'];
  if(s[0]==='inmate')return talkInmate(n);
  if(s[0]==='intake')return officer();
  if(s[0]==='baba')return baba();
  if(s[0]==='corey')return corey();
  if(s[0]==='nurse')return nurse();
  s.forEach(t=>say(t));
}

    localStorage.setItem(SAVEKEY,JSON.stringify({pl:G.pl,crew:G.crew,L:G.L,map:G.map,x:G.x,y:G.y,dir:G.dir,flags:G.flags,items:G.items,gang:G.gang,steps:G.steps,trays:G.trays,babaT:G.babaT||0,v:G.v,met:G.met}));
    sfx.ok();say('Game saved.');
  }catch(e){say('Could not save here. (Storage is blocked.)');}
}
function hasSave(){try{return !!localStorage.getItem(SAVEKEY);}catch(e){return false;}}
function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVEKEY));if(!d)return false;
    Object.assign(G,{pl:d.pl||PL0(),crew:d.crew||null,L:d.L||L0(),flags:d.flags,items:d.items,gang:d.gang,steps:d.steps,trays:d.trays||{},babaT:d.babaT||0,v:d.v||V0(),met:d.met||{}});
    G.gang.forEach(cleanMon);
    enterMap(d.map,d.x,d.y,d.dir);G.mode='world';return true;
  }catch(e){return false;}
}

/* ---- world update / draw ---- */
function worldUpdate(){
  brawlUpdate();plFlush();crewCheck();
  if(Wd.bumped>0)Wd.bumped--;
  if(Say.on){Say.update();return;}
  if(Menus.length){menuUpdate();return;}
  if(Cs.g){Cs.update();return;}
  if(busy())return;
  if(Wd.mv>0){stepMove();return;}
  Wd.fr=0;
  if(Pr.start){Pr.start=0;openPause();return;}
  if(Pr.a){Pr.a=0;interact();return;}
  let d=-1;
  if(K.up)d=1;else if(K.down)d=0;else if(K.left)d=2;else if(K.right)d=3;
  if(d>=0)tryMove(d);
}

function mkLook(R){
  const pk=a=>a[Math.floor(R()*a.length)];
  const L={sk:pk(SKIN),hr:pk(HAIRC),st:pk(STY),hc:pk(HATC),sh:R()<.12?pk(['#4a6aa8','#e8e8ea','#6a8a5a']):'#e8731c',ac:[],w:R()<.28};
  if(L.sh==='#e8731c')L.pn=pk(['#e8731c','#e8731c','#d4651a','#c25a14']);
  if(L.st==='bald')L.hr=L.sk;
  if(R()<.18)L.ac.push('beard');
  if(R()<.1)L.ac.push('glasses');
  if(R()<.07)L.ac.push('scar');
  if(R()<.1&&!L.ac.includes('glasses'))L.ac.push('shades');
  if(R()<.12)L.ac.push('cig');
  if(R()<.025)L.ac.push('crazy');
  if(R()<.02)L.ac.push('chin');
  if(R()<.04&&L.st!=='beanie'&&L.st!=='cap')L.ac.push('hat');
  if(R()<.2)L.sleeve='#f2f0e8';
  return L;
}

function choice(c,n){

function act(c,k){

  const r0=v.resp+v.cheer+v.fav;

  switch(k){
   case 'joke':{
    const p=.38+(c.tr==='comedian'?.25:0)+(c.tr==='sleepy'?-.1:0)+(c.tr==='holy'?-.1:0)+Math.min(.2,v.cheer*.02);
    if(chance(p)){v.resp++;v.cheer++;say(pk(JOKE_OK));if(chance(.4)){const g=spl(1,2);giveCigs(g);say(`${nm} laughs so hard he pays a "laugh tax": +${g} L&M.`);}}
    else{v.cheer=Math.max(0,v.cheer-0);say(pk(JOKE_BAD));if(chance(.25)){v.resp--;say('Respect -1');}}

   case 'compliment':{
    const p=.62+(c.tr==='fan'?.3:0)+(c.tr==='tough'?-.3:0);
    if(chance(p)){v.resp++;say(pk([`${nm} blushes. A man his size should not blush that hard.`,`${nm}: "Stop it. No, keep going."`,`${nm}: "That's the nicest thing anyone has said since the arraignment."`]));
      if(c.tr==='fan'){v.resp+=2;say('He asks you to sign his arm. You sign "RBP". It looks like a rash. Respect +2');}
      else if(chance(.3)){giveCigs(1);say('He slips you a pack. "For the compliment." +1 L&M');}}
    else{say(pk([`${nm} squints. "What do you want?"`,`${nm}: "Is this a mugging? With feelings?"`]));}
    break;}
   case 'intimidate':{
    const p=Math.max(.12,Math.min(.85,.3+v.resp*.04+(c.tr==='tough'?-.22:0)+(c.tr==='sleepy'?.2:0)+(c.tr==='paranoid'?.25:0)));
    if(chance(p)){const g=spl(1,3);giveCigs(g);v.resp+=2;heat(1);say(pk(WIN_INT));say(`+${g} L&M, Respect +2, Heat +1`);}
    else{v.resp=Math.max(-3,v.resp-1);heat(c.tr==='tough'?1:0);say(pk(FAIL_INT));say('Respect -1');}
    break;}
   case 'listen':{
    v.cheer++;
    const crime=c.crime&&c.crime.length>12?c.crime:pk(CRIME);
    say(`${nm} tells you the whole story. He is in for ${crime}`);
    say(pk([`You nod politely. Your soul leaves your body for a bit.`,`It takes 11 minutes. You learned nothing. You feel enriched.`,`By the end he cries a little. You hand him a napkin. It is a sock.`]));
    if(chance(.35)){say(`${nm}: Hey, since you listened... ${pk(RUMORS)}`);}
    else if(chance(.2)){giveCigs(1);say(`${nm} gives you 1 L&M. "Therapy fee."`);}
    break;}
   case 'bribe':{
    G.items.cigs-=2;sfx.ok();v.fav++;
    say(`You tip ${nm} 2 L&M. He pockets them without breaking eye contact. Professional.`);
    say(`${nm}: Okay. Here is something for free. ${pk(RUMORS)}`);
    if(chance(.5)){v.resp++;say('Respect +1');}
    break;}
   case 'trade':{
    G.items.perogi--;sfx.ok();v.resp+=2;
    say(`You hand ${nm} a hot perogi. He holds it like a newborn.`);
    const r=Math.random();
    if(r<.5){const g=spl(3,5);giveCigs(g);say(`${nm}: "I owe you one. Two. Five packs." +${g} L&M, Respect +2`);}
    else if(r<.8){say(`${nm}: "This changes things." ${pk(RUMORS)} Respect +2`);}
    else{G.items.perogi++;say(`${nm} cries, eats half, and gives the rest back. "I can't. I'm not worthy." +1 Perogi back, Respect +2`);}
    break;}
   case 'weed':{
    G.items.weed--;
    const risk=c.tr==='paranoid'?.55:c.tr==='holy'?.5:c.tr==='snitch'?.5:.18;
    if(chance(risk)){heat(2);v.resp--;say(c.tr==='paranoid'?`${nm}: "IS THIS A STING?" He runs in a small circle. No sale. Heat +2`:`${nm} yells "DRUGS!" in a library voice. Guard looks. You sell nothing. Heat +2`);}
    else{const g=spl(4,8);giveCigs(g);heat(1);say(pk([`Deal done. You trade a bag for ${g} L&M. Quick, clean, and a little smelly. Heat +1`,`${nm} sniffs it, nods, pays ${g} L&M. "Strong." It is oregano. He doesn't know. Heat +1`,`${g} L&M, a nod, and a handshake in six steps. You feel like a professional. Heat +1`]));}
    break;}
   case 'beer':{
    G.items.beer--;v.resp+=2;v.cheer++;
    say(`You share a prison beer with ${nm}. It tastes like regret and radiator. Beautiful.`);
    say(pk([`${nm}: "To freedom. Or snacks."`,`${nm}: "You're alright, Popstar."`,`${nm}: "Don't tell my mom. She thinks I'm at a retreat."`]));
    say('Respect +2');

    break;}
  }

}

function trySpawn(){

  const tot=w.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,A=w[0].n;
  for(const x of w){r-=x.w;if(r<=0){A=x.n;break;}}

  if(!cand.length)return;

function stepWalk(br){
  const a=br.a,b=br.b;
  // sliding between tiles
  if(a.px!==a.x*T||a.py!==a.y*T){
    const sx=Math.sign(a.x*T-a.px),sy=Math.sign(a.y*T-a.py);
    a.px+=sx*Math.min(1.7,Math.abs(a.x*T-a.px));a.py+=sy*Math.min(1.7,Math.abs(a.y*T-a.py));
    a.br.ph+=.5;return;
  }
  const dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)+Math.abs(dy)<=1){br.st='fight';br.t=0;a.br.ph=0;faceTo(a,b.x,b.y);faceTo(b,a.x,a.y);
    // crowd reacts
    npcsHere().forEach(n=>{if(n!==a&&n!==b&&!n.br&&Math.abs(n.x-a.x)+Math.abs(n.y-a.y)<=7&&n.say){faceTo(n,a.x,a.y);if(Math.random()<.4)n.excl=30;}});
    sfx.crit();return;}
  const opts=Math.abs(dx)>=Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];
  for(const [sx,sy] of opts){
    if(!sx&&!sy)continue;
    if(freeTile(a.x+sx,a.y+sy,null)){a.x+=sx;a.y+=sy;a.dir=sx<0?2:sx>0?3:sy<0?1:0;return;}
  }
  if(++br.t>40)brawlStop(br,true); // boxed in, give up
}
function hitFx(n,txt,col){const [x,z]=wpos(n);burst(x,1.1,z,10,col||[1,.85,.4],{speed:.11,life:20,size:.28});flt(x,1.9,z,txt,'#ffe36a',true);if(inView(n)){sfx.hit();CAM.shake=Math.max(CAM.shake,5);}}
function stepFight(br){
  const a=br.a,b=br.b;br.t++;
  const att=br.turn?b:a,def=br.turn?a:b;
  if(!br.kind){br.kind=pick(MOVES);br.cyc=0;br.hit=false;att.br.kind=br.kind;}

    br.hit=true;

  }

  a.br.rec=Math.max(-1,a.br.rec-1>0?a.br.rec-1:(a.br.rec>0?0:a.br.rec+1));b.br.rec=Math.max(-1,b.br.rec-1>0?b.br.rec-1:(b.br.rec>0?0:b.br.rec+1));
  if(br.ha<=0||br.hb<=0||br.t>620){

    a.br.k=b.br.k=0;a.br.kind=b.br.kind=null;
    if(br.bet){

      else if(draw){G.items.cigs+=br.bet.amt;say('Draw! Bets refunded. Everybody boos. Nobody knows who to boo.');}
      else say(pick(['You lose the bet. Your L&M packs wave goodbye.','Wrong guy. Tuna pockets your smokes without looking up.']));
    }
  }
}
function brawlUpdate(){
  // cleanup brawls from other maps
  for(let i=BRW.length-1;i>=0;i--){if(BRW[i].map!==G.map)brawlStop(BRW[i],true);}
  for(let i=FLT.length-1;i>=0;i--){FLT[i].t++;if(FLT[i].t>70)FLT.splice(i,1);}
  for(const br of BRW.slice()){
    if(br.st==='walk')stepWalk(br);
    else if(br.st==='fight')stepFight(br);
    else if(br.st==='end'){
      br.endT++;
      if(br.endT===1&&!br.win){faceTo(br.a,br.b.x,br.b.y);}
      if(br.endT>300)brawlStop(br,true);
    }
  }
  // spawn
  const z=zoneNow();
  if(!Say.on&&!Menus.length&&!Cs.g&&BRW.length<(z.d>.7?2:1)&&G.mode==='world'){
    brawlCD.t--;
    if(brawlCD.t<=0){brawlCD.t=Math.floor((1700-1300*z.d)*(.6+Math.random()*.8));if(Math.random()<.35+.6*z.d)trySpawn();}
  }
}

/* ---- rendering helpers (called from the 3D world renderer) ---- */
function brawlRig(n,nx,nz,tt){
  const s=n.br,br=n.brw,o=s.o,[ox,oz]=wpos(o);
  const dx=ox-nx,dz=oz-nz,yaw=Math.atan2(dx,dz),len=Math.hypot(dx,dz)||1,ux=dx/len,uz=dz/len;
  let off=0,pose={bob:0,armL:[-1,.3],armR:[-1,-.3]},flash=0,y=0,lean=0,roll=0;
  const sw=Math.sin(tt*9+n.x);
  if(br.st==='walk'&&n.brw.a===n){pose=poseWalk(s.ph,1.4);pose.armL=[-1.1,.2];pose.armR=[-1.1,-.2];}
  else if(s.down){
    roll=-1.45;y=.32;lean=0;pose={armL:[.3,0],armR:[-.2,0]};
    if(br.endT>230){const k=(br.endT-230)/70;roll=-1.45*(1-k);y=.32*(1-k);}
  }
  else if(s.wn){pose={bob:Math.abs(sw)*.06,armL:[-2.6+sw*.3,0],armR:[-3+Math.sin(tt*11)*.4,0]};}
  else if(br.st==='end'){pose={bob:0,armL:[-.4,.1],armR:[-.4,-.1]};}
  else{
    pose={bob:Math.abs(sw)*.03,armL:[-1+sw*.08,.3],armR:[-1-sw*.08,-.3]};
    if(s.kind){
      const k=s.k,ex=k<.35?-.5*Math.sin(k/.35*Math.PI/2):k<.55?-.5+1.5*((k-.35)/.2):1-((k-.55)/.45);
      const f=Math.max(ex,0),bk=Math.max(-ex,0);
      switch(s.kind.k){
        case 'jab':pose.armR=[-1.6*f+.4*bk-1*(1-f)*(1-bk),0];off=.32*f;break;
        case 'hook':pose.armR=[-1.35,0];pose.armRy=1.2*bk-1.5*f;pose.twist=.5*bk-.5*f;off=.2*f;break;
        case 'kick':pose.legR=-1.5*f+.5*bk;lean=-.18*f;pose.armL=[-.6,.8];pose.armR=[-.6,-.8];off=.15*f;break;
        case 'butt':pose.headX=-.9*f;lean=.25*f;off=.3*f;break;
        case 'tackle':lean=.75*f-.2*bk;pose.armL=[-1.6,.2];pose.armR=[-1.6,-.2];off=.7*f;break;
      }
    }
    if(s.rec>0){const r=s.rec/16;off-=.35*r;pose.headX=(pose.headX||0)+.7*r;flash=r>.5?.75:0;lean-=.3*r;}
    else if(s.rec<0){off-=0;}
  }
  pose.lean=lean;pose.roll=roll;
  // sideways wobble so the fighters circle a little
  const side=(!s.down&&br.st==='fight')?Math.sin(tt*2.2+n.x)*.06:0;
  return {x:nx+ux*off-uz*side,y,z:nz+uz*off+ux*side,yaw,pose,flash};

  heavy:{n:'HEAVY HANDS',k:'hit',need:80,d:'Landed 80 punches. ATK +12%'},

function plCount(k,n){const p=pl();p.cnt[k]=(p.cnt[k]||0)+n;plTraits();}
function plTraits(){
  const p=pl();let n=0;
  for(const id in TRAITD){const t=TRAITD[id];if(!p.tr[id]&&(p.cnt[t.k]||0)>=t.need){p.tr[id]=1;p.q.push(`NEW TRAIT: ${t.n}!\n${t.d}`);n++;}}
  if(n){const b=G.gang.find(m=>m.s==='bandit');if(b){const oh=b.mhp;mstat(b);b.hp=Math.min(b.mhp,b.hp+Math.max(0,b.mhp-oh));}}

/* applied at the end of mstat(): Bandit's allocated stats + traits, then the crew's level bonus for everyone */
function statHook(m){
  if(m.s==='bandit'&&G.pl){
    const p=G.pl,s=p.s;
    m.atk+=s.str*2+Math.floor(s.hnd/2);m.spd+=s.agi*2+Math.floor(s.hnd/2);m.mhp+=s.end*5;m.def+=s.chn*2;
    if(p.tr.heavy)m.atk=Math.floor(m.atk*1.12);if(p.tr.killer)m.atk=Math.floor(m.atk*1.08);
    if(p.tr.ironchin)m.def=Math.floor(m.def*1.12);if(p.tr.foot)m.spd=Math.floor(m.spd*1.12);if(p.tr.cardio)m.mhp=Math.floor(m.mhp*1.1);

function smoothSprite(L,dir,fr,pz,pk){

    const cx=c.getContext('2d');cx.drawImage(glc,Math.round((glc.width-S)/2),Math.round((glc.height-S)/2),S,S,0,0,S,S);

function frame(){
  g.setTransform(S,0,0,S,0,0);g.imageSmoothingEnabled=false;g.clearRect(0,0,W,H);

  if(Fx.shake>0&&G.mode!=='battle')g.translate(ri(-2,2),ri(-1,1));
  fxUpdate();
  switch(G.mode){
    case 'title':titleUpdate();break;
    case 'intro':introUpdate();break;
    case 'world':worldUpdate();break;
    case 'battle':if(Say.on)Say.update();else if(Menus.length)menuUpdate();else Co.update();break;
    case 'end':endUpdate();break;
    case 'name':nameUpdate();break;
  }
  switch(G.mode){
    case 'title':titleDraw();break;
    case 'intro':introDraw();break;
    case 'world':worldDraw();break;
    case 'battle':battle3Draw();break;
    case 'end':endDraw();break;
    case 'name':nameDraw();break;
  }
  Say.draw();menuDraw();fxDraw();
  for(const k in Pr)Pr[k]=0;
}
let last=0,acc=0;
function showErr(e){const p=document.getElementById('err');if(p&&p.textContent.length<1500){p.style.display='block';p.textContent+=(e&&e.stack?e.stack.split('\n').slice(0,3).join(' | '):e)+'\n';}}
function raf(t){
  const dt=Math.min(100,t-last||16);last=t;acc+=dt;
  let n=0;while(acc>=16.67&&n<4){try{frame();}catch(e){showErr(e);}acc-=16.67;n++;}
  if(n===4)acc=0;
  requestAnimationFrame(raf);
}
function boot(){
  if(boot.done)return;boot.done=1;
  try{if(glInit())R3.atlas=glTex(smoothAtlas(),false);}catch(e){showErr(e);}
  try{resize();openTitle();}catch(e){showErr(e);}
  requestAnimationFrame(raf);
}
(function(){
  let ok=false;
  try{document.fonts.load('8px "Press Start 2P"').then(()=>{boot();}).catch(boot);}catch(e){boot();}
  setTimeout(boot,1800);
})();
